---
# Reachable only over the tailnet - apps/tailscale-operator/manifests/ingresses.yaml
# is Grafana's only exposed route (no in-cluster port-forward assumed here).
# tailnet_domain lives in group_vars/all/main.yaml.
grafana_url: "https://grafana.{{ tailnet_domain }}"

# How the role decides whether a dashboard needs importing (tasks/import_dashboard.yml). Each save it
# makes adds one tag to the dashboard, "ansible:<fingerprint of what was posted>@v<version it produced>",
# and the next run reads it back:
#   - the dashboard is still at that version, same fingerprint  -> unchanged, nothing is written
#   - still at that version, different fingerprint             -> grafana.com (or the default datasource)
#                                                                  changed: update
#   - it has moved past that version                           -> someone saved it in Grafana since: left
#                                                                  alone and reported, unless
#                                                                  grafana_dashboards_overwrite_edited
#   - the dashboard is chart-provisioned                       -> skipped (Grafana refuses API writes to those)
#   - it does not exist yet                                    -> created
#   - it exists with no tag (imported by an older role)        -> adopted once, which writes the tag
# The message below is also recorded on each save, for the version history.
grafana_dashboards_import_message: 'Imported by ansible (roles/grafana_dashboards)'
# true: replace dashboards that were edited in Grafana after the last import (loses those edits).
grafana_dashboards_overwrite_edited: false
# true: re-import every dashboard regardless of the checks above (e.g. to put them all back).
grafana_dashboards_force: false

# grafana.com dashboard IDs, limited to tech this cluster actually scrapes
# today (confirmed live: apps/*/manifests/vm*scrape.yaml + what
# apps/victoria-metrics's vmagent picks up via selectAllByDefault: true).
#
# Deliberately excludes VictoriaMetrics's own vmagent/vmalert/vmsingle/operator
# dashboards - confirmed live via GET /api/search that apps/victoria-metrics's
# defaultDashboards already provisions all four (tagged vm-k8s-stack), not just
# the two (victoriametrics-operator, victoriametrics-vmalert) explicitly
# toggled in apps/victoria-metrics/values.yaml - the chart's own remaining
# defaults were already enabled. Re-adding their grafana.com IDs here would
# just 400 ("Cannot save provisioned dashboard") since Grafana refuses to let
# the API touch a ConfigMap-provisioned dashboard - tasks/import_dashboard.yml
# treats that specific error as a skip, not a failure, so this is a safety
# net for future entries, not a reason to rely on it for these four.
#
# Dashboards written for this repo (PgBouncer via CNPG, Vector) are ConfigMaps in apps/victoria-metrics/manifests,
# not in this list: no community dashboard matches their metric names.
#
# Argo CD and OpenSearch added once their own VM*Scrapes existed
# (apps/argocd-metrics/, apps/opensearch/manifests/vmservicescrape.yaml).
# Tailscale deliberately still excluded - the only dashboard found
# (24177, "Tailscale / Overview") is built from tailscale-mixin, which
# polls the Tailscale *admin API* (devices/users/auth keys), a completely
# different data source from the tailscaled proxy /metrics this cluster's
# ProxyClass now exposes - confirmed via its own source repo, not assumed.
# Importing it would just show empty/broken panels. redis-operator's own
# controller metrics (apps/redis-operator-metrics/) have no dedicated
# dashboard either - the one OT-Container-Kit project doc references is
# for the *managed Redis clusters* (already covered by the "Redis
# (Kubernetes mode)" entry below), not the operator controller pod.
grafana_community_dashboards:
  - id: 22705
    name: 'Longhorn'
  # Longhorn's own metrics, actively maintained (rev 14, 2026) and far more downloaded.
  - id: 16888
    name: 'Longhorn Monitoring & Backups'
  - id: 20417
    name: 'CloudNativePG'
  - id: 20528
    name: 'Temporal Server Metrics'
  - id: 19157
    name: 'Redis (Kubernetes mode)'
  # The standard redis_exporter dashboard (replication, memory, commands, keyspace).
  - id: 763
    name: 'Redis Dashboard for Prometheus Redis Exporter 1.x'
  # Sentinel: masters, master status, connected clients. Needs the sentinel's exporter sidecar
  # (apps/redis/manifests/redis-sentinel.yaml) - the redis_sentinel_* metrics come from it.
  - id: 9570
    name: 'Redis Sentinel'
  - id: 13768
    name: 'Blocky'
  # Argo CD's two maintained dashboards (operational + per-application); replaces the 2021 one (14584).
  - id: 19993
    name: 'ArgoCD / Operational / Overview'
  - id: 19974
    name: 'ArgoCD / Application / Overview'
  - id: 20827
    name: 'OpenSearch Prometheus Exporter'
  - id: 22010
    name: 'Trivy Operator - Image CVE Data'
  - id: 16337
    name: 'Trivy Operator - Vulnerabilities'
  - id: 20501
    name: 'Zot'
  # UnPoller (apps/unpoller/). The Prometheus-datasource versions of the UniFi-Poller dashboards. The UDM is the
  # gateway, so "USG Insights" is its dashboard. "Client DPI" (11310) only has data with UP_UNIFI_DEFAULT_SAVE_DPI=true.
  - id: 11311
    name: 'UniFi-Poller: Network Sites'
  - id: 11313
    name: 'UniFi-Poller: USG Insights'
  - id: 11312
    name: 'UniFi-Poller: USW Insights'
  - id: 11314
    name: 'UniFi-Poller: UAP Insights'
  - id: 11315
    name: 'UniFi-Poller: Client Insights'
