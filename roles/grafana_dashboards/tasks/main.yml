---
# Imports community dashboards from grafana.com into apps/victoria-metrics's
# Grafana over its Tailscale Operator ingress (apps/tailscale-operator/manifests/ingresses.yaml).
#
# Uses the documented POST /api/dashboards/db endpoint, not the undocumented
# POST /api/dashboards/import the UI's own Import wizard uses (see
# https://github.com/grafana/grafana/issues/7029 - Grafana has never
# published a schema for it). Confirmed live against this cluster's actual
# Grafana 13.1.1: /api/dashboards/db still works fully - Grafana 13 only
# logs a deprecation warning pointing at the newer
# /apis/dashboard.grafana.app/v1 API, which requires a service account
# Bearer token, a needless dependency here since /api/dashboards/db needs
# none.
#
# No credentials needed at all: apps/victoria-metrics/values.yaml gives
# anonymous requests org_role: Admin (auth.anonymous.enabled: true) -
# confirmed live, GET /api/datasources and POST /api/dashboards/db both
# succeed unauthenticated.

- name: Look up this Grafana's datasources
  ansible.builtin.uri:
    url: '{{ grafana_url }}/api/datasources'
    return_content: true
  register: grafana_datasources
  check_mode: false   # read-only; lets --check show the real decisions
  tags:
    - grafana
    - dashboards

- name: Determine the default datasource's UID
  ansible.builtin.set_fact:
    grafana_default_datasource_uid: >-
      {{ (grafana_datasources.json | selectattr('isDefault', 'equalto', true) | map(attribute='uid') | first)
         | default(grafana_datasources.json[0].uid) }}
  tags:
    - grafana
    - dashboards

- name: Start the per-dashboard results list
  ansible.builtin.set_fact:
    grafana_dashboard_results: []
  tags:
    - grafana
    - dashboards

- name: Import each community dashboard
  ansible.builtin.include_tasks: import_dashboard.yml
  loop: '{{ grafana_community_dashboards }}'
  loop_control:
    loop_var: dashboard
    label: '{{ dashboard.name }}'
  tags:
    - grafana
    - dashboards

# One line per outcome, so a run says what it actually did instead of "ok" for everything.
- name: Summarise what the import did
  ansible.builtin.debug:
    msg: |-
      {% for action, label in [('created', 'Created'), ('updated', 'Updated (grafana.com or datasource changed)'), ('unchanged', 'Unchanged (not written)'), ('provisioned', 'Skipped - provisioned by the VictoriaMetrics chart'), ('edited', 'LEFT ALONE - edited in Grafana since the last import')] %}
      {{ label }}: {{ grafana_dashboard_results | selectattr('action', 'equalto', action) | map(attribute='name') | list | join(', ') or '-' }}
      {% endfor %}
  tags:
    - grafana
    - dashboards

- name: Warn about dashboards that were edited by hand
  ansible.builtin.debug:
    msg: >-
      {{ grafana_dashboard_results | selectattr('action', 'equalto', 'edited') | map(attribute='name') | list | join(', ') }}
      were changed in Grafana after the last import, so this run did not overwrite them. Re-run with
      -e grafana_dashboards_overwrite_edited=true to replace them (their edits are lost), or leave them.
  when: grafana_dashboard_results | selectattr('action', 'equalto', 'edited') | list | length > 0
  tags:
    - grafana
    - dashboards
