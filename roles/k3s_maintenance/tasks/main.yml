---
- name: deploy k3s-maintenance script
  ansible.builtin.copy:
    src: k3s-maintenance
    dest: /usr/local/bin/k3s-maintenance
    mode: '0755'
    owner: root
    group: root
  tags:
    - k3s_maintenance

# kubectl-cnpg: the CloudNativePG kubectl plugin. k3s-maintenance uses
# `kubectl cnpg promote` to do a clean switchover before draining a node that
# hosts a Postgres primary (CNPG's PodDisruptionBudget blocks evicting the
# primary, so a plain drain would hang). Pinned release; sha256 of the arm64
# tarball recorded here. To upgrade: bump the version and checksum, and delete
# /usr/local/bin/kubectl-cnpg on the nodes (the unarchive step's `creates`
# guard skips otherwise). Keep it in step with the operator version in apps/cloudnative-pg.
- name: download the CloudNativePG kubectl plugin
  ansible.builtin.get_url:
    url: "https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v{{ k3s_maintenance_cnpg_version }}/kubectl-cnpg_{{ k3s_maintenance_cnpg_version }}_linux_arm64.tar.gz"
    dest: "/tmp/kubectl-cnpg-{{ k3s_maintenance_cnpg_version }}.tar.gz"
    checksum: "sha256:{{ k3s_maintenance_cnpg_sha256 }}"
    mode: '0644'
  vars:
    k3s_maintenance_cnpg_version: "1.30.1"
    k3s_maintenance_cnpg_sha256: "6ffad753bbbf5d353576967233063f2ba0adb843a4e7ef5ff4cb7384b2716d5e"
  tags:
    - k3s_maintenance

- name: install the kubectl-cnpg binary
  ansible.builtin.unarchive:
    src: "/tmp/kubectl-cnpg-{{ k3s_maintenance_cnpg_version }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include:
      - kubectl-cnpg
    mode: '0755'
    owner: root
    group: root
    creates: /usr/local/bin/kubectl-cnpg
  vars:
    k3s_maintenance_cnpg_version: "1.30.1"
  tags:
    - k3s_maintenance

# Agent (worker) nodes run no API server and ship no kubeconfig, so `kubectl`
# there falls back to localhost:8080 and fails with "connection refused".
# That made on-node maintenance (k3s-maintenance -e, or a plain
# `sudo kubectl drain`) impossible from an agent. Give agents a kubeconfig
# that talks to the first server's API (the same endpoint they join through,
# k3s_server in group_vars/k3s_cluster/k3s.yaml), at the path k3s's bundled
# kubectl already reads by default.
#
# SECURITY: this is the cluster-admin kubeconfig, copied from a server, so a
# compromised agent can administer the whole cluster. Root-only (0600) so
# only `sudo` reaches it. Accepted deliberately for a homelab; remove this
# task (and the file) if agents should stay credential-free. It also pins the
# API endpoint to the first server - if that server is down, on-node kubectl
# fails until it's back (use the laptop or another server meanwhile).
- name: read the cluster kubeconfig from the first server
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  delegate_to: "{{ groups['server'][0] }}"
  register: k3s_maintenance_kubeconfig
  when: inventory_hostname in groups['agent']
  no_log: true
  tags:
    - k3s_maintenance

- name: install the kubeconfig on agent nodes
  ansible.builtin.copy:
    content: "{{ k3s_maintenance_kubeconfig.content | b64decode | regex_replace('https://127\\.0\\.0\\.1:6443', k3s_server) }}"
    dest: /etc/rancher/k3s/k3s.yaml
    mode: '0600'
    owner: root
    group: root
  when: inventory_hostname in groups['agent']
  no_log: true
  tags:
    - k3s_maintenance

