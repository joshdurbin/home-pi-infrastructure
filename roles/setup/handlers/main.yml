---
# Fires once per host (standard Ansible handler dedup - multiple tasks
# notifying the same handler name still only run it once, after all tasks in
# this play complete) when /boot/firmware/config.txt actually changed.
#
# Deliberately does NOT reboot or drain anything: reboots are done by hand, one
# node at a time (docs/REFERENCE.md "Node Maintenance"). This only reports
# which hosts need one.
- name: restart pi after config change
  ansible.builtin.debug:
    msg: >-
      /boot/firmware/config.txt changed on {{ inventory_hostname }};
      the new boot config takes effect after a manual reboot (drain first,
      one node at a time - see docs/REFERENCE.md "Node Maintenance").

- name: reload systemd and restart apt-daily-upgrade timer
  ansible.builtin.systemd:
    name: apt-daily-upgrade.timer
    daemon_reload: true
    enabled: true
    state: restarted
