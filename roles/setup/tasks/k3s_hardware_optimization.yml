---

- name: reduce GPU memory allocation for k3s
  lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^gpu_mem='
    line: 'gpu_mem=16'
    insertafter: EOF
  notify: restart pi after config change
  tags:
    - k3s_optimization

- name: disable camera interface
  lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^dtparam=camera='
    line: 'dtparam=camera=off'
    insertafter: EOF
  notify: restart pi after config change
  tags:
    - k3s_optimization

- name: disable i2c HAT support
  lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^dtparam=i2c_arm='
    line: 'dtparam=i2c_arm=off'
    insertafter: EOF
  notify: restart pi after config change
  tags:
    - k3s_optimization

- name: disable spi HAT support
  lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^dtparam=spi='
    line: 'dtparam=spi=off'
    insertafter: EOF
  notify: restart pi after config change
  tags:
    - k3s_optimization

- name: disable 1-wire HAT support
  lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^dtparam=1wire='
    line: 'dtparam=1wire=off'
    insertafter: EOF
  notify: restart pi after config change
  tags:
    - k3s_optimization

- name: disable HDMI (if not needed)
  lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^dtoverlay=disable-hdmi'
    line: 'dtoverlay=disable-hdmi'
    insertafter: EOF
  notify: restart pi after config change
  tags:
    - k3s_optimization

# Mild overclock, chosen to avoid any voltage increase:
# - Pi 4: arm_boost=1 (1500MHz -> 1800MHz) is documented as a free, no-voltage
#   turbo step, but only applies to rev 1.4/1.5 boards. These are rev 1.1 -
#   confirmed via /proc/cpuinfo and a live reboot test that arm_boost=1 (which
#   was already the stock default here) has zero effect: still 1500MHz either
#   way. No zero-voltage option exists for this hardware, so left at stock -
#   see the arm_boost=absent task below and git history for the finding.
# - Pi 5: arm_freq=2600 (stock is 2400MHz) is a modest, community-tested
#   stable bump with no over_voltage_delta needed - Pi 5's DVFS supplies
#   the right voltage for this frequency automatically. Backed by active
#   fan cooling here, which is the right cooling tier for it. Confirmed live
#   on all 3 Pi 5 nodes via /sys/.../scaling_max_freq after reboot.
# A reboot is required for any config.txt change to take effect. The
# "restart pi after config change" handler (roles/setup/handlers/main.yml)
# only flags the host (sets pi_config_reboot_required) - the actual
# drain -> reboot -> uncordon sequence runs in a separate, serial:1 play in
# site.yml ("Reboot nodes with pending config.txt changes"), which is what
# guarantees only one node is ever down at a time. See that play's comment
# for why this can't just happen directly in the handler.
- name: remove arm_boost line from Pi 4 (confirmed no effect on rev 1.1 boards)
  lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^arm_boost='
    state: absent
  when: board_model == 'pi4'
  notify: restart pi after config change
  tags:
    - k3s_optimization

- name: mild overclock on Pi 5 (2.4GHz -> 2.6GHz, no voltage change)
  lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^arm_freq='
    line: 'arm_freq=2600'
    insertafter: EOF
  when: board_model == 'pi5'
  notify: restart pi after config change
  tags:
    - k3s_optimization
