---
- name: Prepare Longhorn storage directory
  when: inventory_hostname in groups.get('pi5', [])
  block:
    - name: Create Longhorn data directory
      ansible.builtin.file:
        path: /var/lib/longhorn
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Set directory permissions for Longhorn
      ansible.builtin.file:
        path: /var/lib/longhorn
        owner: root
        group: root
        mode: '0755'

    - name: Get current disk usage
      ansible.builtin.shell: |
        df -B1 /var/lib/longhorn | awk 'NR==2 {print $2}'
      register: disk_total
      changed_when: false

    - name: Display storage allocation info
      ansible.builtin.debug:
        msg: |
          Longhorn storage directory prepared at /var/lib/longhorn
          Available space: {{ (disk_total.stdout | int / 1024 / 1024 / 1024) | round(2) }} GB
          Allocated limit: 80 GB (soft limit, monitor usage)
