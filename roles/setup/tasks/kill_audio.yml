---
# The three ALSA services below save/restore mixer state; they're pointless on
# every node except the [audio] one (rpi-3bplus-1), where they keep the USB
# DAC's volume across reboots. The onboard-audio disable (in config.txt.j2) applies
# everywhere: that node plays through its USB DAC, not the Pi's jack.
- name: disable alsa-state.service
  ansible.builtin.systemd:
    name: alsa-state
    state: stopped
    enabled: false
  when:
    - "'audio' not in group_names"
    - setup_units['alsa-state.service'].LoadState != 'not-found'
    - setup_units['alsa-state.service'].UnitFileState == 'enabled' or setup_units['alsa-state.service'].ActiveState == 'active'
  tags:
    - kill_audio

- name: disable alsa-restore.service
  ansible.builtin.systemd:
    name: alsa-restore
    state: stopped
    enabled: false
  when:
    - "'audio' not in group_names"
    - setup_units['alsa-restore.service'].LoadState != 'not-found'
    - setup_units['alsa-restore.service'].UnitFileState == 'enabled' or setup_units['alsa-restore.service'].ActiveState == 'active'
  tags:
    - kill_audio

- name: disable alsa-utils.service
  ansible.builtin.systemd:
    name: alsa-utils
    state: stopped
    enabled: false
  when:
    - "'audio' not in group_names"
    - setup_units['alsa-utils.service'].LoadState != 'not-found'
    - setup_units['alsa-utils.service'].UnitFileState == 'enabled' or setup_units['alsa-utils.service'].ActiveState == 'active'
  tags:
    - kill_audio
