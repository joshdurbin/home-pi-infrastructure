---
# Only touch units that exist and are running or enabled, so absent units
# (hciuart is not present on Debian trixie) neither fail nor report "changed".
- name: gather service facts
  ansible.builtin.service_facts:
  tags:
    - kill_radios

- name: disable radio services
  ansible.builtin.systemd:
    name: "{{ item }}.service"
    state: stopped
    enabled: false
  loop:
    - wpa_supplicant
    - bluetooth
    - hciuart
  when:
    - (item ~ '.service') in ansible_facts.services
    - >-
      ansible_facts.services[item ~ '.service'].state == 'running'
      or ansible_facts.services[item ~ '.service'].status == 'enabled'
  tags:
    - kill_radios
