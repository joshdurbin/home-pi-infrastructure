---
- name: disable on-board bluetooth
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^dtoverlay=disable-bt'
    line: "dtoverlay=disable-bt"
    insertafter: EOF
  notify: restart pi after config change
  tags:
    - kill_radios

- name: disable on-board wifi
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    regexp: '^dtoverlay=disable-wifi'
    line: "dtoverlay=disable-wifi"
    insertafter: EOF
  notify: restart pi after config change
  tags:
    - kill_radios

- name: disable wpa supplicant
  ansible.builtin.systemd:
    name: wpa_supplicant
    state: stopped
    enabled: false
  tags:
    - kill_radios

- name: disable bluetooth
  ansible.builtin.systemd:
    name: bluetooth
    state: stopped
    enabled: false
  tags:
    - kill_radios

- name: disable hciuart
  ansible.builtin.systemd:
    name: hciuart
    state: stopped
    enabled: false
  ignore_errors: true
  tags:
    - kill_radios
