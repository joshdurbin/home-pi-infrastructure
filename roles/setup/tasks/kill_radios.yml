---
# Only touch units that exist and are running or enabled, so absent units
# (hciuart is not present on Debian trixie) neither fail nor report "changed".
- name: disable radio services
  ansible.builtin.systemd:
    name: "{{ item }}.service"
    state: stopped
    enabled: false
  loop:
    - wpa_supplicant
    - bluetooth
    - hciuart
  when:
    - setup_units[item ~ '.service'].LoadState != 'not-found'
    - >-
      setup_units[item ~ '.service'].ActiveState == 'active'
      or setup_units[item ~ '.service'].UnitFileState == 'enabled'
  tags:
    - kill_radios
