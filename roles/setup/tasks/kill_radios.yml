---
- name: disable wpa supplicant
  ansible.builtin.systemd:
    name: wpa_supplicant
    state: stopped
    enabled: false
  tags:
    - kill_radios

- name: disable bluetooth
  ansible.builtin.systemd:
    name: bluetooth
    state: stopped
    enabled: false
  tags:
    - kill_radios

- name: disable hciuart
  ansible.builtin.systemd:
    name: hciuart
    state: stopped
    enabled: false
  ignore_errors: true
  tags:
    - kill_radios
