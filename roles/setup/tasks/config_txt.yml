---
# The whole of /boot/firmware/config.txt is rendered from one template, per
# board_model (detected from the hardware by roles/board_facts), so each board only gets
# the settings that apply to it - no [pi5]/[cm4]/[cm5] filter sections, no
# lineinfile appends. Replaces the former per-setting tasks (radios, onboard
# audio, cgroups, GPU memory, HAT/HDMI disables, Pi 5 overclock).
# Overclock rationale: README.md "Overclocking".
# A reboot is required for any change to take effect. Nothing here reboots: the
# handler below only prints a notice, and reboots are done by hand (drain one
# node at a time - docs/REFERENCE.md "Node Maintenance").
# /boot/firmware is FAT, so the template module's own backup: true fails there
# (its timestamped name contains ':' and '@', invalid on FAT). Keep one copy of
# the pre-Ansible file on the root filesystem instead; force: false means it is
# written once and never overwritten, so it is always the original stock file.
- name: keep a copy of the original config.txt
  # `creates` skips the task outright once the copy exists (the copy module re-checksums both files on
  # every run, about 6 s on a Pi with /boot on FAT); install -m also fixes owner and mode in one step.
  ansible.builtin.command:
    cmd: install -m 0644 -o root -g root /boot/firmware/config.txt /var/backups/config.txt.pre-ansible
    creates: /var/backups/config.txt.pre-ansible
  tags:
    - kill_radios
    - kill_audio
    - enable_cgroups
    - performance_optimization

- name: render /boot/firmware/config.txt for this board
  ansible.builtin.template:
    src: config.txt.j2
    dest: /boot/firmware/config.txt
  notify: restart pi after config change
  tags:
    - kill_radios
    - kill_audio
    - enable_cgroups
    - performance_optimization
