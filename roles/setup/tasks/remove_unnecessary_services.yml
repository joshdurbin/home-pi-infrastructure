---
- name: remove mpris-proxy
  ansible.builtin.apt:
    name: mpris-proxy
    state: absent
  tags:
    - remove_services

- name: disable avahi-daemon
  ansible.builtin.systemd:
    name: avahi-daemon.service
    state: stopped
    enabled: false
  when:
    - setup_units['avahi-daemon.service'].LoadState != 'not-found'
    - >-
      setup_units['avahi-daemon.service'].ActiveState == 'active'
      or setup_units['avahi-daemon.service'].UnitFileState == 'enabled'
  tags:
    - remove_services
