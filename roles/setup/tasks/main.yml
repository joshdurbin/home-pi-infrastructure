---
- name: repair stale apt source configuration
  ansible.builtin.include_tasks: repair_apt_sources.yml

# The one apt index refresh of the run (site.yml's module_defaults skip it when the index is under an
# hour old, and later apt tasks in this and other roles then find it fresh). Its own task, with
# changed_when: false, because apt reports an index refresh as a change and that made every host show
# "changed" on a deploy that changed nothing.
- name: refresh the apt index
  ansible.builtin.apt:
    update_cache: true
  changed_when: false

- name: include config.txt (per-board boot config) tasks
  ansible.builtin.include_tasks: config_txt.yml

- name: include kernel command line (cmdline.txt) tasks
  ansible.builtin.include_tasks: cmdline_txt.yml
  # The include itself needs the tags, or `--tags psi` skips it without ever opening the file.
  tags:
    - psi
    - boot_cmdline

- name: include USB disk read-ahead tasks
  ansible.builtin.include_tasks: usb_read_ahead.yml

# ONE cheap systemctl call for every unit the kill_radios / kill_audio / remove_services tasks manage,
# parsed into setup_units. It replaces two ansible.builtin.service_facts calls (about 12 s each on a Pi:
# they list every unit) and lets each task skip a unit that is already disabled and stopped, instead of
# making a systemd call per unit on every run.
- name: read the state of the services this role manages
  ansible.builtin.command: >-
    systemctl show --property=Id,LoadState,UnitFileState,ActiveState
    alsa-state.service alsa-restore.service alsa-utils.service avahi-daemon.service
    wpa_supplicant.service bluetooth.service hciuart.service
  register: setup_unit_state
  changed_when: false
  check_mode: false
  tags:
    - kill_radios
    - kill_audio
    - remove_services

- name: parse the service states
  ansible.builtin.set_fact:
    setup_units_json: >-
      {%- set out = {} -%}
      {%- for block in setup_unit_state.stdout.split('\n\n') if block.strip() -%}
      {%- set d = {} -%}
      {%- for line in block.split('\n') if '=' in line -%}
      {%- set _ = d.update({line.split('=', 1)[0]: line.split('=', 1)[1]}) -%}
      {%- endfor -%}
      {%- set _ = out.update({d['Id']: d}) -%}
      {%- endfor -%}
      {{ out | to_json }}
  tags:
    - kill_radios
    - kill_audio
    - remove_services

- name: make the service states a dictionary
  ansible.builtin.set_fact:
    setup_units: "{{ setup_units_json | from_json }}"
  tags:
    - kill_radios
    - kill_audio
    - remove_services

- name: include kill radios tasks
  ansible.builtin.include_tasks: kill_radios.yml

- name: include kill audio tasks
  ansible.builtin.include_tasks: kill_audio.yml

- name: include kernel module blacklisting tasks
  ansible.builtin.include_tasks: blacklist_modules.yml

- name: include disable vim GUI tasks
  ansible.builtin.include_tasks: disable_vim_gui.yml

- name: include remove unnecessary services tasks
  ansible.builtin.include_tasks: remove_unnecessary_services.yml

- name: setting locale to {{ locale }}
  community.general.locale_gen:
    name: '{{ locale }}'
    state: present

- name: set timezone to {{ timezone }}
  ansible.builtin.timezone:
    name: '{{ timezone }}'

- name: set keyboard layout to {{ keyboard_layout }}
  ansible.builtin.lineinfile:
    dest: /etc/default/keyboard
    regexp: '^XKBLAYOUT=.*$'
    line: 'XKBLAYOUT="{{ keyboard_layout }}"'
  register: keyboard_layout_result

- name: activate keyboard layout {{ keyboard_layout }}
  ansible.builtin.shell: dpkg-reconfigure -f noninteractive keyboard-configuration
  when: keyboard_layout_result.changed
  changed_when: false

# A full dist-upgrade on all nodes takes minutes and can pull in a new kernel, so it is not part of
# every converge: unattended-upgrades (below) keeps the nodes patched. Run it on demand with
# `make upgrade-os` (sets setup_upgrade_packages).
- name: Update all packages to the latest version
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  when: setup_upgrade_packages | default(false) | bool

- name: include unattended-upgrades (automatic package updates) tasks
  ansible.builtin.include_tasks: unattended_upgrades.yml

- name: install basic set of packages
  ansible.builtin.apt:
    pkg:
      - git
      - iotop
      - iftop
      - vim
      - bind9-dnsutils   # "dnsutils" is a transitional package on Debian 13, which apt reports as changed on every run
      - jq
      - nmap
      - lsof
      - socat
      - tree
      - telnet
      - screen
      - siege
      - wrk
      - pwgen
      - sysstat
      - fio
      - smartmontools
      - iperf3
      - wireguard-tools
      - termshark
    state: present
