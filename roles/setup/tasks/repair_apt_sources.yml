---
# The Helm role used to install /usr/share/keyrings/helm.gpg; it now uses
# helm.asc. Any apt source still naming helm.gpg breaks every apt call
# ("Conflicting values set for option Signed-By" next to the helm.asc entry, or
# a missing-keyring error on its own), so strip them before anything uses apt.
- name: Find apt source files that still reference helm.gpg
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns:
      - '*.list'
      - '*.sources'
    # find's `contains` is anchored at the start of each line (re.match), so
    # the pattern needs the leading .*
    contains: '.*helm\.gpg.*'
  register: helm_gpg_source_files
  changed_when: false

- name: Remove helm.gpg entries from one-line .list sources
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: 'helm\.gpg'
    state: absent
  loop: "{{ helm_gpg_source_files.files | selectattr('path', 'search', '\\.list$') | list }}"
  loop_control:
    label: "{{ item.path }}"

- name: Remove deb822 .sources files that reference helm.gpg
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ helm_gpg_source_files.files | selectattr('path', 'search', '\\.sources$') | list }}"
  loop_control:
    label: "{{ item.path }}"

- name: Remove legacy dearmored Helm key
  ansible.builtin.file:
    path: /usr/share/keyrings/helm.gpg
    state: absent

- name: Fail early, with the file names, if apt still references helm.gpg
  ansible.builtin.command: grep -rls 'helm\.gpg' /etc/apt
  register: helm_gpg_leftover
  changed_when: false
  failed_when: helm_gpg_leftover.stdout | length > 0
