---
# Seeds the "operator-oauth" Secret that the tailscale-operator chart expects
# to already exist (its own oauth-secret.yaml template only renders when
# oauth.clientId is set in Helm values - and it's deliberately left unset in
# Argo CD's tailscale-operator Application, see the home-pi-gitops repo,
# since that repo must never contain real credentials). The chart install,
# ProxyGroup, and per-service Ingresses now live entirely in that Application.
#
# Requires tailscale_oauth_client_id / tailscale_oauth_client_secret to be
# set in the vault-encrypted group_vars/all/main.yaml - see README.md's
# "Exposing UIs via Tailscale" section for how to generate and add them.
- name: Seed Tailscale operator OAuth credentials
  when: inventory_hostname in k3s_map.server.hosts
  run_once: true
  block:
    - name: Create namespace
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: '{{ tailscaleoperator_vars.kubernetes.namespace }}'
        kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
        wait: true

    - name: Create operator-oauth secret
      kubernetes.core.k8s:
        definition: "{{ lookup('ansible.builtin.template', 'oauth-secret.j2') | from_yaml }}"
        kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
        wait: true
      no_log: true
