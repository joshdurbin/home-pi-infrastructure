---
# Generic "seed a Secret/ConfigMap the cluster needs but git never can"
# mechanism, driven entirely by the k8s_secrets list (see
# group_vars/all/cluster_secrets.yaml). This exists because apps/ (the
# Argo CD GitOps directory) must never contain real credentials - every
# Argo CD Application that needs one references it by name instead
# (existingSecret, or a chart's own "expects a pre-created Secret"
# convention), and this role is what actually puts it there.
#
# To add another one: add an entry to k8s_secrets, not a new role - that's
# the whole point of this being data-driven instead of one role per app.
# Two API sessions instead of one per object: every kubernetes.core.k8s call starts Python on the
# server, loads the kubeconfig and opens a connection, which on a Pi is a few seconds each, and there are
# a couple of dozen objects. The module takes a LIST of definitions, so the namespaces go in one call
# and the Secrets/ConfigMaps in a second (after the namespaces exist). `wait` is only useful for
# namespaces; a Secret or ConfigMap is ready when the API accepts it.
- name: Ensure namespaces exist for cluster secrets
  kubernetes.core.k8s:
    definition: "{{ lookup('ansible.builtin.template', 'namespaces.yaml.j2') | from_yaml }}"
    kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
    wait: true
  run_once: true

- name: Apply cluster secrets/configmaps
  kubernetes.core.k8s:
    definition: "{{ k8s_secrets | map(attribute='manifest') | list }}"
    kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
  run_once: true
  no_log: true
