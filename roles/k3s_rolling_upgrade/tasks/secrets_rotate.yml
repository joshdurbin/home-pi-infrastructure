---
# Secrets encryption at rest (server_config_yaml: secrets-encryption). Turning the flag on only
# encrypts what is written afterwards, so once every server runs with it this re-encrypts what is
# already stored: `k3s secrets-encrypt rotate-keys` on one server. Idempotent: a cluster whose
# active key has already been rotated (its name gains a timestamp, aescbckey-<time>) is left alone.
# Run once, on the first server.
- name: Read the secrets-encryption status
  ansible.builtin.command: k3s secrets-encrypt status
  register: k3s_rolling_upgrade_enc
  changed_when: false
  check_mode: false

- name: Encryption must be enabled by now
  ansible.builtin.assert:
    that: "'Encryption Status: Enabled' in k3s_rolling_upgrade_enc.stdout"
    fail_msg: >-
      secrets-encryption is not enabled on {{ inventory_hostname }}; the servers did not pick up the
      flag. Output: {{ k3s_rolling_upgrade_enc.stdout }}

- name: Rotate the keys and re-encrypt existing Secrets
  ansible.builtin.command: k3s secrets-encrypt rotate-keys
  when: "'aescbckey-' not in k3s_rolling_upgrade_enc.stdout"
  register: k3s_rolling_upgrade_rotated
  changed_when: true

- name: Wait for the re-encryption to finish
  ansible.builtin.command: k3s secrets-encrypt status
  register: k3s_rolling_upgrade_enc_after
  changed_when: false
  check_mode: false
  retries: 60
  delay: 10
  until: "'reencrypt_finished' in k3s_rolling_upgrade_enc_after.stdout"
  when: k3s_rolling_upgrade_rotated is changed
