---
# After a key rotation the other servers have to reload the new keys: restart k3s on this server and
# wait for it to be Ready, and for the encryption hashes to agree across servers. One server at a time
# (the calling play is serial: 1).
- name: Restart k3s
  ansible.builtin.service:
    name: k3s
    state: restarted

- name: Wait for the node to be Ready
  ansible.builtin.command: >-
    k3s kubectl get node {{ inventory_hostname }}
    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  delegate_to: "{{ groups['server'] | difference([inventory_hostname]) | first }}"
  register: k3s_rolling_upgrade_ready2
  changed_when: false
  check_mode: false
  retries: "{{ k3s_rolling_upgrade_ready_retries }}"
  delay: "{{ k3s_rolling_upgrade_ready_delay }}"
  until: k3s_rolling_upgrade_ready2.stdout == 'True'

- name: Wait for the encryption hashes to match
  ansible.builtin.command: k3s secrets-encrypt status
  register: k3s_rolling_upgrade_enc_hash
  changed_when: false
  check_mode: false
  retries: 30
  delay: 10
  until: "'All hashes match' in k3s_rolling_upgrade_enc_hash.stdout"
