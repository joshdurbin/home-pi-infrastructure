---
# `kubernetes.core.k8s` (used here, and by k8s_secrets/argocd right after
# this role in site.yml) needs the Python `kubernetes` library on whichever
# host actually executes it - not declared as a dependency anywhere in this
# repo (checked - not in requirements.yaml, which is only Ansible collections,
# and no role ever pip/apt-installs it). This worked by pure accident for a
# long time: the old control-plane nodes (rpi-4b-*) happened to already have
# it from outside this repo's own automation, and site.yml's `run_once` tasks
# always executed on whichever node was first in the `server` group - which
# was always a 4B node, until control plane moved to the Pi 5s (see
# inventory.dist's `[server]` group comment) and this broke the moment a Pi 5
# became first-server instead. Installed here because this is the first
# `hosts: server` role in site.yml's execution order that needs it - `helm`
# runs just before this but only installs the Helm binary, no Python/k8s API
# involved - so by the time k8s_secrets/argocd run later, it's already
# present.
- name: Ensure the Python kubernetes library is present for kubernetes.core modules
  ansible.builtin.apt:
    name: python3-kubernetes
    state: present

# `pi5=true` is not declared anywhere: it is derived from the board model the hardware reports
# (roles/board_facts). A Pi 5's Cortex-A76 is ARMv8.2-A with crypto extensions; a Pi 4B's Cortex-A72 is
# not, and apps/opensearch's Amazon Linux based images crash on it ("Fatal glibc error: ... requires a
# newer ARM64 processor compliant with at least ARM architecture 8.2-a with Cryptographic extensions"),
# so anything with that requirement selects on this label. Not OpenSearch specific.
#
# Applies, in ONE API call, everything node-level that hostvars declare: Kubernetes labels (each
# host's k8s_labels, see host_vars/rpi-5-*.yaml) and the Longhorn disk-config annotation. Runs once
# and covers every inventory host rather than just the current play's hosts (this play is `hosts:
# server`), so it stays correct regardless of which nodes are servers.
#
# The Longhorn annotation: with `createDefaultDiskLabeledNodes: true` and the node label
# node.longhorn.io/create-default-disk=config, Longhorn creates the node's disk from the
# node.longhorn.io/default-disks-config annotation instead of using the whole filesystem.
# storageReserved (longhorn_disk_reserved_gib, in GiB) is the part of the filesystem Longhorn must
# leave alone, so (filesystem - reserved) is what it may schedule. It is only read when the node first
# registers: a cluster rebuild applies it, a later edit here does not move an existing disk.
#
# One call, not one per node and per kind of change: each kubernetes.core.k8s call starts Python on the
# server and opens an API session, a few seconds each on a Pi. The list is built in
# templates/node-patches.yaml.j2.
- name: Apply node labels and annotations from host vars
  kubernetes.core.k8s:
    definition: "{{ lookup('ansible.builtin.template', 'node-patches.yaml.j2') | from_yaml }}"
    kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
    state: patched
  run_once: true
