---
- name: Role Facts
  ansible.builtin.include_role:
    name: longhorn
    tasks_from: facts

- name: Role Provisioning
  when: inventory_hostname in k3s_map.server.hosts
  block:
    - name: Validate service state
      ansible.builtin.wait_for:
        port: '{{ k3s_vars.server.api.port }}'
        timeout: 30
      any_errors_fatal: true

    - name: Install binary
      ansible.builtin.get_url:
        url: '{{ longhorn_project.release.url }}/{{ longhorn_project.release.file }}'
        checksum: sha256:{{ longhorn_project.release.url }}/{{ longhorn_project.release.file }}.sha256
        dest: '{{ k3s_map.node.directory.bin }}/longhornctl'
        owner: root
        group: root
        mode: '755'
      register: longhorn_result
      delay: 1
      retries: 3
      until: longhorn_result is not failed

    - name: Add repository
      kubernetes.core.helm_repository:
        name: '{{ longhorn_vars.kubernetes.helm.repository.org }}'
        repo_url: '{{ longhorn_vars.kubernetes.helm.repository.url }}'
        force_update: true
      register: longhorn_result
      delay: 1
      retries: 3
      until: longhorn_result is not failed

    - name: Chart Setup
      run_once: true
      block:
        - name: Set chart postinstall fact
          ansible.builtin.set_fact:
            longhorn_postinstall: false

        # StorageClass.parameters is immutable in Kubernetes, so a plain
        # `helm upgrade` can't apply a changed dataLocality/replica setting
        # to the class Longhorn already created. Delete it here so the chart
        # recreates it fresh on every install/upgrade with current settings.
        # Safe: deleting a StorageClass never touches existing PVs/PVCs.
        - name: Remove default StorageClass to allow recreation with current settings
          kubernetes.core.k8s:
            api_version: storage.k8s.io/v1
            kind: StorageClass
            name: '{{ longhorn_vars.kubernetes.helm.chart.name }}'
            state: absent
            kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
          ignore_errors: true

        - name: Install chart
          kubernetes.core.helm:
            chart_ref: '{{ longhorn_map.helm.chart.reference }}'
            chart_version: '{{ longhorn_vars.kubernetes.helm.chart.version }}'
            kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
            name: '{{ longhorn_vars.kubernetes.helm.chart.name }}'
            namespace: '{{ longhorn_vars.kubernetes.namespace }}'
            values: "{{ lookup('ansible.builtin.template', 'values.j2') | from_yaml }}"
            create_namespace: true
            update_repo_cache: true
            wait: false
          register: longhorn_result

        - name: Check for Helm/cluster drift
          ansible.builtin.include_role:
            name: helm_drift_check
          vars:
            helm_drift_check_release: '{{ longhorn_vars.kubernetes.helm.chart.name }}'
            helm_drift_check_namespace: '{{ longhorn_vars.kubernetes.namespace }}'

        - name: Wait for Longhorn UI to be ready
          kubernetes.core.k8s_info:
            kind: Deployment
            name: longhorn-ui
            namespace: '{{ longhorn_vars.kubernetes.namespace }}'
            kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
            wait: true
            wait_condition:
              type: Available
              status: "True"
            wait_sleep: 5
            wait_timeout: 30
          ignore_errors: true

        - name: Check if Cilium Gateway exists
          kubernetes.core.k8s_info:
            kind: Gateway
            name: cilium
            namespace: kube-system
            kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
          register: cilium_gateway
          ignore_errors: true

        - name: Create HTTPRoute for Longhorn UI
          when: cilium_gateway.resources | length > 0
          kubernetes.core.k8s:
            definition:
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: longhorn-ui
                namespace: '{{ longhorn_vars.kubernetes.namespace }}'
              spec:
                parentRefs:
                  - name: cilium
                    namespace: kube-system
                hostnames:
                  - longhorn.local
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    backendRefs:
                      - name: longhorn-frontend
                        port: 80
            kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
            wait: true
          ignore_errors: true

- name: Post-Install Tasks
  ansible.builtin.import_tasks:
    file: postinstall.yaml
