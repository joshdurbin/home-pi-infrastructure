---
# Bootstraps Argo CD itself (the one remaining Ansible-driven Helm install)
# and the root Application that then takes over syncing everything else
# (Longhorn, VictoriaMetrics, VictoriaLogs, Blocky, Tailscale Operator)
# from this repo's own apps/ directory. See README.md's "GitOps (Argo CD)" section.
- name: Role Facts
  ansible.builtin.include_role:
    name: argocd
    tasks_from: facts

- name: Role Provisioning
  when: inventory_hostname in k3s_map.server.hosts
  block:
    - name: Add repository
      kubernetes.core.helm_repository:
        name: '{{ argocd_vars.kubernetes.helm.repository.name }}'
        repo_url: '{{ argocd_vars.kubernetes.helm.repository.url }}'
        force_update: true

    - name: Chart Setup
      run_once: true
      block:
        - name: Create namespace
          kubernetes.core.k8s:
            definition:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: '{{ argocd_vars.kubernetes.namespace }}'
            kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
            wait: true

        - name: Install chart
          kubernetes.core.helm:
            chart_ref: '{{ argocd_map.helm.chart.reference }}'
            chart_version: '{{ argocd_vars.kubernetes.helm.chart.version }}'
            kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
            name: '{{ argocd_map.release.name }}'
            namespace: '{{ argocd_vars.kubernetes.namespace }}'
            timeout: '{{ argocd_map.helm.timeout }}'
            values: "{{ lookup('ansible.builtin.template', 'values.j2') | from_yaml }}"
            create_namespace: true
            update_repo_cache: true
            wait: false

        - name: Check for Helm/cluster drift
          ansible.builtin.include_role:
            name: helm_drift_check
          vars:
            helm_drift_check_release: '{{ argocd_map.release.name }}'
            helm_drift_check_namespace: '{{ argocd_vars.kubernetes.namespace }}'

        - name: Apply AppProject
          kubernetes.core.k8s:
            definition: "{{ lookup('ansible.builtin.template', 'appproject.yaml.j2') | from_yaml }}"
            kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
            wait: true

        - name: Apply root Application (app-of-apps)
          kubernetes.core.k8s:
            definition: "{{ lookup('ansible.builtin.template', 'root-application.yaml.j2') | from_yaml }}"
            kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
            wait: true
