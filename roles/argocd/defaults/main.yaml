---
argocd_vars:
  kubernetes:
    namespace: argocd
    helm:
      chart:
        name: argo-cd
        version: 10.9.2
      repository:
        name: argo
        url: https://argoproj.github.io/argo-helm
  # Public GitHub repo - no credentials needed, same as the public Helm
  # chart repos above. See README.md's "GitOps (Argo CD)" section.
  gitops:
    repo_url: https://github.com/joshdurbin/home-pi-infrastructure.git
    target_revision: master
    path: apps
