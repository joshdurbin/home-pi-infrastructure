---
# Seeds the Grafana admin credentials Secret that Argo CD's victoria-metrics
# Application (see this repo's apps/ directory) references via
# grafana.admin.existingSecret - the chart install and everything else now
# lives entirely in that Application.
- name: Role Facts
  ansible.builtin.include_role:
    name: victoria-metrics
    tasks_from: facts

- name: Seed Grafana admin credentials
  when: inventory_hostname in k3s_map.server.hosts
  run_once: true
  block:
    - name: Create namespace
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: '{{ victoriametrics_vars.kubernetes.namespace }}'
        kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
        wait: true

    - name: Create Grafana admin credentials secret
      kubernetes.core.k8s:
        definition: "{{ lookup('ansible.builtin.template', 'credentials.j2') | from_yaml }}"
        kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
        wait: true
      no_log: true
