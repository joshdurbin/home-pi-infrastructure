---
- name: Role Facts
  ansible.builtin.include_role:
    name: victoria-metrics
    tasks_from: facts

- name: Role Provisioning
  when: inventory_hostname in k3s_map.server.hosts
  block:
    - name: Add repositories
      kubernetes.core.helm_repository:
        name: '{{ item.org }}'
        repo_url: '{{ item.url }}/{{ item.name }}'
        force_update: true
      loop:
        - "{{ victoriametrics_vars.kubernetes.helm.repository.prometheus }}"
        - "{{ victoriametrics_vars.kubernetes.helm.repository.victoriametrics }}"

    - name: Chart Setup
      run_once: true
      block:
        - name: Create namespace
          kubernetes.core.k8s:
            definition:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: '{{ victoriametrics_vars.kubernetes.namespace }}'
            kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
            wait: true

        - name: Create Grafana admin credentials secret
          kubernetes.core.k8s:
            definition: "{{ lookup('ansible.builtin.template', 'credentials.j2') | from_yaml }}"
            kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
            wait: true
          no_log: true

        - name: Install CRDs dependency chart
          kubernetes.core.helm:
            chart_ref: '{{ victoriametrics_map.helm.chart.prometheus.reference }}'
            chart_version: '{{ victoriametrics_vars.kubernetes.helm.chart.prometheus.version }}'
            kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
            name: '{{ victoriametrics_vars.kubernetes.helm.chart.prometheus.name }}'
            namespace: '{{ victoriametrics_vars.kubernetes.namespace }}'
            create_namespace: true
            update_repo_cache: true
            wait: false

        - name: Install chart
          kubernetes.core.helm:
            chart_ref: '{{ victoriametrics_map.helm.chart.victoriametrics.reference }}'
            chart_version: '{{ victoriametrics_vars.kubernetes.helm.chart.victoriametrics.version }}'
            kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
            name: '{{ victoriametrics_vars.kubernetes.helm.chart.victoriametrics.alias }}'
            namespace: '{{ victoriametrics_vars.kubernetes.namespace }}'
            timeout: '{{ victoriametrics_map.helm.timeout }}'
            values: "{{ lookup('ansible.builtin.template', 'values.j2') | from_yaml }}"
            update_repo_cache: true
            wait: false

        - name: Check for Helm/cluster drift
          ansible.builtin.include_role:
            name: helm_drift_check
          vars:
            helm_drift_check_release: '{{ victoriametrics_vars.kubernetes.helm.chart.victoriametrics.alias }}'
            helm_drift_check_namespace: '{{ victoriametrics_vars.kubernetes.namespace }}'
