---
- name: Install Helm from Buildkite repository
  when: inventory_hostname in groups.get('server', [])
  block:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - gpg
          - apt-transport-https
        state: present
        update_cache: true

    # Armored key kept as-is: apt accepts .asc files in signed-by, so no
    # gpg --dearmor step is needed.
    - name: Download Helm GPG key
      ansible.builtin.get_url:
        url: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
        dest: /usr/share/keyrings/helm.asc
        mode: '0644'

    - name: Read Helm GPG key fingerprint
      ansible.builtin.shell: |
        set -o pipefail
        gpg --show-keys --with-colons /usr/share/keyrings/helm.asc | awk -F: '$1 == "fpr" {print $10}' | head -n 1
      args:
        executable: /bin/bash
      register: helm_key_fingerprint
      changed_when: false

    - name: Verify GPG key matches expected fingerprint
      ansible.builtin.assert:
        that:
          - helm_key_fingerprint.stdout == 'DDF78C3E6EBB2D2CC223C95C62BA89D07698DBC6'
        fail_msg: "Helm GPG key fingerprint does not match expected value"

    # update_cache: true here refreshes the index only when this task changes the repository, which
    # replaces the unconditional `apt update` that used to follow it.
    - name: Add Helm repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/helm.asc] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
        filename: helm-stable-debian
        update_cache: true

    - name: Remove legacy dearmored Helm key
      ansible.builtin.file:
        path: /usr/share/keyrings/helm.gpg
        state: absent

    - name: Install Helm
      ansible.builtin.apt:
        name: helm
        state: present

    - name: Verify Helm installation
      ansible.builtin.command:
        cmd: helm version --short
      register: helm_verify
      changed_when: false

    - name: Display Helm version
      ansible.builtin.debug:
        msg: "Helm installed: {{ helm_verify.stdout }}"
