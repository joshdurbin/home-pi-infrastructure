---
# Seeds the Secret + ConfigMap that Argo CD's adguard-home Application
# (see the home-pi-gitops repo) depends on but can never define itself,
# since both carry real credentials that must never be committed to git.
# The chart install, egress NetworkPolicy, and everything else non-secret
# now live entirely in that Application. Requires adguard_home_admin_username
# and adguard_home_admin_password in the vault-encrypted
# group_vars/all/main.yaml - see README.md.
- name: Role Facts
  ansible.builtin.include_role:
    name: adguard_home
    tasks_from: facts

- name: Seed AdGuard Home secrets and config
  when: inventory_hostname in k3s_map.server.hosts
  run_once: true
  block:
    - name: Create namespace
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: '{{ adguardhome_vars.kubernetes.namespace }}'
        kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
        wait: true

    - name: Create exporter credentials secret
      kubernetes.core.k8s:
        definition: "{{ lookup('ansible.builtin.template', 'credentials.j2') | from_yaml }}"
        kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
        wait: true
      no_log: true

    - name: Create seeded AdGuardHome.yaml ConfigMap
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: '{{ adguardhome_map.configmap.name }}'
            namespace: '{{ adguardhome_vars.kubernetes.namespace }}'
          data:
            AdGuardHome.yaml: "{{ lookup('ansible.builtin.template', 'AdGuardHome.yaml.j2') }}"
        kubeconfig: '{{ k3s_project.cluster.kubeconfig }}'
        wait: true
      no_log: true
