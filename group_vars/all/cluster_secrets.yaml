---
# Everything the k8s_secrets role seeds into the cluster, in one place -
# the single source of truth for what exists, why, and where its values
# come from. See README.md's "GitOps (Argo CD)" section, "Secrets bridge":
# apps/ (the Argo CD GitOps directory) can never contain real credentials,
# so every Argo CD Application that needs one references it here by name
# instead (existingSecret, or a chart's own "expects a pre-created Secret"
# convention).
#
# adguard_home_admin_username / adguard_home_admin_password and
# tailscale_oauth_client_id / tailscale_oauth_client_secret are vault-
# encrypted in group_vars/all/main.yaml - see README.md for how to set them.

# Non-secret AdGuard Home config that feeds the seed ConfigMap below -
# genuinely app-specific settings, not credentials, so they live here in
# the open rather than in Vault.
adguard_web_port: 3000
adguard_dns_upstream: tls://one.one.one.one
adguard_dns_bootstrap:
  - 1.1.1.1
  - 1.0.0.1
adguard_filters:
  - enabled: true
    url: https://small.oisd.nl
    name: OISD (small)
    id: 1000001
adguard_schema_version: 34

# Grafana admin credentials aren't Vault-encrypted (anonymous Admin access
# is enabled cluster-wide, so this login is unused in practice - see
# README.md's Monitoring & Logging section) but still go through this same
# existingSecret path rather than sitting inline in a git-committed
# apps/victoria-metrics/values.yaml, on general principle.
victoria_metrics_grafana_admin_user: admin
victoria_metrics_grafana_admin_password: changeme

k8s_secrets:
  - namespace: monitoring
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: vmks-credentials
        namespace: monitoring
      type: Opaque
      stringData:
        admin-user: '{{ victoria_metrics_grafana_admin_user }}'
        admin-password: '{{ victoria_metrics_grafana_admin_password }}'

  - namespace: adguard
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: adguard-exporter-creds
        namespace: adguard
      type: Opaque
      stringData:
        ADGUARD_USERNAMES: "{{ adguard_home_admin_username | default('admin') }}"
        ADGUARD_PASSWORDS: '{{ adguard_home_admin_password }}'

  - namespace: adguard
    manifest:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: adguard-home-seed-config
        namespace: adguard
      data:
        AdGuardHome.yaml: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/roles/k8s_secrets/templates/adguard-home-config.yaml.j2') }}"

  - namespace: tailscale
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: operator-oauth
        namespace: tailscale
      type: Opaque
      stringData:
        client_id: '{{ tailscale_oauth_client_id }}'
        client_secret: '{{ tailscale_oauth_client_secret }}'
