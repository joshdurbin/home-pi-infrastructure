---
# Everything the k8s_secrets role seeds into the cluster, in one place -
# the single source of truth for what exists, why, and where its values
# come from. See README.md's "GitOps (Argo CD)" section, "Secrets bridge":
# apps/ (the Argo CD GitOps directory) can never contain real credentials,
# so every Argo CD Application that needs one references it here by name
# instead (existingSecret, or a chart's own "expects a pre-created Secret"
# convention).
#
# tailscale_oauth_client_id / tailscale_oauth_client_secret, searxng_secret_key,
# searxng_metrics_password, temporal_db_password, opensearch_admin_password,
# openwebui_secret_key, openwebui_db_password, grafana_db_password, litellm_master_key, litellm_salt_key, litellm_db_password, openwebui_litellm_key,
# and pgadmin_db_password (the WhoDB Postgres login) are vault-encrypted in
# group_vars/all/main.yaml - see README.md for how to set them.
#
# Blocky (apps/blocky/) needs no entry here at all - it has no admin login,
# so its entire config is non-secret and lives as a plain ConfigMap manifest
# in apps/blocky/manifests/ instead, fully git-managed like everything else
# non-credential-bearing in apps/.

# Grafana admin credentials aren't Vault-encrypted (anonymous Admin access
# is enabled cluster-wide, so this login is unused in practice - see
# README.md's Monitoring & Logging section) but still go through this same
# existingSecret path rather than sitting inline in a git-committed
# apps/victoria-metrics/values.yaml, on general principle.
victoria_metrics_grafana_admin_user: admin
victoria_metrics_grafana_admin_password: changeme

# Unlike Grafana's above, this login is not unused: the OpenSearch Kubernetes
# Operator (apps/opensearch/) makes TLS + auth mandatory on the cluster
# itself - no equivalent of Grafana's anonymous Admin access exists for it -
# so opensearch_admin_password is a real credential and is vault-encrypted
# in group_vars/all/main.yaml, not left plaintext here. Both
# manifests/cluster.yaml's security.config.adminCredentialsSecret and
# dashboards.opensearchCredentialsSecret, and apps/opensearch/values-vector.yaml's
# Vector sinks (via envFrom), reference the same Secret this seeds.
opensearch_admin_username: admin

# WhoDB profile lists (rendered to JSON into the whodb-env Secret below).
# Postgres goes through the read-only pooler (backed by the replica) as the
# read-only `whodb` role; one profile per database since a profile pins one.
whodb_postgres_profiles:
  - alias: postgres
    host: postgres-pooler-ro.postgres.svc.cluster.local
    port: '5432'
    user: whodb
    password: '{{ pgadmin_db_password }}'
    database: postgres
    advanced:
      SSL Mode: require
  - alias: grafana
    host: postgres-pooler-ro.postgres.svc.cluster.local
    port: '5432'
    user: whodb
    password: '{{ pgadmin_db_password }}'
    database: grafana
    advanced:
      SSL Mode: require
  - alias: open_webui
    host: postgres-pooler-ro.postgres.svc.cluster.local
    port: '5432'
    user: whodb
    password: '{{ pgadmin_db_password }}'
    database: open_webui
    advanced:
      SSL Mode: require
  - alias: temporal
    host: postgres-pooler-ro.postgres.svc.cluster.local
    port: '5432'
    user: whodb
    password: '{{ pgadmin_db_password }}'
    database: temporal
    advanced:
      SSL Mode: require
  - alias: temporal_visibility
    host: postgres-pooler-ro.postgres.svc.cluster.local
    port: '5432'
    user: whodb
    password: '{{ pgadmin_db_password }}'
    database: temporal_visibility
    advanced:
      SSL Mode: require
whodb_opensearch_profiles:
  - alias: opensearch
    host: opensearch.opensearch.svc.cluster.local
    port: '9200'
    user: '{{ opensearch_admin_username }}'
    password: '{{ opensearch_admin_password }}'
    advanced:
      SSL Mode: insecure

k8s_secrets:
  - namespace: monitoring
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: vmks-credentials
        namespace: monitoring
      type: Opaque
      stringData:
        admin-user: '{{ victoria_metrics_grafana_admin_user }}'
        admin-password: '{{ victoria_metrics_grafana_admin_password }}'

  - namespace: tailscale
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: operator-oauth
        namespace: tailscale
      type: Opaque
      stringData:
        client_id: '{{ tailscale_oauth_client_id }}'
        client_secret: '{{ tailscale_oauth_client_secret }}'

  - namespace: searxng
    manifest:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: searxng-config
        namespace: searxng
      data:
        settings.yml: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/roles/k8s_secrets/templates/searxng-config.yaml.j2') }}"

  # Credentials apps/searxng/manifests/vmservicescrape.yaml's basicAuth
  # references to scrape SearXNG's own /metrics (see
  # roles/k8s_secrets/templates/searxng-config.yaml.j2's general.open_metrics
  # comment - only the password is ever actually checked, so "username"
  # here is a fixed placeholder, not a real credential of its own).
  - namespace: searxng
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: searxng-metrics-basic-auth
        namespace: searxng
      type: Opaque
      stringData:
        username: metrics
        password: '{{ searxng_metrics_password }}'

  # Temporal's Postgres credentials (apps/temporal/, apps/postgres/manifests/
  # temporal-database.yaml). Same content seeded into both namespaces
  # deliberately - Kubernetes Secrets are namespace-scoped, and this one
  # credential is needed by CNPG's DatabaseRole (postgres namespace, to
  # actually set the role's password in Postgres) and by Temporal's own
  # Helm chart (temporal namespace, to connect through postgres-pooler-rw)
  # - kubernetes.io/basic-auth type/keys match what CNPG's passwordSecret
  # expects.
  - namespace: postgres
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: temporal-db-credentials
        namespace: postgres
      type: kubernetes.io/basic-auth
      stringData:
        username: temporal
        password: '{{ temporal_db_password }}'

  - namespace: temporal
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: temporal-db-credentials
        namespace: temporal
      type: kubernetes.io/basic-auth
      stringData:
        username: temporal
        password: '{{ temporal_db_password }}'

  # Field names (username/password) must be exactly these - the operator's
  # own CRD field descriptions for both adminCredentialsSecret and
  # opensearchCredentialsSecret specify them literally, confirmed against
  # the chart's bundled CRD schema.
  - namespace: opensearch
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: opensearch-admin-credentials
        namespace: opensearch
      type: Opaque
      stringData:
        username: '{{ opensearch_admin_username }}'
        password: '{{ opensearch_admin_password }}'

  # Not a credential (unlike every other entry above) - this tailnet's
  # hostname, needed by apps/homepage/values.yaml's configMaps
  # {{HOMEPAGE_VAR_TAILNET_DOMAIN}} placeholders (Homepage's own runtime
  # env-var substitution) and required outright by Homepage itself
  # (HOMEPAGE_ALLOWED_HOSTS, any access that isn't localhost 403s without
  # it). Still goes through this same bridge rather than being hardcoded in
  # apps/ - tailnet_domain is per-cluster, same reasoning that already kept
  # it out of apps/ everywhere else (see roles/grafana_dashboards/defaults,
  # the one other place this variable is used, and
  # roles/k8s_secrets/templates/searxng-config.yaml.j2's comment on why it
  # was omitted there).
  - namespace: homepage
    manifest:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: homepage-env
        namespace: homepage
      data:
        HOMEPAGE_VAR_TAILNET_DOMAIN: '{{ tailnet_domain }}'
        HOMEPAGE_ALLOWED_HOSTS: 'home.{{ tailnet_domain }}'

  # WEBUI_SECRET_KEY (apps/open-webui/values.yaml's extraEnvVars) signs
  # Open WebUI's session cookies - not an LLM-backend credential (no
  # provider API key lives here, or anywhere in this repo's git history -
  # that's configured through Open WebUI's own Settings UI after it's
  # running, a runtime choice, not something to template). Same bridge
  # pattern as searxng_secret_key: a real credential, so it's vault-
  # encrypted in group_vars/all/main.yaml, not left plaintext here.
  #
  # Restored here after being accidentally dropped from this file by a
  # stray edit during the same session it was added - confirmed still
  # live and correctly deployed the whole time (`kubectl -n open-webui get
  # secret open-webui-secret-key` - type Opaque, key secret-key, exactly
  # what this entry and values.yaml's secretKeyRef both expect), the gap
  # was only ever in git's own record, never in the running cluster.
  - namespace: open-webui
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: open-webui-secret-key
        namespace: open-webui
      type: Opaque
      stringData:
        secret-key: '{{ openwebui_secret_key }}'

  # Open WebUI's Postgres credentials (apps/postgres/manifests/
  # open-webui-database.yaml, apps/open-webui/values.yaml). Same two-
  # namespace pattern as temporal_db_password: CNPG's DatabaseRole needs a
  # kubernetes.io/basic-auth Secret (username/password, referenced from
  # the postgres namespace); the app itself needs a single composed
  # DATABASE_URL instead (SQLAlchemy connection string, the format Open
  # WebUI's own docs specify - postgresql://, not postgres:// or
  # postgresql+psycopg2://) - two different shapes, so two different
  # Secrets rather than trying to reuse one.
  - namespace: postgres
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: open-webui-db-credentials
        namespace: postgres
      type: kubernetes.io/basic-auth
      stringData:
        username: open_webui
        password: '{{ openwebui_db_password }}'

  - namespace: open-webui
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: open-webui-database-url
        namespace: open-webui
      type: Opaque
      stringData:
        # postgres-pooler-rw, not a direct instance connection - "apps talk
        # to the pool, never the database directly", same as every other
        # app using this Postgres cluster (Temporal, etc.) - see
        # apps/postgres/manifests/pooler-rw.yaml and
        # apps/postgres/manifests/networkpolicy.yaml, which enforces this
        # at the network layer too.
        url: 'postgresql://open_webui:{{ openwebui_db_password }}@postgres-pooler-rw.postgres.svc.cluster.local:5432/open_webui'

  # Grafana's Postgres credentials (apps/postgres/manifests/
  # grafana-database.yaml, apps/victoria-metrics/values.yaml). Same two-
  # namespace basic-auth pattern as temporal_db_password: CNPG's
  # DatabaseRole reads it from the postgres namespace, Grafana's pod reads
  # the password from the monitoring namespace (GF_DATABASE_PASSWORD) - the
  # host/name/user are non-secret and live in values.yaml's grafana.ini, so
  # the password never needs URL-encoding into a composed connection string.
  - namespace: postgres
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: grafana-db-credentials
        namespace: postgres
      type: kubernetes.io/basic-auth
      stringData:
        username: grafana
        password: '{{ grafana_db_password }}'

  - namespace: monitoring
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: grafana-db-credentials
        namespace: monitoring
      type: kubernetes.io/basic-auth
      stringData:
        username: grafana
        password: '{{ grafana_db_password }}'

  # WhoDB's read-only Postgres login (apps/postgres/manifests/whodb-role.yaml).
  # Reuses the Vault variable still named pgadmin_db_password (from when
  # pgAdmin was the client) - rename it in main.yaml with `ansible-vault
  # encrypt_string` whenever convenient; nothing else depends on the name.
  - namespace: postgres
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: whodb-db-credentials
        namespace: postgres
      type: kubernetes.io/basic-auth
      stringData:
        username: whodb
        password: '{{ pgadmin_db_password }}'

  # WhoDB's pre-registered connections (WHODB_<TYPE> JSON profiles - see
  # apps/whodb/values.yaml; Redis has no auth so it's plain env there). One
  # Postgres profile per database since a profile pins a database. OpenSearch
  # uses the operator's self-signed cert, hence "SSL Mode": "insecure"
  # (TLS, no verification - in-cluster only).
  - namespace: whodb
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: whodb-env
        namespace: whodb
      type: Opaque
      stringData:
        WHODB_POSTGRES: '{{ whodb_postgres_profiles | to_json }}'
        WHODB_OPENSEARCH: '{{ whodb_opensearch_profiles | to_json }}'

  # LiteLLM (apps/litellm/). Master key = the admin API key / UI login (must
  # start with "sk-"); referenced by the chart via masterkeySecretName and
  # also used as the bearer token for the Prometheus scrape
  # (apps/litellm/manifests/vmservicescrape.yaml).
  - namespace: litellm
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: litellm-masterkey
        namespace: litellm
      type: Opaque
      stringData:
        masterkey: '{{ litellm_master_key }}'

  # Env-var secrets for the proxy (envFrom). LITELLM_SALT_KEY encrypts
  # provider credentials stored in the DB - never rotate it once set, or
  # those stored credentials become unreadable. Provider API keys are
  # optional: set anthropic_api_key / openai_api_key in the Vault vars and
  # re-run `make deploy-secrets`, then restart the litellm deployment
  # (env vars are read at start). An unset key is an empty value, which LiteLLM treats as missing.
  - namespace: litellm
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: litellm-env
        namespace: litellm
      type: Opaque
      stringData:
        LITELLM_SALT_KEY: '{{ litellm_salt_key }}'
        ANTHROPIC_API_KEY: '{{ anthropic_api_key | default("") }}'
        OPENAI_API_KEY: '{{ openai_api_key | default("") }}'

  # LiteLLM's Postgres login, in both namespaces (Secrets are namespace-
  # scoped): basic-auth shape for CNPG's DatabaseRole (postgres namespace,
  # apps/postgres/manifests/litellm-database.yaml), username/password keys
  # for the chart's db.secret (litellm namespace).
  - namespace: postgres
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: litellm-db-credentials
        namespace: postgres
      type: kubernetes.io/basic-auth
      stringData:
        username: litellm
        password: '{{ litellm_db_password }}'

  - namespace: litellm
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: litellm-db-credentials
        namespace: litellm
      type: Opaque
      stringData:
        username: litellm
        password: '{{ litellm_db_password }}'

  # Open WebUI's LiteLLM connection (apps/open-webui/values.yaml). A LiteLLM
  # *virtual key* (not the master key), created in the LiteLLM UI with the
  # exact value stored in Vault as openwebui_litellm_key - LiteLLM accepts a
  # caller-chosen key value, so the Vault value and the key in LiteLLM's
  # database are simply the same string. Restrict it to the claude-* aliases.
  - namespace: open-webui
    manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: open-webui-litellm-key
        namespace: open-webui
      type: Opaque
      stringData:
        api-key: '{{ openwebui_litellm_key }}'
