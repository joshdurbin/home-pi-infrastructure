[defaults]
nocows = True
roles_path = ./roles:./k3s-ansible/roles
inventory = ./inventory.dist
remote_tmp = $HOME/.ansible/tmp
local_tmp = $HOME/.ansible/tmp
pipelining = True
host_key_checking = False
deprecation_warnings = False
callbacks_enabled = profile_tasks, timer
force_handlers = True
timeout = 30
forks = 10

# Facts: gather once per run, not once per play (the default re-gathers in every play), and skip the
# slow hardware/virtual/facter/ohai subsets - nothing in the repo or k3s-ansible reads them (the
# network facts are kept: api_endpoint uses ansible_default_ipv4).
gathering = smart
gather_subset = !hardware,!virtual,!facter,!ohai

[ssh_connection]
# No -C (compression): the nodes are on a gigabit LAN, so it only costs CPU on the Pis.
ssh_args = -o ControlMaster=auto -o ControlPersist=30m
