---
# Unified infrastructure configuration playbook
# Run this to ensure all nodes are configured correctly
# Safe to run repeatedly (idempotent)

# - name: Refresh sudo credentials
#   hosts: all
#   gather_facts: no
#   tasks:
#     - name: refresh sudo credentials
#       command: sudo -v
#       changed_when: false
#       no_log: true

- name: System preparation and user management
  hosts: all
  roles:
    - role: user_management
      tags: [user_management]
    - role: setup
      tags: [setup]
  become: yes

- name: K3S cluster deployment
  hosts: k3s_cluster
  roles:
    - role: prereq
      tags: [k3s]
    - role: airgap
      tags: [k3s]
    - role: raspberrypi
      tags: [k3s]
  become: yes

- name: K3S server setup
  hosts: server
  roles:
    - role: k3s_server
      tags: [k3s]
  become: yes

- name: K3S agent setup
  hosts: agent
  roles:
    - role: k3s_agent
      tags: [k3s]
  become: yes

- name: Helm deployment
  hosts: server
  gather_facts: false
  roles:
    - helm
  become: yes
  tags: [helm, charts]

- name: Apply Kubernetes node labels
  hosts: server
  gather_facts: false
  roles:
    - k8s_labels
  become: yes
  tags: [labels, storage, longhorn, telemetry, charts]

# Not the [audio] node: Longhorn never runs there (taint), so no iSCSI/NFS
# packages on its SD card.
- name: Longhorn host prerequisites
  hosts: k3s_cluster:!audio
  gather_facts: false
  roles:
    - longhorn_prereqs
  become: yes
  tags: [storage, longhorn]

# Longhorn, VictoriaMetrics, OpenSearch, Blocky, SearXNG, and the Tailscale
# Operator's chart installs are no longer driven from here - Argo CD (below)
# owns that now, syncing from this same repo's apps/ directory. This play
# only seeds the handful of real Secrets/ConfigMaps those Applications
# depend on but can never define themselves, since apps/ must never contain
# real credentials (see group_vars/all/cluster_secrets.yaml - one list,
# every seeded object, in one place). It must run before the Argo CD
# bootstrap play below, so those objects already exist the first time each
# Application syncs.
- name: Seed cluster secrets for Argo CD-managed apps
  hosts: server
  gather_facts: false
  roles:
    - k8s_secrets
  become: yes
  tags: [secrets]

- name: Bootstrap Argo CD
  hosts: server
  gather_facts: false
  roles:
    - argocd
  become: yes
  tags: [argocd, charts]

# Installs the Tailscale client on every Pi node's OS (not a Kubernetes
# object - this is why it's a plain Ansible role and always will be, even
# with everything cluster-side now on Argo CD) so each node is reachable by
# SSH from any device on the tailnet. Node-level VPN access, distinct from
# the Tailscale Kubernetes Operator (apps/tailscale-operator/) that exposes
# in-cluster UIs - see "Exposing UIs via Tailscale Operator" in README.md.
- name: Deploy Tailscale
  hosts: pi4,pi5,pi3
  roles:
    - tailscale
  become: yes
  tags: [tailscale]

# Pure HTTP against Grafana's own API over its tailnet ingress - no Pi/kubectl
# access needed, so this runs on the control host itself rather than being
# delegated per-task. Needs apps/victoria-metrics already synced by Argo CD
# (Grafana pod Ready) and the control host on the tailnet with working
# MagicDNS. See roles/grafana_dashboards/README.md.
- name: Import community Grafana dashboards
  hosts: localhost
  gather_facts: false
  roles:
    - grafana_dashboards
  tags: [grafana, dashboards]
