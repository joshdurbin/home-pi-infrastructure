---
# Unified infrastructure configuration playbook
# Run this to ensure all nodes are configured correctly
# Safe to run repeatedly (idempotent)

# - name: Refresh sudo credentials
#   hosts: all
#   gather_facts: no
#   tasks:
#     - name: refresh sudo credentials
#       command: sudo -v
#       changed_when: false
#       no_log: true

- name: System preparation and user management
  hosts: all
  # apt index refreshes (the many update_cache: true tasks across these roles and k3s-ansible) are
  # skipped when the index is under an hour old; tasks that must force one pass cache_valid_time: 0.
  module_defaults:
    ansible.builtin.apt:
      cache_valid_time: 3600
  roles:
    - role: user_management
      tags: [user_management]
    - role: setup
      tags: [setup]
  become: yes

- name: K3S cluster deployment
  hosts: k3s_cluster
  # apt index refreshes (the many update_cache: true tasks across these roles and k3s-ansible) are
  # skipped when the index is under an hour old; tasks that must force one pass cache_valid_time: 0.
  module_defaults:
    ansible.builtin.apt:
      cache_valid_time: 3600
  roles:
    - role: prereq
      tags: [k3s]
    - role: airgap
      tags: [k3s]
    - role: raspberrypi
      tags: [k3s]
  become: yes

# Written BEFORE k3s is installed, so its very first start already has the registry mirrors and the
# same secrets-encryption key on every server (see the roles). That is what lets the later registry
# play find nothing to restart.
- name: Seed the registry mirror config
  hosts: k3s_cluster
  gather_facts: false
  tasks:
    - name: Write registries.yaml (no k3s restart)
      ansible.builtin.include_role:
        name: k3s_registries
        tasks_from: seed
      tags: [k3s]
  become: yes

- name: K3S server setup
  hosts: server
  roles:
    - role: k3s_secrets_seed
      tags: [k3s]
    - role: k3s_server
      tags: [k3s]
  become: yes

- name: K3S agent setup
  hosts: agent
  roles:
    - role: k3s_agent
      tags: [k3s]
  become: yes

# Fail fast if the servers do not share one secrets-encryption key (see the role's comment).
- name: Verify secrets encryption is consistent across the servers
  hosts: server[0]
  gather_facts: false
  roles:
    - role: k3s_secrets_check
      tags: [k3s]
  become: yes

# Point each node's containerd at Zot's pull-through cache (apps/zot/). The mirror config is already in
# place from the seed play above, so on a bootstrap nothing changes and nothing restarts. Two steps:
# a parallel read-only check that finds the nodes whose config WOULD change (and verifies containerd
# on the rest), then a restart play over only those nodes, one at a time - k3s has to restart on a node
# to load /etc/rancher/k3s/registries.yaml - waiting for each to be Ready and stopping the whole play
# if one fails to come back. Run on its own with `make deploy-registries`.
- name: Check which nodes need a registry mirror restart
  hosts: k3s_cluster
  gather_facts: false
  tasks:
    - name: Check the mirror config
      ansible.builtin.include_role:
        name: k3s_registries
        tasks_from: check
      tags: [registries]
  become: yes

- name: Configure the registry mirrors (restarts only the nodes that changed)
  hosts: k3s_registries_restart
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  roles:
    - role: k3s_registries
      tags: [registries]
  become: yes

- name: Helm deployment
  hosts: server
  gather_facts: false
  # apt index refreshes (the many update_cache: true tasks across these roles and k3s-ansible) are
  # skipped when the index is under an hour old; tasks that must force one pass cache_valid_time: 0.
  module_defaults:
    ansible.builtin.apt:
      cache_valid_time: 3600
  roles:
    - helm
  become: yes
  tags: [helm, charts]

- name: Apply Kubernetes node labels
  hosts: server
  gather_facts: false
  roles:
    - k8s_labels
  become: yes
  tags: [labels, storage, longhorn, telemetry, charts]

# Not the [audio] node: Longhorn never runs there (taint), so no iSCSI/NFS
# packages on its SD card.
- name: Longhorn host prerequisites
  hosts: k3s_cluster:!audio
  gather_facts: false
  # apt index refreshes (the many update_cache: true tasks across these roles and k3s-ansible) are
  # skipped when the index is under an hour old; tasks that must force one pass cache_valid_time: 0.
  module_defaults:
    ansible.builtin.apt:
      cache_valid_time: 3600
  roles:
    - longhorn_prereqs
  become: yes
  tags: [storage, longhorn]

# Longhorn, VictoriaMetrics, OpenSearch, Blocky, SearXNG, and the Tailscale
# Operator's chart installs are no longer driven from here - Argo CD (below)
# owns that now, syncing from this same repo's apps/ directory. This play
# only seeds the handful of real Secrets/ConfigMaps those Applications
# depend on but can never define themselves, since apps/ must never contain
# real credentials (see group_vars/all/cluster_secrets.yaml - one list,
# every seeded object, in one place). It must run before the Argo CD
# bootstrap play below, so those objects already exist the first time each
# Application syncs.
- name: Seed cluster secrets for Argo CD-managed apps
  hosts: server
  gather_facts: false
  roles:
    - k8s_secrets
  become: yes
  tags: [secrets]

- name: Bootstrap Argo CD
  hosts: server
  gather_facts: false
  roles:
    - argocd
  become: yes
  tags: [argocd, charts]

# Installs the Tailscale client on every Pi node's OS (not a Kubernetes
# object - this is why it's a plain Ansible role and always will be, even
# with everything cluster-side now on Argo CD) so each node is reachable by
# SSH from any device on the tailnet. Node-level VPN access, distinct from
# the Tailscale Kubernetes Operator (apps/tailscale-operator/) that exposes
# in-cluster UIs - see "Exposing UIs via Tailscale Operator" in README.md.
- name: Deploy Tailscale
  hosts: pi4,pi5,pi3
  # In parallel; only the tailscaled restart (a handler, when the logging opt-out changes) is limited to
  # one node at a time (throttle: 1 in the role), since it drops that node's tailnet connection for a
  # few seconds.
  # apt index refreshes (the many update_cache: true tasks across these roles and k3s-ansible) are
  # skipped when the index is under an hour old; tasks that must force one pass cache_valid_time: 0.
  module_defaults:
    ansible.builtin.apt:
      cache_valid_time: 3600
  roles:
    - tailscale
  become: yes
  tags: [tailscale]

# Pure HTTP against Grafana's own API over its tailnet ingress - no Pi/kubectl
# access needed, so this runs on the control host itself rather than being
# delegated per-task. Needs apps/victoria-metrics already synced by Argo CD
# (Grafana pod Ready) and the control host on the tailnet with working
# MagicDNS. See roles/grafana_dashboards/README.md.
#
# Tagged `never`: skipped by a plain `make deploy` (it would fail on a freshly
# bootstrapped cluster where Grafana isn't up yet). Run with `make deploy-dashboards`.
- name: Import community Grafana dashboards
  hosts: localhost
  gather_facts: false
  roles:
    - grafana_dashboards
  tags: [never, grafana, dashboards]
