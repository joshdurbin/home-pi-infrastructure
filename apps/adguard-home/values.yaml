controllers:
  main:
    initContainers:
      # ConfigMap-backed volumes are always read-only (no readOnly toggle
      # exists on that volume source at all - unlike a PVC), but AdGuard
      # rewrites AdGuardHome.yaml on every settings change and on schema
      # upgrades. So the seed only ever gets copied onto the writable conf
      # PVC once, on first boot; every boot after that, AdGuard's own
      # previously-saved state (already sitting on that PVC) wins untouched.
      seed-config:
        image:
          repository: adguard/adguardhome
          tag: v0.107.79
        command:
          - /bin/sh
          - -c
          - |
            if [ ! -f /opt/adguardhome/conf/AdGuardHome.yaml ]; then
              cp /seed/AdGuardHome.yaml /opt/adguardhome/conf/AdGuardHome.yaml
            fi
    containers:
      main:
        image:
          repository: adguard/adguardhome
          tag: v0.107.79
        args:
          - --no-check-update
        env:
          TZ: America/Los_Angeles
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false
      exporter:
        image:
          repository: ghcr.io/henrywhitaker3/adguard-exporter
          tag: v1.2.1
        env:
          ADGUARD_SERVERS: http://localhost:3000
        envFrom:
          - secretRef:
              name: adguard-exporter-creds
        ports:
          - name: metrics
            containerPort: 9618
            protocol: TCP
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false

service:
  dns:
    controller: main
    type: LoadBalancer
    ports:
      dns-tcp:
        port: 53
        protocol: TCP
      dns-udp:
        port: 53
        protocol: UDP
  web:
    controller: main
    type: LoadBalancer
    ports:
      http:
        port: 3000

persistence:
  conf:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: longhorn
    globalMounts:
      - path: /opt/adguardhome/conf
  work:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 2Gi
    storageClass: longhorn
    globalMounts:
      - path: /opt/adguardhome/work
  config-seed:
    enabled: true
    type: configMap
    name: adguard-home-seed-config
    advancedMounts:
      main:
        seed-config:
          - path: /seed/AdGuardHome.yaml
            subPath: AdGuardHome.yaml
            readOnly: true
