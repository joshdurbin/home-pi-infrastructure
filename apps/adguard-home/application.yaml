apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adguard-home
  namespace: argocd
  annotations:
    # Uses Longhorn-backed PVCs, so syncs after it.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: home-pi
  destination:
    server: https://kubernetes.default.svc
    namespace: adguard
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  sources:
    - repoURL: https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      targetRevision: 5.2.1
      helm:
        releaseName: adguard-home
        valueFiles:
          - $values/apps/adguard-home/values.yaml
    - repoURL: git://192.168.1.57/home-pi-infrastructure
      targetRevision: master
      ref: values
    - repoURL: git://192.168.1.57/home-pi-infrastructure
      targetRevision: master
      path: apps/adguard-home/manifests
