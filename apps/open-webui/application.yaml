apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
  annotations:
    # Has its own PVC (Longhorn, wave 0) - same tier as every other
    # end-user-facing app with a PVC (whodb, redis).
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: home-pi
  destination:
    server: https://kubernetes.default.svc
    namespace: open-webui
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  sources:
    # Official chart (helm.openwebui.com), now on stable releases (17.x; it used to publish only
    # per-commit -dev versions). Pinned deliberately: re-pin on bumps, don't track a floating tag.
    - repoURL: https://helm.openwebui.com/
      chart: open-webui
      targetRevision: 17.0.0
      helm:
        releaseName: open-webui
        valueFiles:
          - $values/apps/open-webui/values.yaml
    - repoURL: https://github.com/joshdurbin/home-pi-infrastructure.git
      targetRevision: master
      ref: values
    - repoURL: https://github.com/joshdurbin/home-pi-infrastructure.git
      targetRevision: master
      path: apps/open-webui/manifests
