# A "killer" service worker served at /service-worker.js.
#
# A browser that once registered a service worker for this origin keeps it, and keeps asking for its script at
# its original URL to check for updates. After the upgrade that URL returned 404, the old worker stayed in
# charge and served cached assets of an old build, so the page asked for JavaScript chunks that no longer exist
# (404), SvelteKit reacted by re-checking /_app/version.json and reloading, again and again: an endless reload
# "redirect loop" that clearing nothing on the server could stop.
#
# Open WebUI itself ships no service worker, so this path is free. When a stale browser re-checks it, it gets
# this script, installs it, and it deletes every cache, unregisters itself and reloads the open pages; after that
# the page loads the current app normally. Harmless to every other browser (they never ask for the file).
# Mounted over /app/build/service-worker.js (apps/open-webui/values.yaml, volumes/volumeMounts).
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-worker-killer
  namespace: open-webui
data:
  service-worker.js: |
    // Self-destructing service worker: wipe caches, unregister, reload the pages it controlled.
    self.addEventListener('install', () => self.skipWaiting());
    self.addEventListener('activate', (event) => {
      event.waitUntil((async () => {
        try {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        } catch (e) {}
        await self.registration.unregister();
        const pages = await self.clients.matchAll({ type: 'window', includeUncontrolled: true });
        pages.forEach((page) => page.navigate(page.url));
      })());
    });
    // Never answer a request itself: let everything go to the network.
    self.addEventListener('fetch', () => {});
