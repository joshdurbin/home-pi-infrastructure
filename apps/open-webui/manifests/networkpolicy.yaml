# Egress-only (Tailscale reaching the web UI is ingress, unaffected).
# DNS, Postgres and Bifrost (the LLM backend, port 8080 in the bifrost
# namespace - the provider API calls themselves egress from Bifrost, whose own
# policy allows 443, not from here). Checked the app's own source for a
# startup update-check/telemetry call and found none in the one module most
# likely to have it, but couldn't fully rule it out, so this stays
# conservative rather than guessing a broad 443 rule it might not need.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-webui-egress
  namespace: open-webui
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # postgres-pooler-rw (apps/postgres/manifests/open-webui-database.yaml)
    # - the pooler's own NetworkPolicy leaves its ingress open to any
    #   namespace by design (apps/postgres/manifests/networkpolicy.yaml),
    #   so this rule only needs to open this pod's own egress side.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Bifrost gateway (apps/bifrost/) - OpenAI-compatible API on 8080. Its
    # ingress is unrestricted (its own NetworkPolicy is egress-only), so only
    # this pod's egress side needs a rule.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bifrost
      ports:
        - protocol: TCP
          port: 8080
