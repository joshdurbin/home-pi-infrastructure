# LLM backend: the in-cluster LiteLLM proxy (apps/litellm/), via its
# OpenAI-compatible API - see OPENAI_API_BASE_URL / OPENAI_API_KEY in
# extraEnvVars below. Provider choice and API keys live in LiteLLM, not
# here; Open WebUI only holds a LiteLLM virtual key. (Both are Open WebUI
# "persistent config" values: they seed the connection on first start, after
# which the Admin Settings UI wins - change them there if they ever differ.)
# The two subchart toggles below that WOULD auto-install a backend are
# explicitly turned off so this doesn't silently stand one up.

image:
  repository: ghcr.io/open-webui/open-webui
  # Chart's own image.tag default is "" -> falls back to this chart
  # version's appVersion, which is literally "dev" (confirmed via `helm
  # show values` against the chart's own Chart.yaml - this chart has no
  # separate "stable" release line, every published version tracks main).
  # Pinned explicitly to the actual latest tagged GitHub release instead.
  tag: v0.11.4

# Bundled Ollama install - chart default is enabled: true. Off deliberately
# per this app's scope: no LLM backend configured here, see top comment.
ollama:
  enabled: false

# Bundled Pipelines subchart (extends Open WebUI with middleware/plugins) -
# chart default is enabled: true. Off - nothing here needs it yet, and it's
# easy to turn on later without touching anything else.
pipelines:
  enabled: false

# Websocket manager default is "redis" (bundles its own Redis deployment,
# chart default websocket.redis.enabled: true) - only actually needed for
# multi-replica websocket fan-out. This is a single-replica deployment, so
# the built-in in-memory manager (manager: "") covers it with one fewer pod
# to run on this fleet.
websocket:
  manager: ''
  redis:
    enabled: false

persistence:
  enabled: true
  storageClass: longhorn
  # File uploads and RAG vector embeddings now (chats/users/settings moved
  # to Postgres, see the DATABASE_URL env var below) - still needed
  # regardless, not model weights (no local Ollama here, see top comment).
  size: 2Gi

# WEBUI_SECRET_KEY signs session cookies - not an LLM-backend credential,
# same category as Homepage's own HOMEPAGE_ALLOWED_HOSTS was: required for
# the app to run at all, not a provider API key. No dedicated values.yaml
# field exists for it in this chart, so it's wired the same way the
# chart's own commented-out example shows for OPENAI_API_KEY - via
# extraEnvVars + a pre-created Secret, seeded by the generic k8s_secrets
# bridge (group_vars/all/cluster_secrets.yaml) with a new
# openwebui_secret_key Vault variable, never committed here.
extraEnvVars:
  - name: WEBUI_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: open-webui-secret-key
        key: secret-key
  # Moves chats/users/settings onto the cluster's existing HA Postgres
  # (apps/postgres/manifests/open-webui-database.yaml), via
  # postgres-pooler-rw - instead of the local SQLite file this previously
  # used. Does NOT remove the need for the PVC below: file uploads and RAG
  # vector embeddings are separate concerns (STORAGE_PROVIDER/VECTOR_DB
  # env vars, both still local/default) that DATABASE_URL doesn't touch -
  # confirmed against Open WebUI's own docs, not assumed. Pre-existing
  # chat data in webui.db is NOT migrated by this - this starts a fresh
  # database, a deliberate tradeoff given how little was in it at the time
  # (deployed minutes earlier, not a real loss).
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: open-webui-database-url
        key: url
  # LiteLLM virtual key (restricted to the claude-* aliases), not the master
  # key - seeded by k8s_secrets from the Vault variable openwebui_litellm_key.
  # Set here rather than via the chart's openaiApiKey* values only because
  # those can't mark the Secret optional (see below). The chart's own
  # openaiApiKey is blanked further down so it doesn't emit a second
  # OPENAI_API_KEY (duplicate env names break Argo CD's diff).
  - name: OPENAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: open-webui-litellm-key
        key: api-key
        # Optional so Open WebUI still starts before the Secret is seeded
        # (no key -> no LiteLLM models listed, nothing else breaks).
        optional: true

# LiteLLM (apps/litellm/), in-cluster (not via Tailscale), is the LLM backend.
# These are the chart's own OpenAI settings - it already emits
# OPENAI_API_BASE_URL itself. openaiApiKey is blanked so the chart omits its
# default placeholder key; the real key comes from extraEnvVars above.
openaiBaseApiUrl: http://litellm.litellm.svc.cluster.local:4000/v1
openaiApiKey: ""

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1024Mi
