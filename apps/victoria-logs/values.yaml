# Vector (apps/opensearch/values-vector.yaml) ships here too now, dual-
# shipping everything it already sends to OpenSearch - see that file's own
# comment for why. No `vector:` subchart block here (unlike this app's
# prior incarnation, before it was removed - see git log) - Vector now
# runs as its own standalone chart release shared with OpenSearch, not
# bundled per-backend.
server:
  persistentVolume:
    accessModes:
      - ReadWriteOnce
    enabled: true
    size: 10Gi
    storageClassName: longhorn
  # Same stateful-logging/metrics-storage placement convention as
  # vmsingle (apps/victoria-metrics/values.yaml) - the telemetry=true
  # nodes are where this cluster's monitoring-storage PVCs already live.
  nodeSelector:
    telemetry: "true"
  replicaCount: 1
  # 512Mi - what this ran at before (see git log on this app's prior
  # incarnation), not re-confirmed against today's actual log volume.
  # Worth treating with the same suspicion as vmsingle's own pre-OOM
  # sizing (apps/victoria-metrics/values.yaml's own comment on that) -
  # this is now ingesting the identical dual-shipped stream OpenSearch
  # receives, which is real, measurable traffic this value hasn't been
  # checked against. Revisit via `kubectl -n monitoring top pod` /
  # OOMKilled status if this turns out too tight, same as every other
  # live-confirmed resize in this repo.
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 512Mi
  # Matches OpenSearch's own retention (manifests/ism-policy.yaml:
  # minIndexAge 7d) so both backends hold a comparable, honestly-equal
  # window of the same dual-shipped data - not a VictoriaLogs default.
  # Headroom confirmed before bumping from the original 48h: OpenSearch's
  # own data pool (ingesting the identical stream) used only ~246MB over a
  # 46h window on its 10Gi PVC, and this app's PVC is sized the same -
  # 7d (~3.5x the data) fits easily, no resize needed.
  retentionPeriod: 7d
