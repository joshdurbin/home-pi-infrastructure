apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-logs
  namespace: argocd
spec:
  project: home-pi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts
      chart: victoria-logs-single
      targetRevision: 0.12.0
      helm:
        releaseName: vls
        valueFiles:
          - $values/apps/victoria-logs/values.yaml
    - repoURL: git://192.168.1.57/home-pi-infrastructure
      targetRevision: master
      ref: values
    - repoURL: git://192.168.1.57/home-pi-infrastructure
      targetRevision: master
      path: apps/victoria-logs/manifests
