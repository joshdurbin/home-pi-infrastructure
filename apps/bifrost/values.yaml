# Bifrost - one OpenAI-compatible endpoint (/v1) in front of every LLM
# provider, with a web UI (/) for providers, keys, logs and spend. Replaces
# LiteLLM.
#
# - Database: the cluster's CloudNativePG Postgres via postgres-pooler-rw
#   (apps/postgres/manifests/bifrost-database.yaml) for both the config store
#   and the request-log store. Password from the bifrost-db-credentials Secret
#   seeded by k8s_secrets.
# - Providers and their API keys are added in the UI, not in git: they are
#   stored encrypted in Postgres using the key from the bifrost-encryption
#   Secret (BIFROST_ENCRYPTION_KEY - never change it once set, or the stored
#   provider keys become unreadable). Models are addressed as
#   <provider>/<model>, e.g. anthropic/claude-sonnet-5-5.
# - Auth: none in-app, like every other UI here - the Service is reachable only
#   in-cluster or via the Tailscale ingress (apps/tailscale-operator).
# - Metrics: /metrics on the http port, scraped by manifests/vmservicescrape.yaml.

image:
  # The chart requires an explicit tag. Deliberately NOT the chart's own
  # appVersion (1.5.12, stale): the gateway is on 2.x now (latest v2.2.5, has
  # arm64). Chart 2.1.43's generated config.json validates against the current
  # (v2) schema at https://www.getbifrost.ai/schema - re-check that when bumping.
  tag: v2.2.5
  pullPolicy: IfNotPresent

# One replica: stateless (state in Postgres), so a drain just reschedules it.
replicaCount: 1

storage:
  mode: postgres
  configStore:
    enabled: true
  logsStore:
    enabled: true

postgresql:
  enabled: false
  external:
    enabled: true
    host: postgres-pooler-rw.postgres.svc.cluster.local
    port: 5432
    user: bifrost
    database: bifrost
    sslMode: require
    existingSecret: bifrost-db-credentials
    passwordKey: password

bifrost:
  encryptionKeySecret:
    name: bifrost-encryption
    key: encryption-key
  client:
    enableLogging: true
    # The chart turns this on for production. Callers here (Open WebUI) are
    # in-cluster and the UI/API are only exposed on the tailnet, so no virtual
    # keys - same stance as the rest of the cluster's UIs.
    enforceAuthOnInference: false
    logRetentionDays: 30
  # Providers declared in git (the chart renders them into config.json). Hosted providers' API keys are
  # not here: those are added in Bifrost's UI and kept in its database (sourceOfTruth is the default,
  # "split": this file and the database coexist).
  providers:
    # The in-cluster Qwen2.5-1.5B (apps/llm/), a llama.cpp server. A custom provider named "llm" built on
    # the OpenAI wire protocol, so a request for model "llm/qwen2.5-1.5b-instruct" is sent to it.
    llm:
      custom_provider_config:
        base_provider_type: openai
        is_key_less: true          # llama-server has no API key here (access is limited by NetworkPolicy)
      keys:
        - name: llm-local
          value: ""
          weight: 1
          models: ["qwen2.5-1.5b-instruct"]   # the --alias llama-server was started with
      network_config:
        # No /v1: Bifrost appends the OpenAI paths (/v1/chat/completions) itself.
        base_url: http://llm.llm.svc.cluster.local:8080
        # Bifrost refuses private addresses by default (SSRF protection); this is a ClusterIP.
        allow_private_network: true
        # Generation on a Pi 5 is ~6-7 tokens/s, so a long answer takes minutes: do not give up early, and
        # do not retry a generation that has already started (a retry would queue behind itself).
        default_request_timeout_in_seconds: 600
        stream_idle_timeout_in_seconds: 120
        max_retries: 0
      # llama-server runs ONE request at a time (--parallel 1); more concurrent calls just wait.
      concurrency_and_buffer_size:
        concurrency: 1
        buffer_size: 8

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
