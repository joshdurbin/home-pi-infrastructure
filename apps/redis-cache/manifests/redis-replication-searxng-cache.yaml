# SearXNG's redis/valkey cache backend (its rate-limiter/bot-detection
# state - see roles/k8s_secrets/templates/searxng-config.yaml.j2's valkey.url).
# Two pods (master + one replica), each with its own PVC. redis-sentinel.yaml
# in this directory monitors this and fails over automatically at the
# storage layer; SearXNG's own config follows it via this CR's own
# operator-maintained "-master" Service rather than Sentinel directly (its
# valkey client has no Sentinel-discovery support) - see that config's
# comment for how that Service still tracks the real master.
#
# Sizing: same reasoning as apps/blocky/manifests/redis-replication.yaml -
# this is a cache, 128MB of maxmemory is intentionally tiny, and 192Mi of
# container memory is that plus headroom for redis's own overhead, not
# maxmemory itself. Pi fleet, several nodes already running other apps.
# Lives in the shared redis-cache namespace; failover comes from the ONE shared
# Sentinel cluster (redis-sentinel.yaml in this directory).
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: searxng-cache
  namespace: redis-cache
spec:
  clusterSize: 2
  # Master and replica on different nodes, and never both down for a drain - a node
  # going away must not take the whole cache (and its failover target) with it.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: searxng-cache
          topologyKey: kubernetes.io/hostname
  pdb:
    enabled: true
    maxUnavailable: 1
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  redisConfig:
    dynamicConfig:
      - maxmemory 128mb
      - maxmemory-policy allkeys-lru
  kubernetesConfig:
    image: quay.io/opstree/redis:v8.10.1
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        cpu: 200m
        memory: 192Mi
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:v1.89.0
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 64Mi
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 512Mi
