# Egress-only (clients reaching in on 6379/26379 is ingress, allowed by
# default; this only bounds what these pods can reach out to):
# - CoreDNS, needed to resolve the pod/Service DNS names replication and
#   Sentinel monitoring depend on.
# - Every other pod in this namespace on the redis (6379) and sentinel (26379)
#   ports: replication traffic and Sentinel<->Redis/Sentinel<->Sentinel
#   monitoring. `podSelector: {}` with no namespaceSelector matches
#   same-namespace pods only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-cache-egress
  namespace: redis-cache
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
