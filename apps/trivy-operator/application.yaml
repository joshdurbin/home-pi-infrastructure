apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  annotations:
    # Installs its own CRDs (VulnerabilityReport, ConfigAuditReport,
    # ExposedSecretReport, RbacAssessmentReport, etc.) - same large-
    # annotation issue as Longhorn's/CNPG's own CRDs, hence
    # ServerSideApply=true below. Nothing in apps/ consumes those CRDs or
    # depends on this app existing first, and it needs no PVC.
    #
    # Wave 2, not 1: manifests/vmservicescrape.yaml (added alongside the
    # metrics flags below) is a VMServiceScrape, which needs
    # victoria-metrics' own CRD (installed at wave 1) to already exist -
    # same race class as apps/blocky/application.yaml's own sync-wave
    # comment for the identical CRD, and that one's fix (bump this app's
    # wave past victoria-metrics') is the one that applies here too, since
    # nothing else needs trivy-operator's own CRDs at any particular wave.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: home-pi
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  sources:
    - repoURL: https://aquasecurity.github.io/helm-charts/
      chart: trivy-operator
      targetRevision: 0.36.0
      helm:
        releaseName: trivy-operator
        valueFiles:
          - $values/apps/trivy-operator/values.yaml
    - repoURL: https://github.com/joshdurbin/home-pi-infrastructure.git
      targetRevision: master
      ref: values
    - repoURL: https://github.com/joshdurbin/home-pi-infrastructure.git
      targetRevision: master
      path: apps/trivy-operator/manifests
