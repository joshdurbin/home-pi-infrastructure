# TRIVY_* environment variables for the built-in Trivy SERVER, via `trivy.valuesFromConfigMap`
# in ../values.yaml. That value is applied to the server only: the operator builds each scan
# Job's environment from a fixed list and has no passthrough, so it does NOT reach the scan Jobs
# (confirmed on a running scan pod, and in the operator source). The scan Jobs' version check
# and telemetry are blocked at DNS instead - apps/k3s-addons/manifests/
# coredns-telemetry-sinkhole.yaml makes check.trivy.dev unresolvable.
#
# - TRIVY_SKIP_VERSION_CHECK: Trivy checks for a newer release (check.trivy.dev/updates).
# - TRIVY_DISABLE_TELEMETRY: the same request also carries a machine identifier, the command
#   and its flags unless this is set. The request is skipped only when BOTH are set.
# Neither affects scanning; the vulnerability database download (which IS needed) is separate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-extra-env
  namespace: trivy-system
data:
  TRIVY_SKIP_VERSION_CHECK: "true"
  TRIVY_DISABLE_TELEMETRY: "true"
