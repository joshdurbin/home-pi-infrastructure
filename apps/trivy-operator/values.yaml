# Continuous vulnerability/misconfiguration scanning for every workload
# already running in the cluster (aquasecurity/trivy-operator) - watches
# Pods cluster-wide and runs a Trivy scan Job against each distinct image,
# publishing results as VulnerabilityReport/ConfigAuditReport/
# ExposedSecretReport/RbacAssessmentReport CRs you can `kubectl get` or
# browse. No NetworkPolicy here, same reasoning as cnpg-system/
# redis-operator (the two other pure-operator namespaces in this repo):
# scan Jobs need to pull each image's own registry plus the vulnerability
# DB from mirror.gcr.io, which (like SearXNG's search engines or Blocky's
# blocklist CDN) isn't a fixed IP set worth trying to allowlist.

operator:
  vulnerabilityScannerEnabled: true
  configAuditScannerEnabled: true
  exposedSecretScannerEnabled: true
  # Default is 10 - way more than this fleet should run at once. Each
  # concurrent scan Job gets its own resource footprint (trivy.resources
  # below), and 10 at once on a mix of 4GB/8GB Pi boards would compete
  # hard with every other workload here. 2 keeps scanning from ever being
  # the thing that pressures the cluster, at the cost of a slower first
  # full pass across every image already running.
  scanJobsConcurrentLimit: 2

  # Run a Trivy SERVER in the cluster (the chart's built-in one: a `trivy-server`
  # StatefulSet + the `trivy-service` Service on :4954, which also flips
  # trivy.mode to ClientServer and points trivy.serverURL at it automatically).
  # The server downloads and refreshes the vulnerability database ONCE onto its own
  # volume; scan Jobs just ask it. In the default Standalone mode every scan Job
  # downloaded the whole database again into an emptyDir, and a pod with several
  # containers (Grafana has four) ran parallel scans that fought over one database
  # lock - "cache may be in use by another process: timeout" - so Jobs failed and
  # were retried every 30s, each retry re-downloading. That loop saturated
  # rpi-4b-3's disk (sda ~100% busy, 6-13 MB/s of writes, 33-62% iowait). With a
  # server there is no per-Job download and no lock contention.
  builtInTrivyServer: true

  # Prometheus metrics. metricsFindingsEnabled is already the chart's own
  # default (true) - listed explicitly for visibility, not a change. The
  # other four are chart-default false, each with its own upstream warning
  # ("cardinality is significantly increased with this feature enabled") -
  # confirmed via `helm show values aquasecurity/trivy-operator --version
  # 0.36.0`. Turned on anyway for a reasonably complete picture (findings +
  # which CVEs + exposed secrets + config audit + RBAC over-permissiveness),
  # but deliberately NOT metricsImageInfo/metricsInfraAssessmentInfo/
  # metricsClusterComplianceInfo - those add further cardinality for
  # information this cluster doesn't otherwise act on. Worth revisiting
  # (metricsVulnIdEnabled especially, one series per CVE ID per image) if
  # vmsingle's own memory ever becomes tight again the way it did before
  # (see apps/victoria-metrics/values.yaml's own OOM comment).
  metricsFindingsEnabled: true
  metricsVulnIdEnabled: true
  metricsExposedSecretInfo: true
  metricsConfigAuditInfo: true
  metricsRbacAssessmentInfo: true

# The operator's own controller pod - continuously watches Pods/Jobs
# cluster-wide and reconciles report CRs, so it gets a bit more than the
# smallest operators here (redis-operator/cloudnative-pg's 50m/128Mi), but
# still a fraction of what a real deployment would give it.
#
# limits.memory was 256Mi originally - confirmed live, OOMKilled (exitCode
# 137, kubectl -n trivy-system get pod -o jsonpath='{...lastState}') within
# seconds of starting, crash-looping repeatedly. Reconciling against every
# pod already running in this ~150-pod, 7-node cluster on first start is a
# bigger initial memory spike than the idle steady-state footprint this was
# originally sized for. Doubled rather than nudged, same reasoning this
# repo uses elsewhere for a live-confirmed OOM (e.g. vmsingle's own).
# Raised again 512Mi -> 1Gi after live-confirmed OOMKills (exitCode 137, restart
# loop) with the operator sitting at ~510Mi: it caches every workload and report
# in the cluster, and the cluster has grown (more apps, 8 nodes).
resources:
  requests:
    cpu: 50m
    memory: 384Mi
  limits:
    cpu: 200m
    memory: 1Gi

# The audio node (host_vars/rpi-3bplus-1.yaml) is tainted so nothing but its
# three allowed pods runs there; its node-collector Job could never schedule
# (Pending forever), and a toleration would put a fourth pod on a 1GB node.
nodeCollector:
  excludeNodes: audio_output=true

# Per scan-Job resources (one Job per distinct image scanned, up to
# scanJobsConcurrentLimit at once) - left at the chart's own defaults. In
# Standalone mode Trivy needed real memory to load the vulnerability DB for every
# Job; with the server (operator.builtInTrivyServer above) the Jobs are lighter,
# so these could come down, but they are left as they were.
trivy:
  # The server's database/cache volume (the chart's server pod itself is sized by
  # the chart: 200m/512Mi requests, 1Gi limit). Longhorn, so the pod can move; the
  # database is re-downloadable, so losing the volume only costs a re-download.
  storageClassName: longhorn
  storageSize: 5Gi
  # Resources for each scan Job (the client side; they no longer carry the database).
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 500m
      memory: 500Mi
