# Keep at least one Blocky replica answering DNS through a drain (see
# values.yaml: 2 replicas on different nodes, readiness-gated).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: blocky
  namespace: blocky
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blocky
