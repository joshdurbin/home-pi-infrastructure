# No credentials anywhere in this file - Blocky has no admin login, unlike
# AdGuard Home, so unlike its seed ConfigMap this one is fully git-managed
# rather than routed through Ansible/Vault. Schema verified directly against
# ghcr.io/0xerr0r/blocky:v0.35.0 (docker run + real startup logs), not
# assumed from docs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: blocky-config
  namespace: blocky
data:
  config.yml: |
    upstreams:
      groups:
        default:
          - tcp-tls:1.1.1.1:853
          - tcp-tls:1.0.0.1:853
      strategy: parallel_best
      timeout: 2s

    bootstrapDns:
      - tcp+udp:1.1.1.1
      - tcp+udp:1.0.0.1

    blocking:
      denylists:
        ads:
          - https://small.oisd.nl
      clientGroupsBlock:
        default:
          - ads
      blockType: zeroIp
      blockTTL: 6h
      loading:
        refreshPeriod: 4h

    ports:
      dns: 53
      http: 4000

    prometheus:
      enable: true
      path: /metrics
