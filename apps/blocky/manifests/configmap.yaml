# No credentials anywhere in this file - Blocky has no admin login, unlike
# AdGuard Home, so unlike its seed ConfigMap this one is fully git-managed
# rather than routed through Ansible/Vault. Schema verified directly against
# ghcr.io/0xerr0r/blocky:v0.35.0 (docker run + real startup logs), not
# assumed from docs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: blocky-config
  namespace: blocky
data:
  config.yml: |
    upstreams:
      groups:
        default:
          - tcp-tls:1.1.1.1:853
          - tcp-tls:1.0.0.1:853
      strategy: parallel_best
      timeout: 2s

    bootstrapDns:
      - tcp+udp:1.1.1.1
      - tcp+udp:1.0.0.1

    blocking:
      denylists:
        ads:
          - https://small.oisd.nl
      clientGroupsBlock:
        default:
          - ads
      blockType: zeroIp
      blockTTL: 6h
      loading:
        refreshPeriod: 4h

    ports:
      dns: 53
      http: 4000

    prometheus:
      enable: true
      path: /metrics

    # Cache/blocking-state backend: blocky-cache (redis-replication.yaml),
    # discovered via its sentinels (redis-sentinel.yaml) rather than a
    # direct pod address so Blocky always finds the current master, even
    # after a failover. required: false - if the cache is ever unreachable,
    # DNS resolution itself (Blocky's actual job) must keep working,
    # degraded to in-memory-only caching, not fail outright.
    #
    # sentinelAddresses points at the operator's own round-robin ClusterIP
    # service for the RedisSentinel - confirmed live (kubectl get svc -n
    # blocky-cache) as "blocky-cache-sentinel-sentinel", not
    # "blocky-cache-sentinel": the operator appends its own "-sentinel"
    # suffix to whatever name the RedisSentinel CR is given, on top of the
    # "-sentinel" already in this CR's own name. go-redis only needs one
    # reachable sentinel to bootstrap - it learns the others from
    # `SENTINEL SENTINELS` once connected.
    redis:
      address: blocky-cache
      required: false
      sentinelAddresses:
        - blocky-cache-sentinel-sentinel.blocky-cache.svc.cluster.local:26379
