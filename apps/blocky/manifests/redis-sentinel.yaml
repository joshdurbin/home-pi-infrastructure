# Monitors blocky-cache (redis-replication.yaml) and automatically promotes
# the replica if the master pod dies. 3 sentinels (not 2) deliberately -
# Sentinel's failover vote needs a majority quorum, which isn't meaningful
# with only 2 voters; 3 tiny sentinel-only pods (no dataset, ~64Mi each) is
# a small enough cost on this fleet to get that right. quorum: 2 (2 of 3)
# is the redisSentinelConfig default.
#
# Blocky's own redis config (configmap.yaml) talks to these sentinels
# directly (sentinelAddresses + address: blocky-cache, the masterGroupName
# below) rather than to blocky-cache's pods, so it always finds the current
# master even after a failover.
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: blocky-cache-sentinel
  namespace: blocky-cache
spec:
  clusterSize: 3
  # One sentinel per node and at most 1 down at a time, so a drain never costs
  # the 2-of-3 quorum Sentinel needs to promote a replica.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: blocky-cache-sentinel-sentinel
          topologyKey: kubernetes.io/hostname
  pdb:
    enabled: true
    maxUnavailable: 1
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  redisSentinelConfig:
    redisReplicationName: blocky-cache
    masterGroupName: blocky-cache
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v8.10.1
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 64Mi
