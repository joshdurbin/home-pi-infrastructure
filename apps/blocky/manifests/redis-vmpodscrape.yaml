# Scrapes the redis_exporter sidecar redis-replication.yaml adds to each
# blocky-cache pod (master and replica), converting redis's native INFO
# stats into PromQL-queryable metrics. A VMPodScrape (not a VMServiceScrape
# like blocky's own apps/blocky/manifests/vmservicescrape.yaml) targets pods
# directly by label and container port, since the operator doesn't document
# a stable Service port *name* for the exporter to depend on - only the
# container port number (9121, redisExporter's own default). Same
# selectAllByDefault: true auto-pickup as every other VM*Scrape here.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: blocky-cache-redis-exporter
  namespace: blocky-cache
spec:
  selector:
    matchLabels:
      app: blocky-cache
      redis_setup_type: replication
  podMetricsEndpoints:
    - targetPort: 9121
      path: /metrics
