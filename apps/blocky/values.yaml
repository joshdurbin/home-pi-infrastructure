controllers:
  main:
    # This is the LAN's DNS (LoadBalancer on every node IP via k3s servicelb).
    # One replica: draining its node reschedules it, a ~10-30s gap in which DNS
    # is down for the whole network - accepted. A second replica (on a
    # different node, with a PodDisruptionBudget) would remove that gap and
    # costs almost nothing, so flip `replicas` to 2 and add required pod
    # anti-affinity on app.kubernetes.io/name=blocky if it ever bites. State is
    # already shareable: the cache lives in the blocky-cache Redis and the
    # config is a static ConfigMap.
    replicas: 1
    # app-template defaults to Recreate (kill the old pod, then start the new
    # one) - a DNS outage on every update. Start the new pod first and only
    # then stop the old one (surge 1, unavailable 0).
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: 0
      surge: 1
    containers:
      main:
        image:
          repository: ghcr.io/0xerr0r/blocky
          tag: v0.35.0
        probes:
          liveness:
            enabled: false
          # Without a readiness probe a rescheduled pod receives DNS traffic
          # the instant it exists, before it is listening. Ready = the DNS
          # port accepts TCP connections.
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 53
              initialDelaySeconds: 3
              periodSeconds: 5
              failureThreshold: 3
          startup:
            enabled: false

service:
  dns:
    controller: main
    type: LoadBalancer
    ports:
      dns-tcp:
        port: 53
        protocol: TCP
      dns-udp:
        port: 53
        protocol: UDP
  http:
    controller: main
    type: LoadBalancer
    ports:
      http:
        port: 4000

persistence:
  # Blocky is stateless - it never rewrites its own config, unlike AdGuard
  # Home - so a plain read-only ConfigMap mount is all that's needed. No
  # init-container seed-once workaround, no PVC at all.
  config:
    enabled: true
    type: configMap
    name: blocky-config
    globalMounts:
      - path: /app/config.yml
        subPath: config.yml
        readOnly: true
