controllers:
  main:
    # This is the LAN's DNS (LoadBalancer on every node IP via k3s servicelb),
    # so a single replica meant every drain/reboot of the node it ran on took
    # DNS down for the whole network until it was rescheduled. 2 replicas on
    # different nodes (PDB in manifests/pdb.yaml): any one node can go and the
    # Service keeps answering from the other. State is already shared - the
    # cache lives in the blocky-cache Redis, the config is a static ConfigMap.
    replicas: 2
    # app-template defaults to Recreate (kill the old pod, then start the new
    # one) - with 2 replicas that still means a full outage on every update.
    # Roll one pod at a time instead, never dropping below 2 ready.
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: 0
      surge: 1
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: blocky
              topologyKey: kubernetes.io/hostname
    containers:
      main:
        image:
          repository: ghcr.io/0xerr0r/blocky
          tag: v0.35.0
        probes:
          liveness:
            enabled: false
          # Without a readiness probe a rescheduled pod receives DNS traffic
          # the instant it exists, before it is listening. Ready = the DNS
          # port accepts TCP connections.
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 53
              initialDelaySeconds: 3
              periodSeconds: 5
              failureThreshold: 3
          startup:
            enabled: false

service:
  dns:
    controller: main
    type: LoadBalancer
    ports:
      dns-tcp:
        port: 53
        protocol: TCP
      dns-udp:
        port: 53
        protocol: UDP
  http:
    controller: main
    type: LoadBalancer
    ports:
      http:
        port: 4000

persistence:
  # Blocky is stateless - it never rewrites its own config, unlike AdGuard
  # Home - so a plain read-only ConfigMap mount is all that's needed. No
  # init-container seed-once workaround, no PVC at all.
  config:
    enabled: true
    type: configMap
    name: blocky-config
    globalMounts:
      - path: /app/config.yml
        subPath: config.yml
        readOnly: true
