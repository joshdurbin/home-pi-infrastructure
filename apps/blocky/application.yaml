apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blocky
  namespace: argocd
  annotations:
    # Blocky itself is stateless, but manifests/ now also owns blocky-cache's
    # redis PVCs (redis-replication.yaml) - needs Longhorn (wave 0). Its
    # VMServiceScrape/VMPodScrape need victoria-metrics' operator CRDs
    # (operator.victoriametrics.com/v1beta1) to already exist, confirmed by
    # a real failure: "failed to discover server resources for group
    # version ... the server could not find the requested resource" when
    # both were at the same wave. And redis-replication.yaml/redis-sentinel.yaml
    # need redis-operator's own CRDs (wave 1) to exist first, same race
    # class. Must sync strictly after victoria-metrics and redis-operator.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: home-pi
  destination:
    server: https://kubernetes.default.svc
    namespace: blocky
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  sources:
    - repoURL: https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      targetRevision: 5.2.1
      helm:
        releaseName: blocky
        valueFiles:
          - $values/apps/blocky/values.yaml
    - repoURL: https://github.com/joshdurbin/home-pi-infrastructure.git
      targetRevision: master
      ref: values
    - repoURL: https://github.com/joshdurbin/home-pi-infrastructure.git
      targetRevision: master
      path: apps/blocky/manifests
