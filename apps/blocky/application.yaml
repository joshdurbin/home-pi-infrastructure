apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blocky
  namespace: argocd
  annotations:
    # No PVCs at all (Blocky is stateless), so no Longhorn dependency - but
    # keep it out of wave 0 regardless, no reason to race the storage
    # foundation on a fresh bootstrap.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: home-pi
  destination:
    server: https://kubernetes.default.svc
    namespace: blocky
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  sources:
    - repoURL: https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      targetRevision: 5.2.1
      helm:
        releaseName: blocky
        valueFiles:
          - $values/apps/blocky/values.yaml
    - repoURL: git://192.168.1.57/home-pi-infrastructure
      targetRevision: master
      ref: values
    - repoURL: git://192.168.1.57/home-pi-infrastructure
      targetRevision: master
      path: apps/blocky/manifests
