# Scaled to zero, operator included (docs/REFERENCE.md, "ProxySQL (scaled to zero)").
# The operator only needs to run to clear the ProxySQLConfig finalizer when
# apps/postgres prunes that CR; on a fresh cluster none is ever created, so it stays off.
# Set back to 1 (and run `make build-proxysql-operator`, its image lives in Zot) to use it.
replicaCount: 0

# Reconciles the ProxySQLCluster/ProxySQLConfig CRs in apps/postgres/manifests/
# (the connection proxy in front of CloudNativePG). It is cluster-scoped and
# idle between reconciles, so it keeps the chart's own default request
# (100m/128Mi) but gets a tighter limit than the chart's 500m/256Mi,
# sized for the pi fleet.
# The upstream image (ghcr.io/proxysql/proxysql-operator) is private - open
# upstream issue ProxySQL/proxysql-on-k8s#83 - so it is built from the release
# tag and pushed to the in-cluster Zot (apps/zot/); see docs/REFERENCE.md,
# "Local registry (Zot)". localhost:30500 is Zot's NodePort, which every
# node's containerd reaches over plain HTTP. If upstream makes the package
# public, delete this block and the operator pulls from ghcr again.
image:
  repository: localhost:30500/proxysql-operator
  tag: "0.7.0"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 192Mi

# Controller-runtime metrics (reconcile rates/errors, workqueue depth), scraped
# by manifests/vmpodscrape.yaml. The chart's default is HTTPS with a
# token-review authn/authz filter, which a plain VMPodScrape can't satisfy, so
# serve plain HTTP instead - the same trade every other scrape here makes
# (cluster-internal only, nothing sensitive: counters and gauges).
metrics:
  enabled: true
  secureServing: false
