# The operator itself - reconciles the OpenSearchCluster/OpenSearchISMPolicy/
# OpenSearchIndexTemplate custom resources in apps/opensearch/manifests/ into
# an actual running cluster. installCRDs: true (chart default, left
# unchanged) means these CRDs need no separate install step. Mirrors this
# repo's other operator installs (victoria-metrics-operator, redis-operator,
# cloudnative-pg) rather than the plain chart apps/opensearch/ started as -
# see apps/opensearch/README.md for why.
manager:
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 256Mi
  # Chart default (image.tag: "" -> falls back to Chart.yaml's appVersion,
  # "3.0.0") points at a tag that doesn't exist - confirmed live, the pod
  # crash-looped on ErrImagePull ("opensearchproject/opensearch-operator:3.0.0:
  # not found"), and confirmed via Docker Hub's own API that no 3.0.0 tag was
  # ever published (only 12 tags exist total: latest, 3.0.0-alpha, and 2.x
  # releases - a real upstream packaging gap, not a typo on this repo's side).
  # "latest" and "3.0.0-alpha" were pushed the same day, so "latest" is almost
  # certainly the actual 3.0.0 GA build that never got a proper semver tag -
  # used here deliberately over an older 2.x tag (which would risk a real
  # CRD/binary mismatch against this chart version's bundled CRDs, already
  # validated against in apps/opensearch/manifests/). A deliberate exception
  # to this repo's normal version-pinning convention - revisit and pin once
  # a real point-release tag appears upstream.
  image:
    tag: latest

# Chart default (true) renders a ValidatingWebhookConfiguration backed by a
# cert-manager.io Certificate/Issuer for the webhook's TLS cert - this
# cluster has no cert-manager installed anywhere, and Argo CD's pre-sync
# discovery check fails atomically on the unknown cert-manager.io/v1 group,
# which blocks the *entire* Application (including the CRDs themselves,
# still v1beta1/CRD resources that would otherwise sync fine) - confirmed
# live: `kubectl get crd | grep opensearch` returned nothing until this was
# set. Disabling the webhook (confirmed via the chart's own templates: this
# also skips the ValidatingWebhookConfiguration and webhook Service, and
# passes --enable-webhooks=false to the manager) drops admission-time
# validation of the custom resources in manifests/ in favor of the CRD's own
# OpenAPI schema validation (which is what apps/opensearch/README.md's
# jsonschema check validated against) - a smaller footprint than adding
# cert-manager as a new cluster dependency for one operator's webhook certs.
webhook:
  enabled: false
