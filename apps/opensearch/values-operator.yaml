# The operator itself - reconciles the OpenSearchCluster/OpenSearchISMPolicy/
# OpenSearchIndexTemplate custom resources in apps/opensearch/manifests/ into
# an actual running cluster. installCRDs: true (chart default, left
# unchanged) means these CRDs need no separate install step. Mirrors this
# repo's other operator installs (victoria-metrics-operator, redis-operator,
# cloudnative-pg) rather than the plain chart apps/opensearch/ started as -
# see apps/opensearch/README.md for why.
manager:
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 256Mi
  # No image.tag override needed - chart 3.0.2's default (image.tag: "" ->
  # Chart.yaml's appVersion, "3.0.0-alpha") is a real, confirmed-published
  # Docker Hub tag, multi-arch (amd64/arm64/arm), confirmed on both
  # opensearchproject and opensearchstaging's registries.
  #
  # This took three attempts to land on, each confirmed live against the
  # actual failure, not guessed:
  #   1. Chart 3.0.14's default tag ("3.0.0") was never published at all -
  #      confirmed via Docker Hub's API (opensearch-project/opensearch-k8s-operator
  #      issues #1515/#1610: their release CI only triggers on `v*` git tags,
  #      but 3.0.0/3.0.1/3.0.2 were tagged `opensearch-operator-3.0.x`, so the
  #      image build never ran for any real 3.0.x release - upstream bug, no
  #      fix merged as of this writing).
  #   2. Chart 3.0.14 + image "latest" (an alias for 3.0.0-alpha) crash-looped
  #      on "flag provided but not defined: -enable-legacy-api" - that chart
  #      version's deployment template unconditionally passes a flag this
  #      older alpha binary doesn't have.
  #   3. Downgrading to chart 2.8.2 traded that problem for a different one:
  #      "-enable-webhooks" - a *different* new flag chart 2.8.2 itself
  #      added ahead of any matching image release for that chart line too.
  # Chart 3.0.2 (not 3.0.14) is the fix: still on the opensearch.org API
  # group (re-validated apps/opensearch/manifests/*.yaml with jsonschema
  # against its own bundled CRDs), but old enough to predate *both* the
  # legacy-api flag and any 2.8.x-line flag drift - its appVersion is
  # 3.0.0-alpha, which is the one real image that actually exists.

# Chart default (true) renders a ValidatingWebhookConfiguration backed by a
# cert-manager.io Certificate/Issuer for the webhook's TLS cert - this
# cluster has no cert-manager installed anywhere, and Argo CD's pre-sync
# discovery check fails atomically on the unknown cert-manager.io/v1 group,
# which blocks the *entire* Application (including the CRDs themselves,
# still v1beta1/CRD resources that would otherwise sync fine) - confirmed
# live: `kubectl get crd | grep opensearch` returned nothing until this was
# set. Disabling the webhook (confirmed via the chart's own templates: this
# also skips the ValidatingWebhookConfiguration and webhook Service, and
# passes --enable-webhooks=false to the manager) drops admission-time
# validation of the custom resources in manifests/ in favor of the CRD's own
# OpenAPI schema validation (which is what apps/opensearch/README.md's
# jsonschema check validated against) - a smaller footprint than adding
# cert-manager as a new cluster dependency for one operator's webhook certs.
webhook:
  enabled: false
