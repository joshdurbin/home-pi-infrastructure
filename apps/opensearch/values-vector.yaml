# Sources this cluster's log shipping directly from vector's own chart
# (https://helm.vector.dev) rather than victoria-logs-single's bundled
# `vector` subchart dependency - same Vector, same config shape, just no
# longer tied to that chart's own release cycle.
#
# Dual-shipped to both OpenSearch (primary, the one with Dashboards/auth/
# retention policy - see manifests/) and VictoriaLogs (apps/victoria-logs/,
# re-added alongside OpenSearch rather than replacing it again) - four
# sinks below, two backends x {container, host} sources, identical data to
# both. The two vlogs_* sinks are the exact config this cluster ran before
# OpenSearch replaced VictoriaLogs outright (see git log on
# apps/victoria-logs/ for that prior version) - the elasticsearch sink type
# pointed at VictoriaLogs' own Elastic-bulk-compatible endpoint plus its
# VL-*/AccountID/ProjectID headers, not a native `victorialogs` sink type -
# confirmed live (`kubectl -n opensearch get pods ... -o jsonpath=
# '{...image}'`) this cluster's pinned vector:0.58.0-debian doesn't ship
# one (checked vectordotdev/vector's own src/sinks tree at that tag - no
# victorialogs/victoria_logs directory exists), and the elasticsearch-sink
# approach is VictoriaLogs' own documented integration method for exactly
# this case.

# Default is "Aggregator" (StatefulSet) - "Agent" (DaemonSet) is required to
# get one Vector pod per node tailing that node's own /var/log (the chart's
# own default hostPath mounts for the Agent role).
role: Agent

# 256Mi, not 128Mi. At 128Mi every Vector pod sat pinned at its memory limit
# (peak working set ~133MB on all 7 nodes, confirmed from cAdvisor) and was
# OOMKilled over and over (3-57 restarts each). A container held against its
# limit continually evicts and re-reads its own file pages, so the node's disk
# is hammered with READS and no writes: on rpi-4b-1 (the busiest logs, a Pi 4B
# with a USB SSD) Vector read ~7.4 TB in 8 hours, driving the node to ~86% I/O
# wait and a load average of ~25 and starving everything else scheduled there
# (Grafana's start-up, Longhorn, ...). Memory is requested == limited so it's
# reserved, not overcommitted.
resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 256Mi

# Confirmed live previously: the chart's default image (distroless) has no
# shell and no journalctl binary, and Vector's journald source works by
# spawning journalctl as a subprocess, so it's a hard requirement.
# image.base: debian switches the tag to the systemd-carrying debian variant.
image:
  base: debian

# Confirmed live previously on both a control-plane (4B) and an agent (5)
# node that these nodes run journald in volatile mode: /var/log/journal
# exists but is empty, the real actively-written journal lives under
# /run/log/journal.
extraVolumes:
  - name: run-log-journal
    hostPath:
      path: /run/log/journal
extraVolumeMounts:
  - name: run-log-journal
    mountPath: /run/log/journal
    readOnly: true

# Exposes the opensearch-admin-credentials Secret's username/password keys as
# same-named env vars (group_vars/all/cluster_secrets.yaml seeds this Secret;
# manifests/cluster.yaml's security.config.adminCredentialsSecret references
# the same one) - customConfig below reads them via Vector's native ${VAR}
# environment variable interpolation, not committed inline.
envFrom:
  - secretRef:
      name: opensearch-admin-credentials
# ${VAR} interpolation is disabled by default in this Vector version - a
# security hardening change, confirmed via vector.dev's own environment
# variables reference doc. Without this, Vector silently sends the literal
# strings "${username}"/"${password}" as Basic Auth credentials instead of
# their real values - confirmed live: every bulk request got a clean
# 401 Unauthorized from OpenSearch, correctly dropped by Vector as
# non-retriable (not a bug on either side, just interpolation never
# happening). The identical real password from the same Secret authenticated
# fine via direct curl, which is what isolated this to interpolation being
# off rather than a credentials mismatch.
env:
  - name: VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION
    value: 'true'

# Full replace, not a merge (the chart's own comment: "if used all options
# need to be specified"). Re-diff against the chart's own values.yaml on any
# future chart bump.
customConfig:
  data_dir: /vector-data-dir
  api:
    enabled: false
    address: 0.0.0.0:8686
  sources:
    k8s:
      type: kubernetes_logs
    internal_metrics:
      type: internal_metrics
    journal:
      type: journald
      journal_directory: /run/log/journal
  transforms:
    parser:
      type: remap
      inputs: [k8s]
      source: |
        .log = parse_json(.message) ?? .message
        del(.message)
  sinks:
    exporter:
      type: prometheus_exporter
      address: 0.0.0.0:9090
      inputs: [internal_metrics]
    # https://opensearch:9200 - "opensearch" is manifests/cluster.yaml's
    # general.serviceName, not "opensearch-client" (that was the plain
    # chart's own service naming, from before this app switched to the
    # operator). api_version: v8 avoids the deprecated bulk-action `_type`
    # field older API versions send, which OpenSearch 2.x+ rejects outright
    # (https://github.com/vectordotdev/vector/issues/23342) - not a
    # VictoriaLogs-specific setting, still needed here. tls.verify_certificate:
    # false trusts the operator's self-signed cert (security.tls.http.generate:
    # true in cluster.yaml) - nothing here talks to a real CA-issued cert.
    # auth reads the same admin credentials Dashboards uses (envFrom above).
    opensearch:
      type: elasticsearch
      inputs: [parser]
      endpoints: ['https://opensearch:9200']
      mode: bulk
      api_version: v8
      compression: gzip
      healthcheck:
        enabled: false
      tls:
        verify_certificate: false
      auth:
        strategy: basic
        user: '${username}'
        password: '${password}'
      bulk:
        index: 'logs-%Y.%m.%d'
    # Same retargeting as the sink above - separate sink for the same reason
    # as before: journald events don't carry any kubernetes.* fields, so a
    # shared index naming scheme would still be fine, but keeping journal
    # entries in their own daily index (logs-host-*, also covered by
    # manifests/ism-policy.yaml's logs-* ismTemplate pattern) keeps them
    # easy to filter/browse separately in Dashboards.
    opensearch_host:
      type: elasticsearch
      inputs: [journal]
      endpoints: ['https://opensearch:9200']
      mode: bulk
      api_version: v8
      compression: gzip
      healthcheck:
        enabled: false
      tls:
        verify_certificate: false
      auth:
        strategy: basic
        user: '${username}'
        password: '${password}'
      bulk:
        index: 'logs-host-%Y.%m.%d'
    # VictoriaLogs (apps/victoria-logs/) - no TLS, no auth, unlike the
    # opensearch sinks above: VictoriaLogs itself has no security plugin
    # equivalent and this chart's defaults run it with no auth at all,
    # same reasoning as every other app in this cluster that doesn't
    # mandate it. Service name confirmed via `helm template vls
    # victoriametrics/victoria-logs-single --version 0.13.9` (releaseName
    # "vls" + the chart's own fixed "-victoria-logs-single-server" suffix),
    # same naming this repo's old apps/victoria-logs/ already used before
    # it was removed. VL-Time-Field/VL-Stream-Fields/VL-Msg-Field and the
    # AccountID/ProjectID pair are VictoriaLogs' own documented
    # elasticsearch-bulk-ingestion headers (its multitenancy fields,
    # "0"/"0" being the default/only tenant a single-tenant deploy like
    # this needs) - carried over verbatim from this cluster's prior
    # VictoriaLogs config, not re-derived.
    vlogs:
      type: elasticsearch
      inputs: [parser]
      # Confirmed live, broken: VictoriaLogs rejected every request with
      # "unsupported path requested: \"/_bulk\"" (Vector's elasticsearch
      # sink always appends /_bulk to whatever endpoint URL it's given) -
      # the real path is /insert/elasticsearch/_bulk, confirmed against
      # VictoriaLogs' own Vector-setup docs, not the bare root this
      # previously carried over unverified. The VL-Time-Field/VL-Stream-
      # Fields/VL-Msg-Field request headers below that path were wrong too
      # (same source) - those three are `query` params (_time_field/
      # _stream_fields/_msg_field), not headers; only AccountID/ProjectID
      # (multi-tenancy) really are headers.
      endpoints: ['http://vls-victoria-logs-single-server.monitoring.svc.cluster.local:9428/insert/elasticsearch/']
      mode: bulk
      api_version: v8
      compression: gzip
      healthcheck:
        enabled: false
      query:
        _time_field: timestamp
        _stream_fields: stream,kubernetes.pod_name,kubernetes.container_name,kubernetes.pod_namespace
        _msg_field: log
      request:
        headers:
          AccountID: '0'
          ProjectID: '0'
    # Same reasoning as opensearch_host above - journald events carry none
    # of the kubernetes.* fields vlogs's VL-Stream-Fields expects, so this
    # needs its own stream-field set, not a shared sink.
    vlogs_host:
      type: elasticsearch
      inputs: [journal]
      # Same two fixes as the vlogs sink above - real bulk path, and
      # _time_field/_stream_fields/_msg_field as query params not headers.
      # journald events keep their own .message field (no parser transform
      # renames it the way k8s container logs' .log does), confirmed
      # against a live sample doc already indexed in OpenSearch.
      endpoints: ['http://vls-victoria-logs-single-server.monitoring.svc.cluster.local:9428/insert/elasticsearch/']
      mode: bulk
      api_version: v8
      compression: gzip
      healthcheck:
        enabled: false
      query:
        _time_field: timestamp
        _stream_fields: host,_SYSTEMD_UNIT,PRIORITY
        _msg_field: message
      request:
        headers:
          AccountID: '0'
          ProjectID: '0'
