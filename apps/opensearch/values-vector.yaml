# Ships this cluster's logs to OpenSearch (apps/opensearch/manifests/ has the
# index template and retention policy; Dashboards is the log UI): container logs
# (kubernetes_logs) to logs-*, host/journald logs to logs-host-*. Sourced from
# Vector's own chart (https://helm.vector.dev). VictoriaLogs used to be a second
# backend here and is gone - fewer sinks means roughly half the buffering,
# compression and outbound requests per node.

# Default is "Aggregator" (StatefulSet) - "Agent" (DaemonSet) is required to
# get one Vector pod per node tailing that node's own /var/log (the chart's
# own default hostPath mounts for the Agent role).
role: Agent

# 256Mi, not 128Mi. At 128Mi every Vector pod sat pinned at its memory limit
# (peak working set ~133MB on all 7 nodes, confirmed from cAdvisor) and was
# OOMKilled over and over (3-57 restarts each). A container held against its
# limit continually evicts and re-reads its own file pages, so the node's disk
# is hammered with READS and no writes: on rpi-4b-1 (the busiest logs, a Pi 4B
# with a USB SSD) Vector read ~7.4 TB in 8 hours, driving the node to ~86% I/O
# wait and a load average of ~25 and starving everything else scheduled there
# (Grafana's start-up, Longhorn, ...). Memory is requested == limited so it's
# reserved, not overcommitted.
# Tolerates the audio node's taint (host_vars/rpi-3bplus-1.yaml) so its logs
# ship too; the node has almost no workloads, so Vector's real use is small.
tolerations:
  - key: dedicated
    operator: Equal
    value: audio
    effect: NoSchedule

# 512Mi, not 256Mi: at 256Mi the two Vectors on the Pi 4Bs sat at their cgroup
# limit and thrashed - their own binary's pages evicted and re-read from the
# USB SSD (90+ MB/s, 7k IOPS, 40-60% iowait node-wide). Healthy Vectors use
# 40-90Mi; this is headroom for the 0.55-0.58 kubernetes_logs backlog
# behaviour (vectordotdev/vector#26465) and sink retries (#25212), which the
# source/sink settings below also bound.
resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 10m
    memory: 256Mi

# Confirmed live previously: the chart's default image (distroless) has no
# shell and no journalctl binary, and Vector's journald source works by
# spawning journalctl as a subprocess, so it's a hard requirement.
# image.base: debian switches the tag to the systemd-carrying debian variant.
image:
  base: debian

# Confirmed live previously on both a control-plane (4B) and an agent (5)
# node that these nodes run journald in volatile mode: /var/log/journal
# exists but is empty, the real actively-written journal lives under
# /run/log/journal.
extraVolumes:
  - name: run-log-journal
    hostPath:
      path: /run/log/journal
extraVolumeMounts:
  - name: run-log-journal
    mountPath: /run/log/journal
    readOnly: true

# Exposes the opensearch-admin-credentials Secret's username/password keys as
# same-named env vars (group_vars/all/cluster_secrets.yaml seeds this Secret;
# manifests/cluster.yaml's security.config.adminCredentialsSecret references
# the same one) - customConfig below reads them via Vector's native ${VAR}
# environment variable interpolation, not committed inline.
envFrom:
  - secretRef:
      name: opensearch-admin-credentials
# ${VAR} interpolation is disabled by default in this Vector version - a
# security hardening change, confirmed via vector.dev's own environment
# variables reference doc. Without this, Vector silently sends the literal
# strings "${username}"/"${password}" as Basic Auth credentials instead of
# their real values - confirmed live: every bulk request got a clean
# 401 Unauthorized from OpenSearch, correctly dropped by Vector as
# non-retriable (not a bug on either side, just interpolation never
# happening). The identical real password from the same Secret authenticated
# fine via direct curl, which is what isolated this to interpolation being
# off rather than a credentials mismatch.
env:
  - name: VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION
    value: 'true'

# Full replace, not a merge (the chart's own comment: "if used all options
# need to be specified"). Re-diff against the chart's own values.yaml on any
# future chart bump.
customConfig:
  data_dir: /vector-data-dir
  api:
    enabled: false
    address: 0.0.0.0:8686
  sources:
    k8s:
      type: kubernetes_logs
      # Vector 0.55.0-0.58.0 (vectordotdev/vector#26465, open) reads the whole
      # on-disk log backlog into memory at once and holds it. These bound that:
      # only new data on a file with no checkpoint, nothing old, and no
      # kubelet-rotated plain files (the default excludes only .gz/.tmp).
      read_from: end
      ignore_older_secs: 3600
      exclude_paths_glob_patterns: ["**/*.gz", "**/*.tmp", "**/*.log.*"]
      # Default keeps a handle open on rotated files "forever" - the source of
      # the deleted-but-still-open pgbouncer logs seen on the 4B nodes.
      rotate_wait_secs: 30
      # Serve pod metadata from the apiserver cache (lighter on the control
      # plane; Vector logged apiserver connect errors on the 4Bs).
      use_apiserver_cache: true
    internal_metrics:
      type: internal_metrics
    journal:
      type: journald
      journal_directory: /run/log/journal
  transforms:
    parser:
      type: remap
      inputs: [k8s]
      source: |
        .log = parse_json(.message) ?? .message
        del(.message)
  sinks:
    exporter:
      type: prometheus_exporter
      address: 0.0.0.0:9090
      inputs: [internal_metrics]
    # https://opensearch:9200 - "opensearch" is manifests/cluster.yaml's
    # general.serviceName, not "opensearch-client" (that was the plain
    # chart's own service naming, from before this app switched to the
    # operator). api_version: v8 avoids the deprecated bulk-action `_type`
    # field older API versions send, which OpenSearch 2.x+ rejects outright
    # (https://github.com/vectordotdev/vector/issues/23342). tls.verify_certificate:
    # false trusts the operator's self-signed cert (security.tls.http.generate:
    # true in cluster.yaml) - nothing here talks to a real CA-issued cert.
    # auth reads the same admin credentials Dashboards uses (envFrom above).
    opensearch:
      type: elasticsearch
      inputs: [parser]
      endpoints: ['https://opensearch:9200']
      mode: bulk
      api_version: v8
      compression: gzip
      # Bounded on purpose (vectordotdev/vector#25212: the elasticsearch sink
      # retries without limit during sustained failures and grows until
      # OOMKilled). Small batches/buffers, finite retries (about 2 minutes of
      # outage, then that batch is dropped), memory buffers only - disk buffers
      # would add I/O on the Pi 4B SSDs, which are already the bottleneck.
      batch:
        max_bytes: 1048576
        timeout_secs: 5
      buffer:
        type: memory
        max_events: 200
        when_full: block
      request:
        concurrency: 2
        timeout_secs: 30
        retry_attempts: 15
      healthcheck:
        enabled: false
      tls:
        verify_certificate: false
      auth:
        strategy: basic
        user: '${username}'
        password: '${password}'
      bulk:
        index: 'logs-%Y.%m.%d'
    # Same retargeting as the sink above - separate sink for the same reason
    # as before: journald events don't carry any kubernetes.* fields, so a
    # shared index naming scheme would still be fine, but keeping journal
    # entries in their own daily index (logs-host-*, also covered by
    # manifests/ism-policy.yaml's logs-* ismTemplate pattern) keeps them
    # easy to filter/browse separately in Dashboards.
    opensearch_host:
      type: elasticsearch
      inputs: [journal]
      endpoints: ['https://opensearch:9200']
      mode: bulk
      api_version: v8
      compression: gzip
      # Bounded on purpose (vectordotdev/vector#25212: the elasticsearch sink
      # retries without limit during sustained failures and grows until
      # OOMKilled). Small batches/buffers, finite retries (about 2 minutes of
      # outage, then that batch is dropped), memory buffers only - disk buffers
      # would add I/O on the Pi 4B SSDs, which are already the bottleneck.
      batch:
        max_bytes: 1048576
        timeout_secs: 5
      buffer:
        type: memory
        max_events: 200
        when_full: block
      request:
        concurrency: 2
        timeout_secs: 30
        retry_attempts: 15
      healthcheck:
        enabled: false
      tls:
        verify_certificate: false
      auth:
        strategy: basic
        user: '${username}'
        password: '${password}'
      bulk:
        index: 'logs-host-%Y.%m.%d'
