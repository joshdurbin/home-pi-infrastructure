apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opensearch-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: home-pi
  destination:
    server: https://kubernetes.default.svc
    namespace: opensearch
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # The operator's own OpenSearchCluster CRD is huge (577KB - deeply
      # nested PodSpec-shaped fields for every nodePool's
      # affinity/tolerations/resources/etc, confirmed via `ls -la` on the
      # chart's bundled CRD files). Client-side `kubectl apply` (Argo CD's
      # default) stores the whole object in the
      # kubectl.kubernetes.io/last-applied-configuration annotation, which
      # blew past Kubernetes' 262144-byte annotation limit - confirmed live:
      # `kubectl apply --dry-run=server` on that CRD failed with exactly
      # "metadata.annotations: Too long". Server-Side Apply doesn't use that
      # annotation at all - confirmed live:
      # `kubectl apply --dry-run=server --server-side` on the same CRD
      # succeeds.
      - ServerSideApply=true
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  # Only the operator + its CRDs - deliberately split from
  # apps/opensearch/cluster/application.yaml (the OpenSearchCluster/
  # OpenSearchISMPolicy/OpenSearchIndexTemplate custom resources that use
  # those CRDs, plus Vector). Confirmed live: Argo CD does a discoverability
  # pre-check across an entire Application's manifests before syncing
  # anything, which fails on opensearch.org/v1 if a custom resource using
  # it is bundled in the *same* Application as the CRD that would create
  # it - a chicken-and-egg problem sync-waves *within* one Application don't
  # solve, since that pre-check runs before wave-based ordering even starts.
  # Splitting into two Applications, ordered by sync-wave *between* them
  # (this one: wave 1, the other: wave 2), works because the root app-of-apps
  # doesn't create the wave-2 Application at all until this one is
  # Synced+Healthy - see apps/opensearch/cluster/application.yaml.
  sources:
    - repoURL: https://opensearch-project.github.io/opensearch-k8s-operator/
      chart: opensearch-operator
      # 3.0.2, not 3.0.14 (this app's first pin) or 2.8.2 (a rejected
      # intermediate downgrade) - see values-operator.yaml's own comment for
      # the full chain: 3.0.14's default image was never published upstream
      # (confirmed bug, opensearch-k8s-operator#1515/#1610), and 2.8.2 turned
      # out to have the *same* class of chart/image drift for a different
      # flag. 3.0.2 is the newest chart version still declaring
      # appVersion: 3.0.0-alpha - the one real 3.x image that actually
      # exists - keeping this on the modern opensearch.org API group rather
      # than settling for an older 2.x line. apps/opensearch/manifests/*.yaml
      # were re-validated with jsonschema against this chart version's own
      # bundled CRDs, not just assumed compatible.
      targetRevision: 3.0.2
      helm:
        releaseName: opensearch-operator
        valueFiles:
          - $values/apps/opensearch/values-operator.yaml
    - repoURL: https://github.com/joshdurbin/home-pi-infrastructure.git
      targetRevision: master
      ref: values
