# apiVersion opensearch.org/v1, not the older opensearch.opster.io/v1 many
# examples online still use - confirmed via the operator's own chart
# (opensearch-operator/values.yaml's legacyAPI.enabled comment): "org" is the
# current, non-deprecated group; "opster.io" is kept only for backwards
# compatibility. Every field below confirmed against the chart's own bundled
# CRD schema (opensearch.org_opensearchclusters.yaml), not guessed.
apiVersion: opensearch.org/v1
kind: OpenSearchCluster
metadata:
  name: opensearch
  namespace: opensearch
spec:
  general:
    serviceName: opensearch
    version: '3.8.0'
    # Default (confirmed via schema: default: true) - the operator sets
    # vm.max_map_count itself, no equivalent of the plain chart's
    # sysctlInit/host-level ansible task needed.
    setVMMaxMapCount: true
    drainDataNodes: true
    # Official opensearch-project/opensearch-prometheus-exporter plugin
    # (migrated into the OpenSearch org from Aiven - its own README credits
    # "the contributors from the Aiven organization for their work on this
    # project prior to its migration"), pinned to release 3.8.0.0 to exactly
    # match general.version above - OpenSearch plugin releases are
    # version-locked to a specific OpenSearch release. Confirmed against the
    # operator's own user guide: this is the correct field
    # (spec.general.pluginsList, not spec.bootstrap.pluginsList, which only
    # covers the transient bootstrap pod, not the real client/data node
    # pools). Items here are passed straight to `bin/opensearch-plugin
    # install`, and changing this list triggers a rolling restart of every
    # OpenSearch node to install it - expected on first apply, not a bug.
    # Exposes /_prometheus/metrics on the existing 9200 port (no separate
    # port) - see manifests/vmservicescrape.yaml for how that's scraped.
    pluginsList:
      - https://github.com/opensearch-project/opensearch-prometheus-exporter/releases/download/3.8.0.0/prometheus-exporter-3.8.0.0.zip

  # The operator creates this bootstrap pod automatically regardless of
  # whether this section is specified - only added here for nodeSelector
  # (see below).
  bootstrap:
    nodeSelector:
      pi5: 'true'

  # TLS + auth are effectively mandatory for the OpenSearch cluster itself
  # under this operator (no DISABLE_SECURITY_PLUGIN equivalent) - accepted
  # deliberately, not an oversight, despite every other UI in this cluster
  # running with no in-app auth. operator-generated self-signed certs
  # (generate: true) rather than supplying our own CA - nothing external
  # ever talks to opensearch:9200 (general.serviceName below) directly except
  # Vector and Dashboards, both inside the cluster, and both already need to
  # trust a self-signed cert either way.
  security:
    config:
      adminCredentialsSecret:
        name: opensearch-admin-credentials
      # This Job runs a one-off container to apply the generated security
      # config to the cluster - same Amazon-Linux-based image as the
      # OpenSearch nodes themselves, same CPU requirement, needs pinning too
      # (confirmed live: crashed with the same "Fatal glibc error" on an
      # rpi-4b before this was added).
      updateJob:
        nodeSelector:
          pi5: 'true'
    tls:
      http:
        generate: true
      transport:
        generate: true

  dashboards:
    enable: true
    version: '3.8.0'
    replicas: 1
    # Dashboards' own TLS is independently toggleable from the cluster's
    # (confirmed via schema: dashboards.tls.enable is a separate field from
    # security.tls.http.enabled) - kept off since Tailscale is what
    # terminates TLS for browser access here, same as every other UI in this
    # cluster (Grafana, Argo CD). Dashboards still authenticates to the
    # (TLS+auth-secured) OpenSearch backend behind it via the same
    # credentials Secret.
    tls:
      enable: false
    opensearchCredentialsSecret:
      name: opensearch-admin-credentials
    # Same Amazon-Linux-based image/CPU requirement as the OpenSearch nodes
    # themselves - confirmed live: crashed with the same "Fatal glibc error"
    # on an rpi-4b before this was added (one of two Dashboards replicas
    # landed there and crash-looped; the other happened to land on an rpi-5
    # and ran fine).
    nodeSelector:
      pi5: 'true'
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 10m
        memory: 512Mi

  nodePools:
    # HA layout: TWO client pods and TWO data pods, each with its own PVC.
    # Four cluster_manager-eligible nodes (client x2 + data x2): OpenSearch keeps
    # an odd-sized voting set (3 of the 4), so the cluster survives losing any one
    # node. With 2 data nodes and number_of_replicas: 1 (manifests/index-template.yaml)
    # every shard has a copy on each data node: losing one data pod or its disk
    # loses no logs and indexing continues; ingest is on both client pods, so
    # Vector's requests to the `opensearch` Service survive one of them going away.
    # Capacity: ~1.5Gi memory per pod (6Gi total, was 3Gi) on the Pi 5 nodes.
    #
    # Coordinating (ingest) + cluster-manager pool. Two things must hold:
    #
    # 1. cluster_manager-ELIGIBLE here, alongside the data pool. The operator
    #    bootstraps a new cluster with a throwaway bootstrap pod, which starts
    #    as the lone voter; OpenSearch keeps an ODD-sized voting set, so with
    #    only ONE other eligible node (data) it never makes that node a voter,
    #    and removing the bootstrap pod leaves nobody who can win an election
    #    (quorum lost the moment bootstrap exits - confirmed live, no recovery).
    #    With two eligible pool nodes plus bootstrap there are three voters
    #    during bootstrap and the hand-off works.
    # 2. PERSISTENT storage (a PVC, not emptyDir). With emptyDir every pod
    #    eviction - a node drain, not just a container restart - gave it a
    #    brand-new node ID; the old IDs stayed in the voting configuration
    #    forever, quorum was permanently lost, and OpenSearch stayed down until
    #    rebuilt. With a PVC the node keeps its identity across restarts,
    #    reschedules and drains: it simply comes back (a short outage while it
    #    does) instead of the cluster dying.
    - component: client
      replicas: 2
      roles:
        - cluster_manager
        - ingest
        - remote_cluster_client
      diskSize: '2Gi'
      persistence:
        pvc:
          storageClass: longhorn
          accessModes:
            - ReadWriteOnce
      # Amazon-Linux-based image requires ARMv8.2-A + crypto extensions -
      # Pi 4B's Cortex-A72 doesn't have them, Pi 5's Cortex-A76 does.
      # Confirmed live: "Fatal glibc error: This version of Amazon Linux
      # requires a newer ARM64 processor..." on every pod that landed on an
      # rpi-4b node; fine on rpi-5. host_vars/rpi-5-*.yaml's own comment has
      # the full explanation - not opensearch-specific, reusable label.
      nodeSelector:
        pi5: 'true'
      # 384M/768Mi was too tight - confirmed live, OOMKilled (exitCode 137)
      # repeatedly: this pool runs cluster_manager+ingest roles plus the
      # security, index-management, rollup, and performance-analyzer
      # plugins, carrying real off-heap overhead beyond the heap alone.
      # Doubled rather than nudged, matching this repo's own sizing pattern
      # elsewhere for the same class of live-confirmed OOM.
      # Redundancy: the two pods of this pool never share a node (required), and
      # the scheduler also prefers spreading across every OpenSearch pod. At
      # most one pod of the pool is ever voluntarily down (drains, node
      # maintenance), so the cluster keeps serving.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  opensearch.org/opensearch-cluster: opensearch
                  opensearch.org/opensearch-nodepool: client
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    opensearch.org/opensearch-cluster: opensearch
                topologyKey: kubernetes.io/hostname
      pdb:
        enabled: true
        maxUnavailable: 1
      jvm: '-Xmx512M -Xms512M'
      resources:
        limits:
          memory: 1536Mi
        requests:
          cpu: 10m
          memory: 1536Mi
    # The only pool that actually holds shards, so the only one with a real
    # PVC. Originally left deliberately unpinned (Longhorn PVCs don't
    # require the pod to run on a storage: "true" node specifically), but
    # that turned out to be moot: confirmed live, this image can't run on an
    # rpi-4b at all regardless of disk placement - see the client pool's own
    # nodeSelector comment above for the full explanation. Pinned to pi5
    # nodes now for that hardware reason, not the disk-quality one this
    # comment used to be about.
    - component: data
      replicas: 1
      # cluster_manager added alongside data - see the client pool's own
      # comment for why. Two permanent manager-eligible nodes instead of
      # one means the cluster can always re-elect between them, rather than
      # depending on the operator's transient bootstrap pod ever coming
      # back once it's been cleaned up.
      roles:
        - data
        - cluster_manager
      diskSize: '10Gi'
      persistence:
        pvc:
          storageClass: longhorn
          accessModes:
            - ReadWriteOnce
      nodeSelector:
        pi5: 'true'
      # Heap capped at 50% of the container memory limit, per OpenSearch's
      # own heap-sizing guidance - the other 50% is headroom for off-heap
      # Lucene buffers/segment merges, not slack to trim.
      # Redundancy: the two pods of this pool never share a node (required), and
      # the scheduler also prefers spreading across every OpenSearch pod. At
      # most one pod of the pool is ever voluntarily down (drains, node
      # maintenance), so the cluster keeps serving.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  opensearch.org/opensearch-cluster: opensearch
                  opensearch.org/opensearch-nodepool: data
              topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    opensearch.org/opensearch-cluster: opensearch
                topologyKey: kubernetes.io/hostname
      pdb:
        enabled: true
        maxUnavailable: 1
      jvm: '-Xmx768M -Xms768M'
      resources:
        limits:
          memory: 1536Mi
        requests:
          cpu: 10m
          memory: 1536Mi
