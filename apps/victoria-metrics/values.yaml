alertmanager:
  config:
    route:
      group_by:
        - alertgroup
        - job
      group_interval: 30m
      group_wait: 15m
      repeat_interval: 12h
      receiver: default
      routes:
        - matchers:
            - alertname=~"InfoInhibitor|Watchdog"
          receiver: watchdog
    receivers:
      - name: default
      - name: watchdog
  spec:
    replicaCount: 1
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 128Mi
    storage:
      emptyDir: {}
  useManagedConfig: true
# defaultDashboards.defaultTimezone (previously: utc) was removed in chart 0.85.0 - dashboards are no
# longer Helm-templated ConfigMaps, they're fetched/applied as-is at deploy time, so there's no
# {{ .Values... }} substitution point left in them to force a timezone through. Grafana now falls back to
# each dashboard's own default (usually "browser"). No values.yaml equivalent exists for this chart version;
# revisit if VictoriaMetrics adds one, or set it per-dashboard/per-org directly in Grafana if it matters.
defaultDashboards:
  dashboards:
    victoriametrics-operator:
      enabled: true
    victoriametrics-vmalert:
      enabled: true
grafana:
  admin:
    existingSecret: vmks-credentials
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    auth:
      disable_login_form: true
    auth.anonymous:
      enabled: true
      org_role: Admin
  plugins:
    - victoriametrics-logs-datasource
    - victoriametrics-metrics-datasource
  persistence:
    accessModes:
      - ReadWriteOnce
    enabled: true
    size: 2Gi
    storageClassName: longhorn
  # Confirmed live deadlock: default RollingUpdate tries to bring up a new
  # pod before killing the old one, but with a single ReadWriteOnce PVC and
  # replicas: 1, the new pod (often scheduled to a different node) can never
  # attach the volume - it's still mounted by the old pod, which RollingUpdate
  # won't kill until the new one is Ready. Deadlocks every rollout
  # (ProgressDeadlineExceeded) until someone manually deletes the old pod.
  # Recreate kills the old pod first, releasing the PVC before the new one
  # is even scheduled.
  deploymentStrategy:
    type: Recreate
  # Back to 1 - the stale vmks-grafana PVC (crash-looping under Grafana
  # 13.1.1 with "Datasource provisioning error: data source not found",
  # see git log) has been deleted. A fresh PVC + fresh grafana.db gets
  # created on this sync, with no legacy UID history to conflict with.
  replicas: 1
  # 256Mi was right-sized for Grafana 12.4.2. Confirmed live (OOMKilled,
  # exitCode 137) that Grafana 13.1.1 (bundled by this chart version) is a
  # meaningfully heavier process - its startup log shows a whole new
  # apiserver/unified-storage/bleve-search-index subsystem set that 12.x
  # never had - and it was still climbing past 256Mi under nothing more
  # than a single dashboard being viewed (`kubectl top pod` showed ~201Mi at
  # idle, right after a restart). Doubled, matching this repo's other
  # "give it real headroom rather than nudge it" sizing (e.g. vmagent).
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 512Mi
kube-state-metrics:
  replicas: 1
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 128Mi
prometheus-node-exporter:
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 128Mi
victoria-metrics-operator:
  operator:
    enable_converter_ownership: true
  replicaCount: 1
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 128Mi
vmagent:
  spec:
    replicaCount: 1
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 10m
        memory: 512Mi
    scrapeInterval: 30s
    scrapeTimeout: 25s
    # VMAgent.spec has no "storage" field at all (confirmed via
    # `kubectl explain vmagent.spec.storage` against the real CRD - a real
    # sync failure: ".spec.storage: field not declared in schema"). The
    # closest field, statefulStorage, switches vmagent from a Deployment to
    # a StatefulSet, which is a bigger behavioral change than intended just
    # to cap ephemeral disk use - not worth it for this workload, so this is
    # dropped rather than guess-substituted.
vmalert:
  spec:
    replicaCount: 1
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 128Mi
vmsingle:
  spec:
    extraArgs:
      dedup.minScrapeInterval: 30s
    nodeSelector:
      telemetry: "true"
    replicaCount: 1
    resources:
      limits:
        memory: 1024Mi
      requests:
        cpu: 10m
        memory: 1024Mi
    retentionPeriod: 48h
    storage:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: longhorn
