alertmanager:
  config:
    route:
      group_by:
        - alertgroup
        - job
      group_interval: 30m
      group_wait: 15m
      repeat_interval: 12h
      receiver: default
      routes:
        - matchers:
            - alertname=~"InfoInhibitor|Watchdog"
          receiver: watchdog
    receivers:
      - name: default
      - name: watchdog
  spec:
    replicaCount: 1
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 128Mi
    storage:
      emptyDir: {}
  useManagedConfig: true
# defaultDashboards.defaultTimezone (previously: utc) was removed in chart 0.85.0 - dashboards are no
# longer Helm-templated ConfigMaps, they're fetched/applied as-is at deploy time, so there's no
# {{ .Values... }} substitution point left in them to force a timezone through. Grafana now falls back to
# each dashboard's own default (usually "browser"). No values.yaml equivalent exists for this chart version;
# revisit if VictoriaMetrics adds one, or set it per-dashboard/per-org directly in Grafana if it matters.
defaultDashboards:
  dashboards:
    victoriametrics-operator:
      enabled: true
    victoriametrics-vmalert:
      enabled: true
grafana:
  admin:
    existingSecret: vmks-credentials
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    # State (users, preferences, annotations, provisioned-dashboard
    # bookkeeping) lives in the cluster's HA Postgres via
    # postgres-pooler-rw (apps/postgres/manifests/grafana-database.yaml),
    # not a local grafana.db - which is why persistence below is off.
    # Password comes in as GF_DATABASE_PASSWORD (envValueFrom below).
    database:
      type: postgres
      host: postgres-pooler-rw.postgres.svc.cluster.local:5432
      name: grafana
      user: grafana
    auth:
      disable_login_form: true
    auth.anonymous:
      enabled: true
      org_role: Admin
  plugins:
    - victoriametrics-metrics-datasource
  envValueFrom:
    GF_DATABASE_PASSWORD:
      secretKeyRef:
        name: grafana-db-credentials
        key: password
  # No PVC: the only stateful thing Grafana had was grafana.db, now in
  # Postgres. Dashboards and datasources are provisioned from ConfigMaps by
  # the sidecars, and plugins are re-installed into an ephemeral dir at
  # startup. With no RWO volume to fight over, the default RollingUpdate
  # strategy works again (the old Recreate workaround existed only for that
  # PVC deadlock).
  persistence:
    enabled: false
  # One replica: all state is in Postgres (grafana.ini above), so a drain just
  # reschedules it (~30-90s gap; Grafana 13 is slow to start on a Pi). Accepted -
  # a second replica costs ~512Mi and a Pi 4B struggled to run it.
  replicas: 1
  # 256Mi was right-sized for Grafana 12.4.2. Confirmed live (OOMKilled,
  # exitCode 137) that Grafana 13.1.1 (bundled by this chart version) is a
  # meaningfully heavier process - its startup log shows a whole new
  # apiserver/unified-storage/bleve-search-index subsystem set that 12.x
  # never had - and it was still climbing past 256Mi under nothing more
  # than a single dashboard being viewed (`kubectl top pod` showed ~201Mi at
  # idle, right after a restart). Doubled, matching this repo's other
  # "give it real headroom rather than nudge it" sizing (e.g. vmagent).
  #
  # Re-sized again after running it on Pi 4B nodes (confirmed live): it sat at
  # 414-555Mi against this 512Mi limit, and with only a 10m CPU request it got
  # almost no CPU share on a busy node (requests set the share under
  # contention, and the scheduler's view of how big the pod is). Start-up on a
  # Pi 4B burns ~1 core for several minutes. 500m CPU makes it a fair
  # contender and tells the scheduler the truth; 768Mi/1Gi gives memory room.
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 768Mi
  # Grafana 13's start-up (dashboard/unified-storage maintenance calling its
  # own API on 127.0.0.1:3000) takes a few minutes on a Pi 4B, during which
  # /api/health is slow or 503. The chart's default liveness probe (60s delay,
  # then 10 x 10s failures = ~160s) killed it mid-start, every time, restarting
  # the whole expensive start-up. The chart has no startupProbe for the main
  # container, so push the liveness probe's first check well past start-up
  # (~7 min) and keep a long tolerance after it.
  livenessProbe:
    httpGet:
      path: /api/health
      port: grafana
    initialDelaySeconds: 420
    periodSeconds: 10
    timeoutSeconds: 30
    failureThreshold: 10
  # Readiness only gates traffic (it never restarts the pod). The default 1s
  # timeout flaps out of the Service on any brief CPU stall on a slow node.
  readinessProbe:
    httpGet:
      path: /api/health
      port: grafana
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6
kube-state-metrics:
  replicas: 1
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 128Mi
prometheus-node-exporter:
  # The audio node (host_vars/rpi-3bplus-1.yaml) is tainted dedicated=audio so
  # nothing else lands on it; node-exporter is the one DaemonSet it keeps.
  tolerations:
    - key: dedicated
      operator: Equal
      value: audio
      effect: NoSchedule
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 128Mi
victoria-metrics-operator:
  operator:
    enable_converter_ownership: true
  replicaCount: 1
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 128Mi
vmagent:
  spec:
    # Two vmagents scrape every target independently, so draining either one's
    # node loses nothing: the other keeps scraping. Both write to vminsert and
    # the identical samples are de-duplicated (dedup.minScrapeInterval on
    # vmstorage/vmselect below), so they must add no replica-specific external
    # label. Required anti-affinity keeps them on different nodes.
    replicaCount: 2
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: vmagent
            topologyKey: kubernetes.io/hostname
    podDisruptionBudget:
      maxUnavailable: 1
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 10m
        memory: 512Mi
    scrapeInterval: 30s
    scrapeTimeout: 25s
    # VMAgent.spec has no "storage" field at all (confirmed via
    # `kubectl explain vmagent.spec.storage` against the real CRD - a real
    # sync failure: ".spec.storage: field not declared in schema"). The
    # closest field, statefulStorage, switches vmagent from a Deployment to
    # a StatefulSet, which is a bigger behavioral change than intended just
    # to cap ephemeral disk use - not worth it for this workload.
vmalert:
  spec:
    replicaCount: 1
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 128Mi
# Metrics storage runs in cluster mode so that losing any one node loses no
# data and never stops ingestion or queries:
#   vminsert (x2, stateless)  receives writes from both vmagents and replicates
#                             each sample to both vmstorage pods
#   vmstorage (x2, own PVCs)  holds the data (replicationFactor 2: each holds
#                             a full copy)
#   vmselect (x2, stateless)  answers queries (Grafana, vmalert, the UI) from
#                             whichever vmstorage pods are up
# Every component has required anti-affinity (one per node) and a PDB, so a
# drain evicts one at a time. None is pinned to a node class: all can run on
# the Pi 4Bs as well as the Pi 5s.
vmsingle:
  enabled: false
vmcluster:
  enabled: true
  spec:
    # The chart default is 1 month; the old single-node instance kept 7d.
    retentionPeriod: 7d
    replicationFactor: 2
    vminsert:
      replicaCount: 2
      # 256Mi was OOMKilled (exitCode 137) right after the first deploy, while
      # the two vmagents flushed their buffered backlog (~10MB batches) at it.
      # 512Mi then OOMKilled the same way (CrashLoopBackOff on both replicas)
      # catching up after a vmstorage outage - 1Gi.
      resources:
        limits:
          memory: 1Gi
        requests:
          cpu: 10m
          memory: 1Gi
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vminsert
              topologyKey: kubernetes.io/hostname
      podDisruptionBudget:
        maxUnavailable: 1
    vmselect:
      replicaCount: 2
      extraArgs:
        # Same as vmstorage: collapses the two vmagents' duplicate samples.
        dedup.minScrapeInterval: 30s
      resources:
        limits:
          memory: 512Mi
        requests:
          cpu: 10m
          memory: 512Mi
      # The query cache is disposable, so no PVC (the chart default is a 2Gi
      # one): a PVC would only make vmselect harder to move on a drain.
      storage:
        volumeClaimTemplate: null
        emptyDir: {}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vmselect
              topologyKey: kubernetes.io/hostname
      podDisruptionBudget:
        maxUnavailable: 1
    vmstorage:
      replicaCount: 2
      extraArgs:
        # The two vmagents scrape the same targets, so every sample arrives
        # twice with slightly different timestamps; keep one per 30s interval.
        dedup.minScrapeInterval: 30s
        # Default is 60% of the memory limit. At 2Gi that is ~1.2GB of caches,
        # which on a 4GB Pi 4B (which also runs ~25 other pods) pushed the node
        # into swap/page-cache thrashing - load average 70, kswapd pegged, every
        # probe on the node timing out. 35% keeps caches ~700MB (what 1Gi at
        # 60% gave, which was fine for steady state) and leaves the rest of the
        # 2Gi as headroom for merges/catch-up, the thing that actually OOMed.
        memory.allowedPercent: "35"
      # 2Gi, not 1Gi: confirmed live (both replicas OOMKilled, exit 137, 15+
      # restarts, CrashLoopBackOff) while catching up after an outage. The
      # store opens with ~12M blocks for ~15M rows (tiny parts written during
      # the backlog replay), and merging them plus the in-memory caches
      # (-memory.allowedPercent=60 of the limit) blew past 1Gi. Each OOM kill
      # leaves an unclean shutdown, which makes the next start slower and the
      # backlog bigger - a loop only more headroom breaks.
      resources:
        limits:
          memory: 2Gi
        requests:
          cpu: 50m
          memory: 2Gi
      # Each vmstorage's data is its own Longhorn volume (default 2 Longhorn
      # replicas, deliberately NOT 1: with 1, draining the storage=true node
      # that holds it would be blocked by Longhorn's last-replica drain policy).
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
      affinity:
        # Soft preference only: Pi 5s (8GB) first, but the Pi 4Bs stay eligible
        # so they are still used when the Pi 5s are full or one is drained.
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: pi5
                    operator: In
                    values: ["true"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vmstorage
              topologyKey: kubernetes.io/hostname
      podDisruptionBudget:
        maxUnavailable: 1
