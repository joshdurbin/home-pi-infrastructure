apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics
  namespace: argocd
  annotations:
    # Uses Longhorn-backed PVCs (vmsingle), so syncs after it.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: home-pi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # prometheus-operator-crds ships large CRDs - same annotation-size
      # rationale as Longhorn's ServerSideApply=true above.
      - ServerSideApply=true
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-operator-crds
      targetRevision: 28.0.1
    - repoURL: https://victoriametrics.github.io/helm-charts
      chart: victoria-metrics-k8s-stack
      targetRevision: 0.74.1
      helm:
        releaseName: vmks
        valueFiles:
          - $values/apps/victoria-metrics/values.yaml
    - repoURL: https://github.com/joshdurbin/home-pi-infrastructure.git
      targetRevision: master
      ref: values
