# Overrides for the Traefik that k3s installs. Nothing in this cluster is routed through it:
# all 16 Ingresses use the Tailscale class, there are no IngressRoutes, and Blocky has its
# own LoadBalancers - but it runs anyway and its LoadBalancer Service publishes ports 80/443
# on every node. (Removing it outright is a k3s server setting, `disable: [traefik]`, and a
# restart of the control plane; this only makes it stop phoning home.)
#
# Traefik's static config has `global.checkNewVersion`, which by default periodically
# contacts update.traefik.io and shares the running version and this network's public IP.
# k3s's args set neither it nor sendAnonymousUsage (opt-in, off), so it is running on the
# built-in default. Setting both explicitly keeps it off if a default ever changes.
#
# k3s re-runs the chart (the helm-install-traefik Job) when this changes, which redeploys
# Traefik - harmless here, nothing uses it.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    globalArguments:
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
