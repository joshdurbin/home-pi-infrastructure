# Traefik's Prometheus entrypoint (the pod's "metrics" port, 9100, on by default in the k3s
# packaged chart): requests, latency and status codes per entrypoint/service/router.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: traefik
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
