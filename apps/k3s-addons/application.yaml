apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k3s-addons
  namespace: argocd
  annotations:
    # Config for the components k3s itself installs (today: CoreDNS's telemetry sinkhole).
    # Traefik is disabled in group_vars/server/main.yaml, so its HelmChartConfig is gone. Nothing
    # depends on this and it depends on nothing but k3s, so any late wave will do.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: home-pi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  sources:
    - repoURL: https://github.com/joshdurbin/home-pi-infrastructure.git
      targetRevision: master
      path: apps/k3s-addons/manifests
