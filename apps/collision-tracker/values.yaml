# Collision tracker: finds news reports of collisions involving vulnerable road users, extracts
# facts with an LLM, merges duplicates, and shows them on a map. Chart and application code:
# https://github.com/joshdurbin/vulnerable_user_incident_tracking (deploy/helm/collision-tracker, docs/runbooks/).
#
# UI: https://collisions.<tailnet> (Tailscale Ingress, tailnet only).

image:
  # Pinned to one commit of the app repo (tag + digest; the digest wins). Zot never rechecks a tag it
  # already holds, so a floating `latest` would not roll out. To update: take the new commit from the app
  # repo's CI, set its sha as the tag here and in application.yaml (targetRevision), and the digests from
  # `curl -sI -H "Authorization: Bearer $(curl -s 'https://ghcr.io/token?scope=repository:joshdurbin/vulnerable_user_incident_tracking/<name>:pull' | jq -r .token)" -H 'Accept: application/vnd.oci.image.index.v1+json' https://ghcr.io/v2/joshdurbin/vulnerable_user_incident_tracking/<name>/manifests/<sha>`.
  collisionctl: { tag: a76468c4b2ad3682fc93fe1c48aa0ec0a07bd903, digest: "sha256:0d30f30a595d5619a327287fd5bec5c1a785b304f1a8c36087f102d1845c2ced" }
  crawler: { tag: a76468c4b2ad3682fc93fe1c48aa0ec0a07bd903, digest: "sha256:d90308f815c13d86f8b75ede94703cc2012366c4da4988cb38a93e6f57fc4394" }
  web: { tag: a76468c4b2ad3682fc93fe1c48aa0ec0a07bd903, digest: "sha256:51d55f31a31faa5c71b3b8b1a0586550055003d9bee85ccf2c0eec23beab26ce" }

llm:
  # Through Bifrost (the chart's default base URL, open inside the cluster, no key). Models are
  # <provider>/<model>: omlx/* is omlx on the Mac over the tailnet (needs the Mac awake); llm/* is the
  # local llama.cpp model (apps/llm/), used as the fallback. List them with
  # `curl http://bifrost.bifrost.svc.cluster.local:8080/v1/models`. When an OpenRouter provider is added
  # to Bifrost, change this to one of its ids (and set fallbackModel).
  model: omlx/Qwen3.6-35B-A3B-4bit
  fallbackModel: llm/qwen2.5-1.5b-instruct
  # LLM spend is tracked outside the app (Bifrost / the provider), so the chart has no budget or price settings.

# Full-text search over incidents, in the shared OpenSearch cluster (apps/opensearch/). The index is
# derived from Postgres: lose it and "Rebuild index" on the app's Admin page refills it. The `collision`
# user is confined to collision-incidents* by apps/opensearch/manifests/users.yaml; its password is derived
# in group_vars/all/cluster_secrets.yaml (run `make deploy-secrets` before the first sync).
search:
  enabled: true

temporal:
  retention: 72h
  uiUrl: https://temporal.tailb42321.ts.net

# Small cluster: modest replicas. The worker must stay at one replica (provider rate limits are per process).
api:
  replicas: 2
web:
  replicas: 2
