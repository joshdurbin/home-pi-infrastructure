apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: collision-tracker
  namespace: argocd
  # Stateless (its data lives in the shared Postgres cluster and in Temporal), so it is
  # safe to cascade-delete its resources if the Application is removed.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Needs, in this order: the Postgres role, database and extensions (apps/postgres, wave 2),
    # the Temporal frontend (apps/temporal, wave 3), and the Secrets seeded by Ansible
    # (k8s_secrets). The chart's PreSync Jobs retry until the database and Temporal answer,
    # so wave 4 only has to come after those.
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: home-pi
  destination:
    server: https://kubernetes.default.svc
    namespace: collision-tracker
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  sources:
    # The chart lives with the application's own code; only its values live here.
    - repoURL: https://github.com/joshdurbin/vulnerable_user_incident_tracking.git
      targetRevision: main
      path: deploy/helm/collision-tracker
      helm:
        releaseName: collision-tracker
        valueFiles:
          - $values/apps/collision-tracker/values.yaml
    - repoURL: https://github.com/joshdurbin/home-pi-infrastructure.git
      targetRevision: master
      ref: values
