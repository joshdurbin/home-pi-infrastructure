# No bundled Cassandra/MySQL/PostgreSQL/Elasticsearch dependencies in this
# chart version (checked Chart.yaml directly - none exist), so there's
# nothing to disable, only the external persistence config below to set.
server:
  image:
    repository: temporalio/server
    tag: 1.32.1
  # No phone-home. The frontend's version checker (service/frontend/version_checker.go)
  # periodically calls Temporal's version service with the product, server version, CPU
  # arch, OS, database type, the cluster ID and which client SDKs are connecting; any
  # non-empty value of this env var turns it off (it is the default of the dynamic-config
  # key frontend.enableServerVersionCheck). Applies to every server service; only the
  # frontend reads it.
  additionalEnv:
    - name: TEMPORAL_VERSION_CHECK_DISABLED
      value: "true"
  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      # Chart default (512) is sized for real production scale and cannot
      # be changed after the initial deployment. 4 matches Temporal's own
      # small-scale/docker-compose defaults - appropriate here, this is a
      # homelab-scale deployment, not a case for 512-way history sharding.
      numHistoryShards: 4
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12_pgx
            driverName: postgres12_pgx
            databaseName: temporal
            connectAddr: "postgres-pooler-rw.postgres.svc.cluster.local:5432"
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-db-credentials
            secretKey: password
        # Advanced visibility, on the shared OpenSearch cluster (apps/opensearch/): custom
        # search attributes and full list/filter queries. Used to be SQL
        # (temporal_visibility database, still in Postgres, now unused). `version: v7` is the
        # Elasticsearch-7 wire protocol, which OpenSearch speaks. The `temporal` user is
        # confined to temporal_visibility* by apps/opensearch/manifests/users.yaml. The
        # cluster's certificate is self-signed (operator-generated), hence no host
        # verification - same as Vector's sink.
        visibility:
          elasticsearch:
            version: v7
            url:
              scheme: https
              host: "opensearch.opensearch.svc.cluster.local:9200"
            username: temporal
            existingSecret: temporal-opensearch-credentials
            secretKey: password
            logLevel: error
            indices:
              visibility: temporal_visibility_v1
            tls:
              enabled: true
              enableHostVerification: false
            manageSchema: true
    # Native Prometheus metrics already on by default (port 9090, no toggle
    # needed) - only disabling the chart's own annotation-based scrape
    # hints here, since this repo scrapes via a hand-written VMPodScrape
    # (apps/temporal/manifests/vmpodscrape.yaml) instead, same reasoning as
    # every other app here: avoids depending on the VM operator's
    # ServiceMonitor/PodMonitor converter, which this cluster has never
    # observed actually converting anything.
    metrics:
      annotations:
        enabled: false
  frontend:
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 256Mi
  history:
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 256Mi
  # matching and worker both bumped from an initial 100m/128Mi to match
  # frontend/history - confirmed live: the worker pod repeatedly failed to
  # start ("unable to bootstrap ringpop. retrying: join duration ... exceeded
  # max 30s", then the whole fx app hit "context deadline exceeded") under
  # the 100m limit. All four components join the same ringpop membership
  # gossip ring on a fixed 30s deadline - on this cluster's Pi hardware,
  # 100m wasn't enough CPU for that round trip to complete in time.
  matching:
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 256Mi
  worker:
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 256Mi

web:
  enabled: true
  image:
    repository: temporalio/ui
    tag: 2.56.0
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 50m
      memory: 128Mi

schema:
  # Helm hooks (pre-install/pre-upgrade Job) translate directly to Argo
  # CD's own equivalent hook/wave handling - no reason to disable this for
  # Flux/Rancher/Terraform-style workarounds, which don't apply here.
  useHelmHooks: true

# Admin tools (also the schema Job's image): same version as the server.
admintools:
  image:
    tag: "1.32.1"
