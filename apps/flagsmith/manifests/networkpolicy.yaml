# Egress-only (ingress - Tailscale, other services, vmagent - is unaffected and allowed by
# default): DNS, the pods of this namespace (the frontend proxies to the API), and Postgres
# (the rw pooler, 5432) in the postgres namespace. Nothing else: Flagsmith sends no email and
# its analytics features are switched off by the chart (DISABLE_ANALYTICS_FEATURES).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flagsmith-egress
  namespace: flagsmith
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgres
      ports:
        - protocol: TCP
          port: 5432
