# Egress-only - ingress (litellm's own pod reaching in on 6379) is unaffected
# and allowed by default, this only bounds what these pods can reach out to:
# - CoreDNS, for the headless-service pod DNS names replication and sentinel
#   monitoring depend on.
# - Every other pod in this namespace on the redis (6379) and sentinel
#   (26379) ports, for replication and sentinel monitoring.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-cache-egress
  namespace: litellm-cache
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
