# Scrapes LiteLLM's Prometheus callback (litellm_settings.callbacks:
# ["prometheus"] in values.yaml) at /metrics on the proxy port. Chart
# Service is named "litellm", port "http" (confirmed via `helm template`).
#
# /metrics requires a LiteLLM API key by default
# (require_auth_for_metrics_endpoint) - rather than switching that off, the
# scrape sends the master key as a bearer token, from the same
# litellm-masterkey Secret the proxy itself reads.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: litellm
  namespace: litellm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  endpoints:
    - port: http
      path: /metrics
      scheme: http
      authorization:
        type: Bearer
        credentials:
          name: litellm-masterkey
          key: masterkey
