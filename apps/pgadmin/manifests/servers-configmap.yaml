# Pre-registers the cluster's Postgres in pgAdmin (imported from
# /pgadmin4/servers.json on first start with an empty data dir). Points at
# postgres-pooler-ro - the read-only pooler, backed by the replica - as the
# read-only `pgadmin` role (apps/postgres/manifests/pgadmin-role.yaml).
# No password here: pgAdmin prompts once on first connect; tick "Save
# password" and it's kept (encrypted) on the PVC.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
  namespace: pgadmin
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "postgres (read-only)",
          "Group": "home-pi",
          "Host": "postgres-pooler-ro.postgres.svc.cluster.local",
          "Port": 5432,
          "MaintenanceDB": "postgres",
          "Username": "pgadmin",
          "SSLMode": "prefer"
        }
      }
    }
