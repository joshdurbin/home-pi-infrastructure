# pgAdmin 4 - web SQL client for the cluster's CloudNativePG Postgres. No
# official Helm chart worth depending on, so the generic
# `bjw-s-labs/app-template` chart (same as RedisInsight/Blocky/SearXNG)
# running the official `dpage/pgadmin4` image directly.
controllers:
  main:
    pod:
      # The image runs as uid/gid 5050 (pgadmin) - fsGroup makes the
      # Longhorn-provisioned /var/lib/pgadmin PVC writable by it.
      securityContext:
        runAsUser: 5050
        runAsGroup: 5050
        fsGroup: 5050
    containers:
      main:
        image:
          repository: dpage/pgadmin4
          tag: "9.18"
        env:
          # Desktop mode: no pgAdmin login screen and no master password.
          # Access control is the tailnet itself, same stance as Grafana's
          # anonymous Admin here - and it means no pgAdmin user/password
          # secret to manage. The EMAIL/PASSWORD vars are still required by
          # the image's entrypoint even though they're unused in this mode.
          PGADMIN_DEFAULT_EMAIL: pgadmin@example.com
          PGADMIN_DEFAULT_PASSWORD: unused-desktop-mode
          PGADMIN_CONFIG_SERVER_MODE: "False"
          PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
          # Telemetry/update-check off - also keeps the egress policy tight.
          PGADMIN_CONFIG_CHECK_FOR_UPDATES: "False"
          PGADMIN_DISABLE_POSTFIX: "true"
        resources:
          requests:
            cpu: 50m
            memory: 384Mi
          limits:
            cpu: 500m
            memory: 512Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 80

persistence:
  # pgAdmin's own SQLite store: saved server passwords, query history,
  # preferences. Small.
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 512Mi
    storageClass: longhorn
    globalMounts:
      - path: /var/lib/pgadmin
  servers:
    enabled: true
    type: configMap
    name: pgadmin-servers
    globalMounts:
      - path: /pgadmin4/servers.json
        subPath: servers.json
        readOnly: true
