controllers:
  main:
    containers:
      main:
        image:
          repository: docker.io/searxng/searxng
          tag: 2026.9.25-12f8b6515
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false

service:
  # Tailscale-only (see the Ingress in apps/tailscale-operator/manifests/) -
  # ClusterIP, no LAN-wide LoadBalancer like Blocky/AdGuard needed for their
  # DNS ports.
  main:
    controller: main
    ports:
      http:
        port: 8080

persistence:
  # SearXNG stores no user data or query history server-side by design, and
  # /var/cache/searxng (favicon/engine cache) is fine to lose on restart -
  # no PVC needed. The only mount is the seeded settings.yml, which contains
  # server.secret_key and so has to come through the k8s_secrets bridge
  # (see group_vars/all/cluster_secrets.yaml) rather than living here.
  config:
    enabled: true
    type: configMap
    name: searxng-config
    globalMounts:
      - path: /etc/searxng/settings.yml
        subPath: settings.yml
        readOnly: true
