apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: searxng
  namespace: argocd
  annotations:
    # Now has a real PVC dependency (searxng-cache's redis PVCs, see
    # manifests/redis-replication.yaml) and needs redis-operator's CRDs to
    # already exist - moved from wave 1 to strictly after both Longhorn
    # (wave 0) and redis-operator (wave 1), same race class as the
    # VMServiceScrape CRD issue fixed for Blocky.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: home-pi
  destination:
    server: https://kubernetes.default.svc
    namespace: searxng
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  sources:
    - repoURL: https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      targetRevision: 5.2.1
      helm:
        releaseName: searxng
        valueFiles:
          - $values/apps/searxng/values.yaml
    - repoURL: https://github.com/joshdurbin/home-pi-infrastructure.git
      targetRevision: master
      ref: values
    - repoURL: https://github.com/joshdurbin/home-pi-infrastructure.git
      targetRevision: master
      path: apps/searxng/manifests
