# Monitors searxng-cache (redis-replication.yaml) and automatically
# promotes the replica if the master pod dies - real automatic failover at
# the redis layer, same as blocky-cache-sentinel in apps/blocky/manifests/.
# 3 sentinels for a real majority quorum (2 of 3, the default), not 2.
#
# SearXNG itself does NOT talk to these sentinels - unlike Blocky, its
# redis/valkey client only takes a single connection URL with no
# sentinel-discovery support, so roles/k8s_secrets/templates/searxng-config.yaml.j2
# points directly at searxng-cache-0's own pod DNS name instead. That means
# a failover here still happens automatically, but SearXNG's own connection
# won't follow it to the new master - a known, deliberate limitation (see
# redis-replication.yaml's comment), not something this Sentinel fixes.
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: searxng-cache-sentinel
  namespace: searxng-cache
spec:
  clusterSize: 3
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  redisSentinelConfig:
    redisReplicationName: searxng-cache
    masterGroupName: searxng-cache
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v8.10.1
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 64Mi
