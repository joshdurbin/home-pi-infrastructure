# Monitors searxng-cache (redis-replication.yaml) and automatically
# promotes the replica if the master pod dies - real automatic failover at
# the redis layer, same as blocky-cache-sentinel in apps/blocky/manifests/.
# 3 sentinels for a real majority quorum (2 of 3, the default), not 2.
#
# SearXNG itself does NOT talk to these sentinels directly - unlike
# Blocky, its redis/valkey client only takes a single connection URL with
# no sentinel-discovery support. It still finds the current master after a
# failover, though: roles/k8s_secrets/templates/searxng-config.yaml.j2
# points at searxng-cache's own operator-maintained "-master" Service
# (see that file's comment), which this Sentinel is what keeps pointed at
# the right pod as it promotes a replica.
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: searxng-cache-sentinel
  namespace: searxng-cache
spec:
  clusterSize: 3
  # One sentinel per node and at most 1 down at a time, so a drain never costs
  # the 2-of-3 quorum Sentinel needs to promote a replica.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: searxng-cache-sentinel-sentinel
          topologyKey: kubernetes.io/hostname
  pdb:
    enabled: true
    maxUnavailable: 1
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  redisSentinelConfig:
    redisReplicationName: searxng-cache
    masterGroupName: searxng-cache
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v8.10.1
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 64Mi
