# Egress-only restriction (Tailscale reaching SearXNG's web UI is ingress,
# unaffected). Unlike Blocky/AdGuard, there's no small fixed IP set to lock
# 443 down to here - SearXNG's whole purpose is querying many different
# search engines (Google, Bing, DuckDuckGo, Wikipedia, and whatever else is
# enabled), each with their own arbitrary/rotating IPs. So 443 stays broad,
# same rationale as Blocky/AdGuard's blocklist-download rule, just covering
# all of this app's egress instead of one exception within it.
# - 53/udp+tcp to CoreDNS resolves every search engine's hostname.
# - 443/tcp is broad by necessity - this is what the app is for.
# - 6379 to the searxng-cache namespace: SearXNG's own redis/valkey cache
#   (see redis-replication.yaml) - kept in its own namespace specifically
#   so it needed its own egress rule here rather than silently falling
#   under this same policy's podSelector: {}. No 26379 - unlike Blocky,
#   SearXNG never talks to the sentinels directly (see redis-sentinel.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: searxng-egress
  namespace: searxng
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: searxng-cache
      ports:
        - protocol: TCP
          port: 6379
