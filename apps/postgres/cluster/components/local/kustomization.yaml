# Instances pinned to two specific nodes on k3s local-path volumes. See
# ../../kustomization.yaml for the trade-offs.
#
# local-path's WaitForFirstConsumer bakes node affinity into each PV for
# whichever node the pod first lands on, so a restarted pod can only return
# to that node - sticky by construction, no extra provisioner needed.
# Redundancy comes from Postgres streaming replication, not the storage layer.
#
# The two nodes are named by hostname (kubernetes.io/hostname) rather than a
# custom node label - rpi-5-1 and rpi-5-4, Pi 5s whose disks are known to
# handle database I/O. Edit the list below to change them.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
      name: postgres
    patch: |-
      - op: add
        path: /spec/storage/storageClass
        value: local-path
      - op: add
        path: /spec/affinity/nodeAffinity
        value:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [rpi-5-1, rpi-5-4]
