# CloudNativePG's own primary/replica management replaces what would
# otherwise need a hand-assembled Patroni+DCS setup - the operator (see
# apps/cloudnative-pg/) handles failover and promotion itself, and
# maintains <name>-rw/-ro/-r Services that always point at the current
# primary/replicas, which pooler-rw.yaml/pooler-ro.yaml route through.
#
# This is the *base* Cluster: everything except where the instances run and
# what their volumes sit on. That part is a one-line switch in
# kustomization.yaml (this directory) - `components/longhorn` (default:
# volumes on Longhorn, instances float anywhere) or `components/local`
# (volumes on k3s local-path, instances pinned to rpi-5-1/rpi-5-4).
# See kustomization.yaml for how to flip it, and docs/REFERENCE.md's
# Postgres section for the migration steps - changing the mode on a live
# cluster does NOT move existing instances by itself.
#
# instances: 2 - one primary, one streaming-replication replica, promoted
# automatically on primary failure. The required podAntiAffinity below keeps
# them on different nodes in either mode (one Postgres instance per node), so
# a single node loss never takes both.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: postgres
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6

  # No PodDisruptionBudget: with the default (true), CNPG's PDB refuses to
  # evict the primary, so draining the primary's node stalls until someone runs
  # a manual switchover first. With it off, a drain evicts the primary and CNPG
  # fails over to the replica by itself, then re-creates the old primary as a
  # replica on another node (volumes are Longhorn - they follow the pod).
  # Cost: a drain of the primary's node is an abrupt failover (a brief write
  # interruption, connections cut) rather than a clean switchover - and so is
  # any other voluntary eviction of the primary. The postgres namespace is
  # excluded from the descheduler (apps/descheduler/values.yaml) for that
  # reason. (`k3s-maintenance -e` still does a clean switchover first.)
  enablePDB: false

  # When the primary's pod is evicted, Postgres first does a "smart" shutdown:
  # it refuses new connections but waits for existing ones to end, for up to
  # smartShutdownTimeout (default 180s) - during which the primary is up but
  # unusable and NO failover happens (that starts once the primary is down).
  # Keep that window short so a drain turns into a fast shutdown and a prompt
  # promotion of the replica. failoverDelay 0 = promote as soon as the primary
  # is seen unhealthy.
  smartShutdownTimeout: 10
  failoverDelay: 0

  # storage.storageClass is set by the selected component.
  storage:
    size: 10Gi

  # affinity.nodeAffinity is set by the `local` component only.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
