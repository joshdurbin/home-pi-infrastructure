# Read-only login for pgAdmin (apps/pgadmin/) - it can read every database
# on the cluster (pg_read_all_data) but not write or change anything, so a
# stray query in the web UI can't damage an app's data. pgAdmin connects
# through postgres-pooler-ro. Use the `postgres` superuser via kubectl exec
# for anything that needs write access.
#
# Password Secret (pgadmin-db-credentials) is seeded by the k8s_secrets
# Ansible role from the Vault-encrypted pgadmin_db_password - postgres
# namespace only, since pgAdmin prompts for the password in its UI rather
# than reading it from a Secret.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: pgadmin
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: pgadmin
  ensure: present
  login: true
  inRoles:
    - pg_read_all_data
  passwordSecret:
    name: pgadmin-db-credentials
