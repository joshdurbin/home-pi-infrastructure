# Two separate policies, deliberately NOT one podSelector: {} covering the
# whole namespace - a single broad policy would also lock down the ProxySQL
# pods' own ingress, which defeats the point of having them: application
# pods (in many namespaces) need to be able to reach the proxy freely, and the
# ProxySQL operator (proxysql-system) needs its admin port. Only the actual
# Postgres instance pods get locked down to "proxy + operator + monitoring
# only" - everything else in this namespace (the proxy) follows this repo's
# normal pattern of an egress-only restriction with ingress deliberately left
# open (same shape as apps/blocky/manifests/networkpolicy.yaml etc.).

# Postgres instance pods: "applications connect through the proxy, never
# to the databases directly" enforced at the network layer, not just
# convention - only the ProxySQL pods, the cnpg-system operator, and
# monitoring's vmagent may reach these pods at all.
#
# podSelector matches on cnpg.io/podRole: instance, not just cnpg.io/cluster.
# This was confirmed live (broke Temporal's first rollout) back when CNPG
# Poolers existed: CNPG labels those pods with cnpg.io/cluster too, so
# cnpg.io/cluster alone also matched them. There are no Poolers now, but
# podRole is still the precise selector for "a Postgres instance", so it stays.
#
# Ports, confirmed against CloudNativePG's own networking docs:
# - 5432 (postgres) + 8000 (instance manager) from cnpg-system: the
#   operator needs both to manage/coordinate each instance.
# - 5432 from the ProxySQL pods (proxysql.com/cluster label) - the actual
#   client-facing path applications use, and ProxySQL's own health checks.
# - 9187 (metrics) from monitoring's vmagent.
# - 5432 from other postgres-cluster pods, for streaming replication once
#   instances: 2 gives this cluster a primary and a replica.
#
# Egress: CoreDNS, the Kubernetes API server (CNPG's instance manager talks
# to it directly for coordination), and other postgres-cluster pods for
# replication.
#
# Confirmed live (broke the first real rollout): an ipBlock targeting the
# "kubernetes" Service's ClusterIP (10.43.0.1:443) does NOT work here - for
# pod-originated traffic, kube-proxy's DNAT rewrites the destination to a
# real backend IP:port before the packet ever reaches the point where
# NetworkPolicy evaluates ipBlock rules, so a ClusterIP-targeted ipBlock
# never actually matches any real packet. The instance manager's own logs
# showed "dial tcp 10.43.0.1:443: connect: connection refused" - not a
# timeout, which is what pointed at NetworkPolicy specifically (a dropped
# packet times out; this was an active reject from no rule matching).
# Fixed by targeting the real control-plane node IPs on the real apiserver
# port (6443, not 443 - that's only the Service's own port) instead - a
# well-documented general NetworkPolicy + Kubernetes Service gotcha, not
# specific to CNPG. k3s's server nodes are the API server itself (embedded
# in the k3s process, not a Pod), so this can't be a podSelector either.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-cluster-network
  namespace: postgres
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
      cnpg.io/podRole: instance
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              proxysql.com/cluster: postgres-proxy
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - protocol: TCP
          port: 6443
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - protocol: TCP
          port: 5432
---
# The ProxySQL pods - egress-only, ingress deliberately unrestricted (see
# comment above): applications elsewhere in the cluster need to reach the
# proxy freely, the ProxySQL operator needs its admin port (6032), and
# monitoring's vmagent its metrics port (6070). Only bounds what the proxy
# itself can reach: CoreDNS, the postgres Cluster's own pods (to actually
# proxy to Postgres - the postgres-rw/-ro Services resolve to those pods), and
# the other ProxySQL pods on the admin port (ProxySQL Cluster config sync).
# Unlike the CNPG Poolers this replaces, ProxySQL never talks to the
# Kubernetes API (the operator does, from proxysql-system), so no API-server
# ipBlock is needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-proxy-egress
  namespace: postgres
spec:
  podSelector:
    matchLabels:
      proxysql.com/cluster: postgres-proxy
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              proxysql.com/cluster: postgres-proxy
      ports:
        - protocol: TCP
          port: 6032
