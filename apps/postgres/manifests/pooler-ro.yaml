# Read-only endpoint: routes to replicas only, via CNPG's own
# "postgres-ro" Service. Now that cluster.yaml's instances: 2 gives this
# cluster an actual replica (rpi-5-1 + rpi-5-4), this Service has a live
# backend to route to.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: postgres-pooler-ro
  namespace: postgres
spec:
  cluster:
    name: postgres
  type: ro
  instances: 1
  pgbouncer:
    poolMode: session
