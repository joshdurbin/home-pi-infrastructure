# CloudNativePG instances: confirmed against CloudNativePG's own docs/examples
# as needing no extra enabling - metrics are always available on this port,
# with no Prometheus Operator CRD required. Hand-written
# VMPodScrapes rather than CNPG's own PodMonitor-based examples, same
# reasoning as apps/cloudnative-pg/manifests/vmpodscrape.yaml.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: postgres-cluster
  namespace: postgres
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
---
# ProxySQL's built-in Prometheus endpoint (REST API, port 6070, named
# "metrics" on the pod), enabled by default by the operator. Series are
# prefixed proxysql_ (connection counts per protocol, questions, backend
# status, memory per module). Scraped per pod, not through the Service, which
# would sample one pod per scrape.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: postgres-proxy
  namespace: postgres
spec:
  selector:
    matchLabels:
      proxysql.com/cluster: postgres-proxy
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
