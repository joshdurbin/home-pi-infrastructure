apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  annotations:
    # Needs cloudnative-pg's CRDs (Cluster, Pooler) to exist first, and its
    # Cluster's PVC uses local-path (k3s's own built-in StorageClass,
    # always present) rather than Longhorn - no dependency on apps/longhorn.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: home-pi
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  # No chart source - a Cluster/Pooler CR is a complete manifest on its
  # own, nothing to template. Same shape as apps/blocky/manifests's
  # redis-replication.yaml etc.
  sources:
    - repoURL: https://github.com/joshdurbin/home-pi-infrastructure.git
      targetRevision: master
      path: apps/postgres/manifests
