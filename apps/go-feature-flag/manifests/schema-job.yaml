# Creates the go_feature_flag table before the relay proxy starts. The relay
# proxy reads it but does not create it, and "startWithRetrieverError: false"
# would crash-loop it on a missing table. Runs as an Argo CD PreSync hook, so it
# completes before the Deployment is applied; idempotent (IF NOT EXISTS), so
# re-running on every sync is harmless. It retries until Postgres and the
# `go_feature_flag` database (created by apps/postgres, same sync wave) exist.
#
# Schema is the relay proxy's documented one (flag_name, flagset, config JSONB),
# with gen_random_uuid() (built in since PG13) instead of uuid_generate_v4() so no
# extension is needed, and a unique (flagset, flag_name) so a flag can't be
# defined twice in a flag set.
apiVersion: batch/v1
kind: Job
metadata:
  name: go-feature-flag-schema
  namespace: go-feature-flag
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  activeDeadlineSeconds: 1200
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          # The CNPG postgres image already used by the cluster (has psql).
          image: ghcr.io/cloudnative-pg/postgresql:18.6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: PGHOST
              value: postgres-pooler-rw.postgres.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: go_feature_flag
            - name: PGSSLMODE
              value: require
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: goff-db-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: goff-db-credentials
                  key: password
          command:
            - sh
            - -c
            - |
              set -eu
              until psql -v ON_ERROR_STOP=1 -qAt -c 'select 1' >/dev/null 2>&1; do
                echo "waiting for Postgres / the go_feature_flag database..."
                sleep 5
              done
              psql -v ON_ERROR_STOP=1 <<'SQL'
              CREATE TABLE IF NOT EXISTS go_feature_flag (
                id        UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                flag_name VARCHAR(255) NOT NULL,
                flagset   VARCHAR(255) NOT NULL,
                config    JSONB NOT NULL,
                CONSTRAINT go_feature_flag_flagset_flag_name_key UNIQUE (flagset, flag_name)
              );
              SQL
              echo "go_feature_flag table ready"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
