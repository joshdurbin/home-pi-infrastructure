# Landing page linking out to every other Ingress in this file
# (apps/homepage/manifests/configmap.yaml) - hostname "home" rather than
# "homepage" so it reads naturally as the tailnet's actual home page
# (https://home.<tailnet>.ts.net). Service name "homepage" confirmed by the
# app-template chart convention already used by every other single-service
# app here (controller/service key "main" -> Service named after the
# release, see searxng/redisinsight above).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home
  namespace: homepage
  annotations:
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [home]
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
