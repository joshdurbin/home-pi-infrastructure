apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
  annotations:
    # Its Ingresses reference Services in every other app's namespace
    # (monitoring, longhorn, blocky) - not a hard dependency (a dangling
    # Ingress backend is valid, just unreachable until the Service shows up),
    # but syncing last avoids that transient state on a fresh bootstrap.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: home-pi
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.102.4
      helm:
        releaseName: tailscale-operator
        valueFiles:
          - $values/apps/tailscale-operator/values.yaml
    - repoURL: git://192.168.1.57/home-pi-infrastructure
      targetRevision: master
      ref: values
    - repoURL: git://192.168.1.57/home-pi-infrastructure
      targetRevision: master
      path: apps/tailscale-operator/manifests
