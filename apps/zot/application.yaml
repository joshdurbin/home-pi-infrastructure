apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zot
  namespace: argocd
  annotations:
    # Wave 0, alongside Longhorn, so it comes up before every other app and the
    # image pulls those make can already be cached. Its volume is a Longhorn PVC but
    # that does not deadlock: the PVC just stays Pending until Longhorn (same wave,
    # syncing in parallel) is ready, then binds. Pulls made before Zot is up simply
    # go to the upstream registry (the node-level fallback), so the order only affects
    # how warm the cache is, never whether anything starts.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: home-pi
  destination:
    server: https://kubernetes.default.svc
    namespace: zot
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  sources:
    - repoURL: https://zotregistry.dev/helm-charts
      chart: zot
      targetRevision: 0.1.128
      helm:
        releaseName: zot
        valueFiles:
          - $values/apps/zot/values.yaml
    - repoURL: https://github.com/joshdurbin/home-pi-infrastructure.git
      targetRevision: master
      ref: values
    - repoURL: https://github.com/joshdurbin/home-pi-infrastructure.git
      targetRevision: master
      path: apps/zot/manifests
