# Longhorn's own chart bundles a whitelist-only NetworkPolicy on
# longhorn-manager pods (networkPolicies.restrictInternalTraffic: true,
# on by default and independent of this repo's own networkPolicies.enabled,
# which we never set) that does NOT allow vmagent - confirmed live: `ss
# -tlnp` inside a longhorn-manager pod shows :9500 listening, but a curl
# from another pod (even scheduled on the same node) gets Connection
# refused. NetworkPolicies selecting the same pods are additive/OR'd, so
# this doesn't need to fight or override the chart's own policy - it just
# adds the one missing allow rule, same shape as this repo's other
# cross-namespace scrape-access rules (see apps/blocky/manifests's redis
# NetworkPolicy additions).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-allow-vmagent
  namespace: longhorn
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - protocol: TCP
          port: 9500
