apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: home-pi
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.12.1
      helm:
        valueFiles:
          - $values/apps/longhorn/values.yaml
    - repoURL: git://192.168.1.57/home-pi-infrastructure
      targetRevision: master
      ref: values
