# The built-in `view` role (values.yaml) covers namespaced resources only, so
# Headlamp can't see cluster-scoped storage, nodes, etc. This adds read-only
# (get/list/watch) access to those, bound to Headlamp's ServiceAccount. No
# Secrets, no writes, nothing that isn't already visible via `kubectl get`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-cluster-read
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources:
      - storageclasses
      - volumeattributesclasses
      - volumeattachments
      - csidrivers
      - csinodes
      - csistoragecapacities
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [get, list, watch]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  # Gateway API (GatewayClass, Gateway, HTTPRoute, GRPCRoute, TLSRoute,
  # ReferenceGrant, BackendTLSPolicy, ...) - every kind in the group, so new
  # ones show up without editing this.
  - apiGroups: [gateway.networking.k8s.io, gateway.networking.x-k8s.io]
    resources: ["*"]
    verbs: [get, list, watch]
  # RBAC objects themselves (not `view`-visible): who can do what. Reading
  # these reveals permissions, not credentials.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-cluster-read
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
