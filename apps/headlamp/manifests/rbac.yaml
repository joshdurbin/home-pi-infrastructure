# The identity you log in to Headlamp as. Mint a short-lived token on demand
# (nothing long-lived is stored anywhere):
#
#   kubectl -n headlamp create token headlamp-admin --duration=8h
#
# and paste it into Headlamp's login screen. cluster-admin is deliberate for
# a single-operator homelab; swap the roleRef for `view` for a read-only UI.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: headlamp
