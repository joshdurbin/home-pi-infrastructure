apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ladder
  namespace: argocd
  # Stateless (no PVC, no database), so a cascade delete on removal can never lose data.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Depends on nothing: it only fetches pages from the internet.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: home-pi
  destination:
    server: https://kubernetes.default.svc
    namespace: ladder
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  sources:
    # No chart of its own, so the generic app-template (same as WhoDB/SearXNG) running the
    # official image directly.
    - repoURL: https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      targetRevision: 5.3.0
      helm:
        releaseName: ladder
        valueFiles:
          - $values/apps/ladder/values.yaml
    - repoURL: https://github.com/joshdurbin/home-pi-infrastructure.git
      targetRevision: master
      ref: values
    - repoURL: https://github.com/joshdurbin/home-pi-infrastructure.git
      targetRevision: master
      path: apps/ladder/manifests
