# UnPoller's Prometheus endpoint. vmagent picks it up automatically (selectAllByDefault).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: unpoller
  namespace: unpoller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: unpoller
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
