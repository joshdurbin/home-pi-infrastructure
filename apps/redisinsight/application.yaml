apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redisinsight
  namespace: argocd
  annotations:
    # Has its own PVC (Longhorn, wave 0) and needs blocky-cache/searxng-cache
    # to already exist as namespaces for its egress NetworkPolicy to target
    # via namespaceSelector - both are created at wave 2 (apps/blocky,
    # apps/searxng). No CRDs of its own kind to race against, but staying
    # at the same tier as every other end-user-facing app here.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: home-pi
  destination:
    server: https://kubernetes.default.svc
    namespace: redisinsight
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  sources:
    - repoURL: https://bjw-s-labs.github.io/helm-charts
      chart: app-template
      targetRevision: 5.2.1
      helm:
        releaseName: redisinsight
        valueFiles:
          - $values/apps/redisinsight/values.yaml
    - repoURL: https://github.com/joshdurbin/home-pi-infrastructure.git
      targetRevision: master
      ref: values
    - repoURL: https://github.com/joshdurbin/home-pi-infrastructure.git
      targetRevision: master
      path: apps/redisinsight/manifests
