# Egress-only, same shape as every other app's NetworkPolicy in this repo -
# ingress (Tailscale reaching RedisInsight's web UI) is unaffected and
# allowed by default, this only bounds what this pod can reach out to:
# - CoreDNS, needed to resolve blocky-cache-master/searxng-cache-master's
#   Service DNS names.
# - blocky-cache and searxng-cache namespaces on 6379 - the two
#   pre-configured connections in pre-setup-databases-configmap.yaml.
# No 26379 (sentinel) - RedisInsight never talks to sentinel directly, only
# to each cluster's own "-master" Service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redisinsight-egress
  namespace: redisinsight
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: blocky-cache
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: searxng-cache
      ports:
        - protocol: TCP
          port: 6379
