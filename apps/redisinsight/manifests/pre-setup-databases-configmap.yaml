# Fields verified directly against RedisInsight's own source
# (pre-setup.discovery.util.ts): id, host, port, db, name, username,
# password, tls, compressor, caCert, clientCert, verifyServerCert. Neither
# of this cluster's redis instances has a password, so username/password
# are omitted rather than set to empty strings.
#
# host/port point at each RedisReplication's own "-master" Service (not a
# specific pod, and not Sentinel directly - this pre-setup mechanism has no
# Sentinel fields at all) - confirmed live that the redis-operator keeps
# this Service's endpoint pointed at whichever pod is actually master:
#   kubectl -n blocky-cache get redisreplication blocky-cache -o jsonpath='{.status.connectionInfo}'
#   -> {"host":"blocky-cache-master.blocky-cache.svc.cluster.local","port":6379}
# i.e. this is the CR's own documented recommended connection endpoint, not
# a guessed shortcut.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redisinsight-pre-setup-databases
  namespace: redisinsight
data:
  databases.json: |
    [
      {
        "id": "blocky-cache",
        "name": "blocky-cache",
        "host": "blocky-cache-master.blocky-cache.svc.cluster.local",
        "port": 6379
      },
      {
        "id": "searxng-cache",
        "name": "searxng-cache",
        "host": "searxng-cache-master.searxng-cache.svc.cluster.local",
        "port": 6379
      }
    ]
