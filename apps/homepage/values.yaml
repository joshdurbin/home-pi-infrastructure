# No official Helm chart exists for Homepage (gethomepage/homepage ships
# only Docker Compose / plain `docker run` instructions, confirmed against
# its own repo) - same generic `bjw-s-labs/app-template` chart already used
# for Blocky/SearXNG/WhoDB instead, running the official
# ghcr.io/gethomepage/homepage image directly.
controllers:
  main:
    # Static config, no state. One replica: a drain just reschedules it
    # (~10-30s) - a dashboard blip is accepted.
    replicas: 1
    # app-template defaults to Recreate (kill the old pod, then start the new
    # one) - an outage on every update. Start the new pod first and only then
    # stop the old one (surge 1, unavailable 0).
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: 0
      surge: 1
    containers:
      main:
        image:
          repository: ghcr.io/gethomepage/homepage
          tag: v2.4.0
        envFrom:
          # HOMEPAGE_VAR_TAILNET_DOMAIN (substituted into services.yaml
          # below via Homepage's own {{HOMEPAGE_VAR_*}} syntax, confirmed
          # against its config.js source) and HOMEPAGE_ALLOWED_HOSTS
          # (required as of Homepage v1.0 for any access that isn't
          # localhost, confirmed against its installation docs) both
          # depend on this tailnet's hostname, which isn't known here -
          # same reasoning as searxng_secret_key, seeded by the k8s_secrets
          # bridge instead (group_vars/all/cluster_secrets.yaml) rather
          # than hardcoded in this git-committed file.
          - configMapRef:
              name: homepage-env
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false

service:
  main:
    controller: main
    ports:
      http:
        port: 3000

# Homepage's config files, as a chart-owned ConfigMap (rather than a separate
# manifest in manifests/) so app-template can hash it into a pod annotation:
# any change here restarts the pod, which the subPath mounts below need to
# pick it up (Kubernetes never refreshes subPath mounts in a running pod).
#
# Fully static and portable - no credentials, no per-cluster values. The one
# per-cluster thing (this tailnet's hostname) is Homepage's own runtime
# env-var substitution, {{HOMEPAGE_VAR_TAILNET_DOMAIN}} (confirmed against
# its config.js source: a literal replaceAll of "{{HOMEPAGE_VAR_<name>}}"
# against every HOMEPAGE_VAR_-prefixed env var, across every config file,
# before parsing YAML) - the value comes from the HOMEPAGE_VAR_TAILNET_DOMAIN
# env var seeded by the k8s_secrets bridge (group_vars/all/cluster_secrets.yaml,
# wired in via envFrom above).
#
# app-template runs every string containing "{{" through Helm's tpl, which
# would try to evaluate that placeholder, so services.yaml defines it once as
# a Go-template string ($d) and each entry references {{ $d }} - rendered
# output is byte-for-byte the placeholder Homepage expects.
configMaps:
  config:
    enabled: true
    data:
      settings.yaml: |
        title: Home Pi Infrastructure
        theme: dark
        headerStyle: clean
        hideVersion: true

      bookmarks.yaml: |
        []

      widgets.yaml: |
        []

      # One entry per Ingress already in
      # apps/tailscale-operator/manifests/ingresses.yaml - add a service here
      # (and commit) whenever a new one is added there, same "no Ansible run
      # needed" workflow that file's own docs/REFERENCE.md section describes.
      # Icons are all bundled `mdi-` (Material Design Icons shipped in the
      # Homepage image itself) rather than the slug-based icons Homepage
      # fetches from an external CDN - keeps this pod's NetworkPolicy
      # (manifests/networkpolicy.yaml) from needing broad egress just to draw
      # icons.

      services.yaml: |
        {{- $d := "{{HOMEPAGE_VAR_TAILNET_DOMAIN}}" }}
        ---
        - Platform:
            - Argo CD:
                href: https://argocd.{{ $d }}
                description: GitOps continuous delivery
                icon: mdi-infinity

        - Monitoring:
            - Grafana:
                href: https://grafana.{{ $d }}
                description: Dashboards
                icon: mdi-chart-box-outline
            - Alertmanager:
                href: https://alertmanager.{{ $d }}
                description: Alert routing
                icon: mdi-bell-alert-outline
            - VictoriaMetrics:
                href: https://victoriametrics.{{ $d }}/vmui/
                description: Metrics backend
                icon: mdi-chart-line

        - Logging:
            - OpenSearch Dashboards:
                href: https://opensearch.{{ $d }}
                description: Log search and visualization
                icon: mdi-text-search

        - Storage:
            - Longhorn:
                href: https://longhorn.{{ $d }}
                description: Distributed block storage
                icon: mdi-harddisk

        - Network:
            - Blocky:
                href: https://blocky.{{ $d }}
                description: DNS / ad-blocking metrics
                icon: mdi-shield-check-outline

        - Apps:
            - SearXNG:
                href: https://search.{{ $d }}
                description: Metasearch engine
                icon: mdi-magnify
            - Temporal:
                href: https://temporal.{{ $d }}
                description: Workflow orchestration
                icon: mdi-sync-circle
            - Open WebUI:
                href: https://chat.{{ $d }}
                description: LLM chat interface
                icon: mdi-chat-processing-outline
            - WhoDB:
                href: https://whodb.{{ $d }}
                description: Postgres, OpenSearch and Redis browser (read-only)
                icon: mdi-database-search-outline
            - LiteLLM:
                href: https://litellm.{{ $d }}/ui
                description: LLM gateway (API, keys, spend)
                icon: mdi-router-network
            - Feature Flags:
                href: https://flags.{{ $d }}/swagger/index.html
                description: GO Feature Flag - evaluation console (edit flags in WhoDB)
                icon: mdi-flag-outline

persistence:
  config:
    enabled: true
    type: configMap
    # The chart-managed ConfigMap above (rendered as `homepage`), not an external one.
    identifier: config
    globalMounts:
      - path: /app/config/settings.yaml
        subPath: settings.yaml
        readOnly: true
      - path: /app/config/services.yaml
        subPath: services.yaml
        readOnly: true
      - path: /app/config/bookmarks.yaml
        subPath: bookmarks.yaml
        readOnly: true
      - path: /app/config/widgets.yaml
        subPath: widgets.yaml
        readOnly: true
