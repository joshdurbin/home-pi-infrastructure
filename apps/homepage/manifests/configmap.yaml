# Fully static and portable - no credentials, no per-cluster values. The
# one thing that is per-cluster (this tailnet's hostname) is referenced as
# {{HOMEPAGE_VAR_TAILNET_DOMAIN}} below, Homepage's own runtime env-var
# substitution syntax (confirmed against its config.js source: it does a
# literal replaceAll of "{{HOMEPAGE_VAR_<name>}}" against every
# HOMEPAGE_VAR_-prefixed env var, across every config file, before parsing
# YAML) - the actual value comes from the HOMEPAGE_VAR_TAILNET_DOMAIN env
# var seeded by the k8s_secrets bridge (group_vars/all/cluster_secrets.yaml,
# wired in via apps/homepage/values.yaml's envFrom). Nothing here needs
# Ansible templating.
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Home Pi Infrastructure
    theme: dark
    headerStyle: clean
    hideVersion: true

  bookmarks.yaml: |
    []

  widgets.yaml: |
    []

  # One entry per Ingress already in
  # apps/tailscale-operator/manifests/ingresses.yaml - add a service here
  # (and commit) whenever a new one is added there, same "no Ansible run
  # needed" workflow that file's own docs/REFERENCE.md section describes.
  # Icons are all bundled `mdi-` (Material Design Icons shipped in the
  # Homepage image itself) rather than the slug-based icons Homepage
  # fetches from an external CDN - keeps this pod's NetworkPolicy
  # (manifests/networkpolicy.yaml) from needing broad egress just to draw
  # icons.
  services.yaml: |
    ---
    - Platform:
        - Argo CD:
            href: https://argocd.{{HOMEPAGE_VAR_TAILNET_DOMAIN}}
            description: GitOps continuous delivery
            icon: mdi-infinity

    - Monitoring:
        - Grafana:
            href: https://grafana.{{HOMEPAGE_VAR_TAILNET_DOMAIN}}
            description: Dashboards
            icon: mdi-chart-box-outline
        - Alertmanager:
            href: https://alertmanager.{{HOMEPAGE_VAR_TAILNET_DOMAIN}}
            description: Alert routing
            icon: mdi-bell-alert-outline
        - VictoriaMetrics:
            href: https://victoriametrics.{{HOMEPAGE_VAR_TAILNET_DOMAIN}}
            description: Metrics backend
            icon: mdi-chart-line

    - Logging:
        - OpenSearch Dashboards:
            href: https://opensearch.{{HOMEPAGE_VAR_TAILNET_DOMAIN}}
            description: Log search and visualization
            icon: mdi-text-search

    - Storage:
        - Longhorn:
            href: https://longhorn.{{HOMEPAGE_VAR_TAILNET_DOMAIN}}
            description: Distributed block storage
            icon: mdi-harddisk

    - Network:
        - Blocky:
            href: https://blocky.{{HOMEPAGE_VAR_TAILNET_DOMAIN}}
            description: DNS / ad-blocking metrics
            icon: mdi-shield-check-outline

    - Apps:
        - SearXNG:
            href: https://search.{{HOMEPAGE_VAR_TAILNET_DOMAIN}}
            description: Metasearch engine
            icon: mdi-magnify
        - Temporal:
            href: https://temporal.{{HOMEPAGE_VAR_TAILNET_DOMAIN}}
            description: Workflow orchestration
            icon: mdi-sync-circle
        - Open WebUI:
            href: https://chat.{{HOMEPAGE_VAR_TAILNET_DOMAIN}}
            description: LLM chat interface
            icon: mdi-chat-processing-outline
        - WhoDB:
            href: https://whodb.{{HOMEPAGE_VAR_TAILNET_DOMAIN}}
            description: Postgres, OpenSearch and Redis browser (read-only)
            icon: mdi-database-search-outline
